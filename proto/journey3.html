<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الرحلة كاملة · لمجد الله</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#17191E;--ink2:#23262D;--paper:#FAF8F4;--cream:#F2EEE6;--line:#E4DED3;--soft:#6E6A63;--faint:#A29C92;--accent:#8C2F1E;--gold:#B39459;--gold2:#D7C49A;--navy:#1F2A44}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d0e11}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:var(--ink);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
#shell{position:fixed;inset:0;max-width:520px;margin:0 auto;background:var(--paper);overflow:hidden}
.view{position:absolute;inset:0 0 64px 0;overflow-y:auto;display:none}
.view.on{display:block}
#nav{position:absolute;bottom:0;inset-inline:0;height:64px;background:var(--paper);border-top:1px solid var(--line);display:flex;z-index:10}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:'Readex Pro';font-size:12px;color:var(--faint)}
#nav button[aria-current=true]{color:var(--ink)}
#nav button[aria-current=true] .ic{stroke-width:2}

/* ---------- book page ---------- */
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 22px 0;font-family:'Readex Pro';font-size:13px;color:var(--soft)}
.top b{font-weight:500;color:var(--ink);letter-spacing:.2px}
.bk{padding:30px 22px 8px}
.bk .ey{font-family:'Readex Pro';font-size:12.5px;color:var(--accent);letter-spacing:.4px}
.bk h1{font-family:'Noto Naskh Arabic';font-weight:700;font-size:40px;line-height:1.25;margin:6px 0 8px}
.bk p{margin:0;font-size:16.5px;line-height:1.85;color:#3b3934}
.prog{display:flex;align-items:center;gap:12px;margin:22px 0 0;font-family:'Readex Pro';font-size:12.5px;color:var(--soft)}
.prog .bar{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--ink)}
.cta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 22px 6px;padding:16px 18px;background:var(--ink);color:#fff;border-radius:16px;width:calc(100% - 44px);text-align:start}
.cta small{display:block;font-family:'Readex Pro';font-size:12px;opacity:.6;margin-bottom:2px}
.cta b{font-family:'Readex Pro';font-weight:500;font-size:16.5px}
.toc{padding:10px 22px 40px}
.toc h2{font-family:'Readex Pro';font-weight:500;font-size:12.5px;color:var(--faint);letter-spacing:.4px;margin:26px 0 6px;padding-bottom:8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.row{display:flex;align-items:baseline;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);width:100%;text-align:start}
.row .n{font-family:'Readex Pro';font-size:14px;color:var(--faint);width:24px;flex:none}
.row .t{flex:1;font-size:16.5px;line-height:1.5}
.row .s{font-family:'Readex Pro';font-size:11.5px;color:var(--faint)}
.row.done .n{color:var(--gold)}
.row.cur{background:linear-gradient(90deg,transparent,var(--cream) 30%);margin:0 -22px;padding-inline:22px;width:calc(100% + 44px)}
.row.cur .n{color:var(--accent);font-weight:600}
.row.cur .s{color:var(--accent)}


/* ---------- splash ---------- */
#splash{position:absolute;inset:0;z-index:100;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 30px;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
#splash .wm{font-family:'Readex Pro';font-size:13px;letter-spacing:2px;color:var(--gold2);opacity:0;animation:fin .8s .2s forwards}
#splash .vs{font-family:'Noto Naskh Arabic';font-size:30px;line-height:1.9;margin:26px 0 8px;opacity:0;animation:fin 1s .7s forwards}
#splash .rf{font-family:'Readex Pro';font-size:13px;opacity:0;animation:fin .8s 1.3s forwards;color:#9a978f}
#splash .ln{width:1px;height:0;background:var(--gold);margin:30px auto;animation:grow 1s 1.5s forwards}
#splash button{height:50px;padding:0 30px;border-radius:12px;background:var(--paper);color:var(--ink);font-family:'Readex Pro';font-weight:500;font-size:15.5px;opacity:0;animation:fin .8s 2s forwards}
#splash small{margin-top:16px;font-family:'Readex Pro';font-size:12px;color:#6f6c66;opacity:0;animation:fin .8s 2.2s forwards}
@keyframes fin{to{opacity:1}}
@keyframes grow{to{height:56px}}

/* ---------- home ---------- */
.hhead{display:flex;justify-content:center;padding:18px 0 0;font-family:'Readex Pro';font-size:12.5px;letter-spacing:2px;color:var(--gold)}
.hverse{padding:34px 26px 6px;text-align:center}
.hverse .s{font-family:'Noto Naskh Arabic';font-size:26px;line-height:1.9}
.hverse small{display:block;font-family:'Readex Pro';font-size:12.5px;color:var(--faint);margin-top:4px}
.sec-t{font-family:'Readex Pro';font-size:12.5px;color:var(--faint);letter-spacing:.4px;margin:30px 22px 10px}
.cont{margin:22px 22px 0;width:calc(100% - 44px);text-align:start;background:var(--ink);color:#fff;border-radius:18px;padding:18px;display:block}
.cont small{font-family:'Readex Pro';font-size:12px;opacity:.6}
.cont .big{display:flex;align-items:baseline;gap:12px;margin-top:4px}
.cont .big b{font-family:'Noto Naskh Arabic';font-size:44px;line-height:1;color:var(--gold2)}
.cont .big span{font-family:'Noto Naskh Arabic';font-weight:700;font-size:21px;line-height:1.35}
.cont .pb{height:2px;background:rgba(255,255,255,.15);margin-top:16px}
.cont .pb i{display:block;height:100%;background:var(--gold2)}
.cont .meta{display:flex;justify-content:space-between;font-family:'Readex Pro';font-size:11.5px;opacity:.55;margin-top:8px}
.tst{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 22px}
.tst button{border:1px solid var(--line);border-radius:16px;padding:18px 14px;text-align:start;background:#fff;min-height:140px;display:flex;flex-direction:column;justify-content:space-between}
.tst b{font-family:'Noto Naskh Arabic';font-weight:700;font-size:22px;line-height:1.3}
.tst small{font-family:'Readex Pro';font-size:12px;color:var(--faint)}
.tst span{font-size:13.5px;color:var(--soft);line-height:1.6}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 22px 30px}
.quick button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:14px;font-family:'Readex Pro';font-size:14.5px;background:#fff}

/* ---------- screen header ---------- */
.sh{position:sticky;top:0;z-index:5;display:flex;align-items:center;height:56px;padding:0 6px;background:rgba(250,248,244,.95);backdrop-filter:blur(8px)}
.sh .t{flex:1;text-align:center;font-family:'Readex Pro';font-weight:500;font-size:16px}
.sh button{min-width:44px;height:44px;display:grid;place-items:center;font-family:'Readex Pro';font-size:13.5px;color:var(--soft);padding:0 8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 22px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);font-family:'Readex Pro';font-size:13.5px;color:var(--soft);background:#fff}
.chips button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---------- carousel ---------- */
.car{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:14px 11% 18px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.car::-webkit-scrollbar{display:none}
.cc{flex:none;width:78%;scroll-snap-align:center;border-radius:20px;background:#fff;border:1px solid var(--line);padding:20px 20px 18px;text-align:start;display:flex;flex-direction:column;min-height:440px;box-shadow:0 1px 0 var(--line);transition:transform .25s,box-shadow .25s,opacity .25s;opacity:.55;transform:scale(.95)}
.cc.on{opacity:1;transform:none;box-shadow:0 18px 40px rgba(23,25,30,.10)}
.cc .k{display:flex;justify-content:space-between;align-items:center;font-family:'Readex Pro';font-size:12px;color:var(--faint)}
.cc .st{font-family:'Readex Pro';font-size:11.5px;padding:2px 10px;border-radius:6px;border:1px solid currentColor}
.cc .st.done{color:var(--gold)}.cc .st.next{color:var(--accent)}
.cc .num{font-family:'Noto Naskh Arabic';font-weight:700;font-size:96px;line-height:1.05;color:var(--ink);margin:10px 0 0}
.cc h3{font-family:'Noto Naskh Arabic';font-weight:700;font-size:24px;line-height:1.4;margin:6px 0 10px}
.cc p{margin:0;font-size:15px;line-height:1.8;color:#4d4a44;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.cc .kv2{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.cc .kv2 .s{font-family:'Noto Naskh Arabic';font-size:16px;line-height:1.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cc .kv2 small{font-family:'Readex Pro';font-size:11px;color:var(--faint)}
.cc .ft{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-family:'Readex Pro';font-size:12px;color:var(--faint)}
.cc .ft .go{height:38px;padding:0 16px;border-radius:10px;background:var(--ink);color:#fff;font-size:13.5px;display:flex;align-items:center;gap:6px}
.cc.book .num{font-size:44px;line-height:1.3;margin-top:22px}
.cc.book h3{font-family:'Readex Pro';font-weight:400;font-size:13px;color:var(--faint);margin:0}
.scrub{display:flex;gap:4px;overflow-x:auto;padding:4px 22px 14px;scrollbar-width:none}
.scrub::-webkit-scrollbar{display:none}
.scrub button{flex:none;width:34px;height:40px;border-radius:8px;font-family:'Readex Pro';font-size:13px;color:var(--faint);position:relative}
.scrub button.d{color:var(--gold)}
.scrub button.on{background:var(--ink);color:#fff}
.scrub button.nx:after{content:"";position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.secl{text-align:center;font-family:'Readex Pro';font-size:12.5px;color:var(--accent);letter-spacing:.3px;margin-top:6px;min-height:18px}
.readbtn{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 22px 26px;width:calc(100% - 44px);height:52px;border-radius:14px;background:var(--ink);color:#fff;font-family:'Readex Pro';font-weight:500;font-size:15.5px}
.ppl-chip{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.ppl-chip span{font-family:'Readex Pro';font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--soft)}

/* ---------- chapter story ---------- */
#story{position:absolute;inset:0;z-index:30;display:none;background:var(--paper)}
#story.on{display:block}
.bars{position:absolute;top:12px;inset-inline:16px;display:flex;gap:3px;z-index:6}
.bars i{flex:1;height:2px;background:rgba(128,128,128,.28)}
.bars i.on{background:currentColor}
.stop{position:absolute;top:20px;inset-inline:8px;display:flex;align-items:center;justify-content:space-between;z-index:6;font-family:'Readex Pro';font-size:13px;padding-top:4px}
.stop button{width:42px;height:42px;display:grid;place-items:center;border-radius:12px}
.card{position:absolute;inset:0;padding:84px 28px 112px;display:flex;flex-direction:column;justify-content:center;opacity:0;pointer-events:none;transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1);transform:translateX(var(--from,0))}
.card>*{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.card.on{opacity:1;pointer-events:auto;transform:none}
.lab{font-family:'Readex Pro';font-size:12px;letter-spacing:.6px;opacity:.65;margin-bottom:14px;display:flex;gap:10px;align-items:center}
.lab:before{content:"";width:22px;height:1px;background:currentColor;opacity:.6}
.card h1{font-family:'Noto Naskh Arabic';font-weight:700;font-size:40px;line-height:1.3;margin:0}
.card h2{font-family:'Noto Naskh Arabic';font-weight:700;font-size:28px;line-height:1.4;margin:0 0 18px}
.card p{font-size:18px;line-height:1.85;margin:0}
.card ol{list-style:none;padding:0;margin:0;counter-reset:k}
.card ol li{counter-increment:k;display:flex;gap:16px;padding:14px 0;border-top:1px solid rgba(128,128,128,.25);font-size:17px;line-height:1.7}
.card ol li:before{content:counter(k, arabic-indic);font-family:'Readex Pro';font-size:14px;opacity:.55;width:14px;flex:none;padding-top:3px}
.q{font-family:'Noto Naskh Arabic';font-size:28px;line-height:1.95;quotes:none;display:block}
.ref{font-family:'Readex Pro';font-size:13px;opacity:.7;margin-top:14px;display:block}
.btn{margin-top:24px;align-self:flex-start;height:48px;padding:0 22px;border-radius:12px;font-family:'Readex Pro';font-weight:500;font-size:15px;display:inline-flex;align-items:center;gap:10px}
.more{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);z-index:7;height:44px;padding:0 18px;border-radius:12px;font-family:'Readex Pro';font-size:14px;display:flex;align-items:center;gap:8px;white-space:nowrap;border:1px solid currentColor;opacity:.85}
.tz{position:absolute;top:76px;bottom:90px;width:26%;z-index:4}
.tz.r{right:0}.tz.l{left:0}
.smap{border-radius:14px;overflow:hidden;margin:2px 0 12px;height:240px;border:1px solid rgba(255,255,255,.12)}
.smap svg{width:100%;height:100%}
.legend{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px 10px;font-size:13.5px;opacity:.85}
.legend b{font-family:'Readex Pro';font-weight:500;margin-inline-end:4px}
.ppl{display:flex;flex-direction:column;gap:0}
.pr{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid rgba(128,128,128,.25);text-align:start;width:100%}
.pr .av{width:54px;height:54px;border-radius:50%;flex:none;overflow:hidden;background:#2b2e36;display:grid;place-items:center;font-family:'Noto Naskh Arabic';font-size:24px;color:var(--gold2);border:1px solid var(--gold)}
.pr .av img{width:100%;height:100%;object-fit:cover}
.pr b{display:block;font-family:'Readex Pro';font-weight:500;font-size:17px}
.pr small{font-size:14px;opacity:.7}
.pr .ic{margin-inline-start:auto;opacity:.5}
.thread .bx{border-radius:12px;padding:14px 16px}
.thread small{display:block;font-family:'Readex Pro';font-size:12px;opacity:.7;margin-bottom:6px;letter-spacing:.3px}
.thread .s{font-family:'Noto Naskh Arabic';font-size:20px;line-height:1.8}
.thread .ln{height:40px;display:flex;align-items:center;gap:10px;padding-inline-start:16px;font-family:'Readex Pro';font-size:12px;color:var(--gold2)}
.thread .ln:before{content:"";width:1px;height:100%;background:var(--gold)}
.thread mark{background:none;color:var(--gold2);border-bottom:1px solid var(--gold)}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(10,12,18,.42);z-index:40;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;inset-inline:0;bottom:0;z-index:41;background:var(--paper);border-radius:20px 20px 0 0;max-height:86%;overflow:auto;transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.8,.2,1);padding:10px 22px 34px}
.sheet.on{transform:none}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}
.sheet h3{font-family:'Noto Naskh Arabic';font-weight:700;font-size:22px;margin:0 0 2px}
.sheet .sub{color:var(--faint);font-size:13.5px;margin:0 0 14px;font-family:'Readex Pro'}
.sheet p{margin:0 0 10px;font-size:16.5px;line-height:1.85}
.en{padding:13px 0;border-top:1px solid var(--line)}
.en b{display:block;font-family:'Readex Pro';font-weight:500;font-size:15.5px}
.en p{margin:3px 0 0 !important;color:#4d4a44;font-size:15.5px !important}
.orig{font-family:'Noto Naskh Arabic';color:var(--gold);font-weight:400}
.tg{display:inline-block;font-family:'Readex Pro';font-size:11.5px;border:1px solid currentColor;border-radius:6px;padding:0 8px;margin-bottom:4px}
.tg.agreed{color:#3E7A5A}.tg.debated{color:#9A6A12}
.menu .row{padding:15px 0}
.menu .row .ic{color:var(--soft)}
.menu .row .t{font-family:'Readex Pro';font-size:16px}
.back{font-family:'Readex Pro';font-size:13.5px;color:var(--accent);display:inline-flex;align-items:center;gap:4px;margin-bottom:10px}

/* reader */
.reader{position:absolute;inset:0;z-index:39;background:var(--paper);overflow:auto;transform:translateY(100%);transition:transform .42s cubic-bezier(.2,.8,.2,1)}
.reader.on{transform:none}
.rh{position:sticky;top:0;display:flex;align-items:center;height:56px;padding:0 10px 0 16px;background:rgba(250,248,244,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);font-family:'Readex Pro';font-weight:500;font-size:16px;z-index:2}
.rh span{flex:1}
.rh button{width:42px;height:42px;display:grid;place-items:center}
.rbody{padding:6px 24px 60px}
.peri{font-family:'Readex Pro';font-weight:500;font-size:14.5px;color:var(--accent);margin:28px 0 4px}
.scr{font-family:'Noto Naskh Arabic';font-size:21px;line-height:2.15}
.scr p{margin:0}
.vn{font-family:'Readex Pro';font-size:.52em;color:var(--gold);vertical-align:super;margin:0 2px}
.key{border-bottom:1.5px solid var(--accent)}


/* ---------- STUDY (full screen) ---------- */
#study{position:absolute;inset:0;z-index:38;background:var(--paper);overflow:hidden;transform:translateY(100%);transition:transform .42s cubic-bezier(.2,.8,.2,1)}
#study.on{transform:none}
.pg{position:absolute;inset:0;overflow-y:auto;background:var(--paper);transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .38s}
.pg.idx.away{transform:translateX(18%);opacity:.4}
.pg.det{transform:translateX(-100%)}
.pg.det.on{transform:none}
.bar{position:sticky;top:0;z-index:3;display:flex;align-items:center;height:56px;padding:0 6px;background:rgba(250,248,244,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .2s}
.bar.sc{border-bottom-color:var(--line)}
.bar .t{flex:1;text-align:center;font-family:'Readex Pro';font-weight:500;font-size:15px;opacity:0;transition:opacity .2s}
.bar.sc .t{opacity:1}
.bar button{height:44px;min-width:44px;padding:0 10px;display:flex;align-items:center;gap:4px;font-family:'Readex Pro';font-size:14px;color:var(--soft)}
.sh2{padding:14px 24px 0}
.sh2 .ey{font-family:'Readex Pro';font-size:12.5px;color:var(--accent);letter-spacing:.4px}
.sh2 h1{font-family:'Noto Naskh Arabic';font-weight:700;font-size:32px;line-height:1.35;margin:6px 0 6px}
.sh2 .meta{font-family:'Readex Pro';font-size:12.5px;color:var(--faint)}
.feat{display:block;width:calc(100% - 48px);margin:24px 24px 0;text-align:start;background:var(--ink);color:#fff;border-radius:18px;padding:20px 20px 18px;position:relative;overflow:hidden}
.feat:before{content:"";position:absolute;inset-block:18px;inset-inline-start:0;width:3px;background:var(--gold);border-radius:0 3px 3px 0}
.feat small{font-family:'Readex Pro';font-size:12px;color:var(--gold2);letter-spacing:.4px}
.feat b{display:block;font-family:'Noto Naskh Arabic';font-weight:700;font-size:21px;line-height:1.5;margin:6px 0 8px}
.feat p{margin:0;font-size:14.5px;line-height:1.8;opacity:.72;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.feat .go{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-family:'Readex Pro';font-size:13px;color:var(--gold2)}
.grp{margin:32px 24px 0}
.grp h2{font-family:'Readex Pro';font-weight:500;font-size:12px;color:var(--faint);letter-spacing:.6px;margin:0 0 6px}
.it{display:flex;align-items:center;gap:14px;width:100%;text-align:start;padding:16px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it .ib{width:42px;height:42px;border-radius:12px;background:var(--cream);display:grid;place-items:center;flex:none;color:var(--ink)}
.it .tx{flex:1;min-width:0}
.it .tx b{display:flex;align-items:baseline;gap:8px;font-family:'Readex Pro';font-weight:500;font-size:16px}
.it .tx b small{font-weight:400;font-size:11.5px;color:var(--faint)}

<script>
const D = {"ch":{"title":"دعوة أبرام والوعد","section":"إبراهيم (11: 27 – 25: 18)","where":"نقطة تحول في الكتاب كله. بعد أحد عشر أصحاحاً عن البشرية كلها وفشلها المتكرر، يتكلم الله إلى رجل واحد: «اذهب من أرضك ومن عشيرتك ومن بيت أبيك إلى الأرض التي أريك». ومعها سبعة وعود: «فأجعلك أمة عظيمة، وأباركك، وأعظم اسمك، وتكون بركة. وأبارك مباركيك، ولاعنك ألعنه، وتتبارك فيك جميع قبائل الأرض». فذهب أبرام «كما قال له الرب»، وهو ابن خمس وسبعين سنة، مع ساراي ولوط. وصل إلى شكيم في كنعان، فظهر له الرب وقال: «لنسلك أعطي هذه الأرض»، فبنى مذبحاً. ثم إلى بيت إيل، فبنى مذبحاً آخر و«دعا باسم الرب». لكن جاء جوع، فنزل أبرام إلى مصر. وهناك خاف على حياته لأن ساراي جميلة، فطلب منها أن تقول إنها أخته. فأُخذت إلى بيت فرعون! لكن الرب ضرب فرعون وبيته بضربات عظيمة، ففهم فرعون الحقيقة ووبخ أبرام وأخرجه. رجل الإيمان العظيم يسقط في أول اختبار.","before":"الأصحاح الحادي عشر: برج بابل، ونسب سام حتى أبرام، وساراي العاقر.","after":"الأصحاح الثالث عشر: أبرام ولوط يفترقان.","pericopes":[{"at":1,"t":"الدعوة والوعود"},{"at":4,"t":"الطاعة والرحيل"},{"at":6,"t":"شكيم: لنسلك أعطي هذه الأرض"},{"at":8,"t":"بيت إيل: دعا باسم الرب"},{"at":10,"t":"النزول إلى مصر"},{"at":14,"t":"ساراي في بيت فرعون"},{"at":17,"t":"الرب يحمي ساراي"}],"outline":[{"r":"1","t":"وقال الرب لأبرام: اذهب من أرضك ومن عشيرتك ومن بيت أبيك إلى الأرض التي أريك"},{"r":"2-3","t":"فأجعلك أمة عظيمة وأباركك وأعظم اسمك، وتكون بركة. وأبارك مباركيك، ولاعنك ألعنه. وتتبارك فيك جميع قبائل الأرض"},{"r":"4-5","t":"فذهب أبرام كما قال له الرب، وذهب معه لوط. وكان أبرام ابن خمس وسبعين سنة لما خرج من حاران... وخرجوا ليذهبوا إلى أرض كنعان. فأتوا إلى أرض كنعان"},{"r":"6-7","t":"واجتاز أبرام في الأرض إلى مكان شكيم إلى بلوطة مورة. وكان الكنعانيون حينئذ في الأرض. وظهر الرب لأبرام وقال: لنسلك أعطي هذه الأرض. فبنى هناك مذبحاً للرب الذي ظهر له"},{"r":"8-9","t":"ثم نقل من هناك إلى الجبل شرقي بيت إيل ونصب خيمته... فبنى هناك مذبحاً للرب ودعا باسم الرب. ثم ارتحل أبرام ارتحالاً متوالياً نحو الجنوب"},{"r":"10-13","t":"وحدث جوع في الأرض، فانحدر أبرام إلى مصر ليتغرب هناك... وقال لساراي امرأته: إني قد علمت أنك امرأة حسنة المنظر... فيقتلونني ويستبقونك. قولي إنك أختي، ليكون لي خير بسببك وتحيا نفسي من أجلك"},{"r":"14-16","t":"فحدث لما دخل أبرام إلى مصر أن المصريين رأوا المرأة أنها حسنة جداً... فأُخذت المرأة إلى بيت فرعون. فصنع إلى أبرام خيراً بسببها، وصار له غنم وبقر وحمير وعبيد وإماء وأتن وجمال"},{"r":"17-20","t":"فضرب الرب فرعون وبيته ضربات عظيمة بسبب ساراي امرأة أبرام. فدعا فرعون أبرام وقال: ما هذا الذي صنعت بي؟ لماذا لم تخبرني أنها امرأتك؟... والآن هوذا امرأتك، خذها واذهب! فأوصى عليه فرعون رجالاً فشيعوه وامرأته وكل ما كان له"}],"keyVerse":"Gen.12.3","people":[{"n":"أبرام","d":"ابن 75 سنة، من عائلة وثنية (يش 24: 2)، بلا أولاد. الله يختاره بنعمة مطلقة، لا لفضل فيه. يطيع بإيمان (عب 11: 8)، لكنه يسقط في الخوف والكذب في مصر."},{"n":"ساراي","d":"جميلة جداً رغم أنها في الستين أو أكثر. ضحية خوف زوجها. والله يحميها لأنها أم النسل الموعود."},{"n":"لوط","d":"ابن أخي أبرام، يرافقه. سيصير لاحقاً سبب مشكلة."},{"n":"فرعون","d":"لقب ملك مصر («البيت العظيم»). لا يُذكر اسمه. المفارقة: الوثني يتصرف بنزاهة أكثر من رجل الإيمان، ويوبخه."}],"places":[{"n":"حاران","d":"نقطة الانطلاق، في شمال بلاد الرافدين. نحو 650 كم إلى كنعان."},{"n":"شكيم","d":"مدينة في وسط كنعان، بين جبلي عيبال وجرزيم (نابلس اليوم). أول مكان يصل إليه أبرام ويبني فيه مذبحاً. وفيها سيجدد يشوع العهد (يش 24)، وقربها بئر يعقوب حيث تكلم يسوع مع السامرية (يو 4)."},{"n":"بيت إيل","d":"«بيت الله»، شمال أورشليم. فيها سيرى يعقوب السلم (28: 19)."},{"n":"النقب","d":"«الجنوب»، المنطقة الصحراوية جنوب كنعان."},{"n":"مصر","d":"ملجأ تقليدي وقت الجوع بسبب النيل. وسيتكرر النزول إلى مصر مع يعقوب وأبنائه."}],"summary":["وقال الرب لأبرام: اذهب من أرضك ومن عشيرتك ومن بيت أبيك إلى الأرض التي أريك. فأجعلك أمة عظيمة وأباركك وأعظم اسمك، وتكون بركة. وأبارك مباركيك، ولاعنك ألعنه. وتتبارك فيك جميع قبائل الأرض.","فذهب أبرام كما قال له الرب، وذهب معه لوط. وكان أبرام ابن خمس وسبعين سنة لما خرج من حاران. فأخذ أبرام ساراي امرأته، ولوطاً ابن أخيه، وكل مقتنياتهما التي اقتنيا والنفوس التي امتلكا في حاران. وخرجوا ليذهبوا إلى أرض كنعان. فأتوا إلى أرض كنعان. واجتاز أبرام في الأرض إلى مكان شكيم إلى بلوطة مورة. وكان الكنعانيون حينئذ في الأرض. وظهر الرب لأبرام وقال: لنسلك أعطي هذه الأرض. فبنى هناك مذبحاً للرب الذي ظهر له. ثم نقل من هناك إلى الجبل شرقي بيت إيل ونصب خيمته... فبنى هناك مذبحاً للرب ودعا باسم الرب.","وحدث جوع في الأرض، فانحدر أبرام إلى مصر ليتغرب هناك، لأن الجوع في الأرض كان شديداً. وحدث لما قرب أن يدخل مصر أنه قال لساراي امرأته: إني قد علمت أنك امرأة حسنة المنظر. فيكون إذا رآك المصريون أنهم يقولون: هذه امرأته. فيقتلونني ويستبقونك. قولي إنك أختي، ليكون لي خير بسببك وتحيا نفسي من أجلك. فحدث لما دخل أبرام إلى مصر أن المصريين رأوا المرأة أنها حسنة جداً. ورآها رؤساء فرعون ومدحوها لدى فرعون، فأُخذت المرأة إلى بيت فرعون. فصنع إلى أبرام خيراً بسببها.","فضرب الرب فرعون وبيته ضربات عظيمة بسبب ساراي امرأة أبرام. فدعا فرعون أبرام وقال: ما هذا الذي صنعت بي؟ لماذا لم تخبرني أنها امرأتك؟ لماذا قلت هي أختي، حتى أخذتها لي لتكون زوجتي؟ والآن هوذا امرأتك، خذها واذهب! فأوصى عليه فرعون رجالاً فشيعوه وامرأته وكل ما كان له."],"background":[{"t":"الترك المضاعف","d":"الدعوة تطلب ترك ثلاث دوائر متزايدة القرب: «أرضك» (الوطن)، و«عشيرتك» (القبيلة)، و«بيت أبيك» (العائلة). في العالم القديم، هذه كانت الهوية والأمان والميراث. وفي المقابل، الوجهة غير محددة: «الأرض التي أريك». إيمان حقيقي: «خرج وهو لا يعلم إلى أين يأتي» (عب 11: 8)."},{"t":"خمس بركات مقابل خمس لعنات","d":"كلمة «بارك» تتكرر خمس مرات في 12: 2–3، كأنها رد على كلمة «لعن» التي ظهرت خمس مرات في 1–11 (3: 14، 17؛ 4: 11؛ 5: 29؛ 9: 25). الله يبدأ مشروع إلغاء اللعنة من خلال أبرام."},{"t":"المذابح","d":"أبرام لم يبنِ مدناً بل مذابح. أينما ذهب، أعلن ملكية الرب للأرض بالعبادة. والكنعانيون ما زالوا هناك: أبرام يملك الأرض بالوعد فقط، لا بالواقع."}],"words":[{"w":"اذهب","orig":"לֶךְ־לְךָ (لِخ لِخا)","d":"حرفياً «اذهب لنفسك». نفس التعبير سيتكرر في 22: 2 («اذهب إلى أرض المريا»): أول وآخر اختبار لإيمان إبراهيم."},{"w":"بارك / بركة","orig":"בָּרַךְ (بارك)","d":"منح الحياة والازدهار والخير من الله. ونقيضها «لعن» (أرار)."},{"w":"قبائل","orig":"מִשְׁפְּחֹת (مشبحوت)","d":"عشائر، عائلات. نفس الكلمة في جدول الأمم (10: 5، 32). البركة لكل «عشيرة» تفرقت في بابل."},{"w":"نسل","orig":"זֶרַע (زرع)","d":"بذرة، ذرية. مفرد بصيغته، ويُستخدم للجمع والمفرد. بولس يرى فيه إشارة للمسيح (غل 3: 16)."},{"w":"دعا باسم الرب","orig":"קָרָא בְּשֵׁם יְהוָה (قارا بشيم يهوه)","d":"عبادة علنية وصلاة. نفس التعبير في 4: 26. أبرام يمجد «اسم» الرب بدل أن «يصنع لنفسه اسماً» كبناة بابل."}],"otQuotes":[],"links":[{"ref":"Gal.3.8","d":"والكتاب إذ سبق فرأى أن الله بالإيمان يبرر الأمم، سبق فبشر إبراهيم أن فيك تتبارك جميع الأمم.","label":"غلاطية ٣: ٨"},{"ref":"Gal.3.16","d":"وأما المواعيد فقيلت في إبراهيم وفي نسله. لا يقول: وفي الأنسال كأنه عن كثيرين، بل كأنه عن واحد: وفي نسلك الذي هو المسيح.","label":"غلاطية ٣: ١٦"},{"ref":"Heb.11.8","d":"بالإيمان إبراهيم لما دعي أطاع أن يخرج إلى المكان الذي كان عتيداً أن يأخذه ميراثاً، فخرج وهو لا يعلم إلى أين يأتي.","label":"العبرانيين ١١: ٨"},{"ref":"Acts.3.25-26","d":"أنتم أبناء الأنبياء والعهد... قائلاً لإبراهيم: وبنسلك تتبارك جميع قبائل الأرض. إليكم أولاً، إذ أقام الله فتاه يسوع، أرسله يبارككم.","label":"أعمال الرسل ٣: ٢٥–٢٦"},{"ref":"Rom.4.13","d":"فإنه ليس بالناموس كان الوعد لإبراهيم أو لنسله أن يكون وارثاً للعالم، بل ببر الإيمان.","label":"رومية ٤: ١٣"},{"ref":"Josh.24.2-3","d":"تارح أبو إبراهيم... وعبدوا آلهة أخرى. فأخذت إبراهيم أباكم من عبر النهر.","label":"يشوع ٢٤: ٢–٣"},{"ref":"Gen.20.2","d":"وقال إبراهيم عن سارة امرأته: هي أختي. فأرسل أبيمالك ملك جرار وأخذ سارة.","label":"التكوين ٢٠: ٢"}],"christ":["الوعد «تتبارك فيك جميع قبائل الأرض» هو، كما يقول بولس، «الإنجيل» المبشر به مسبقاً لإبراهيم (غل 3: 8). البركة لكل الأمم تأتي من خلال «النسل» الواحد، المسيح (غل 3: 16). ففي المسيح تُرفع اللعنة: \"المسيح افتدانا من لعنة الناموس، إذ صار لعنة لأجلنا... لتصير بركة إبراهيم للأمم في المسيح يسوع\" (غل 3: 13–14). كل مؤمن من كل أمة هو ابن لإبراهيم بالإيمان (غل 3: 7، 29).","وأبرام يترك وطنه وبيت أبيه طاعة لله، لكن المسيح ترك أكثر بكثير: مجد السماء وحضن الآب (في 2: 6–7). وحيث فشل أبرام في مصر (خاف وكذب ليحمي نفسه وعرض زوجته للخطر)، المسيح العريس الحقيقي بذل نفسه ليحمي عروسه، الكنيسة (أف 5: 25)."],"hard":[{"q":"هل كذب أبرام حين قال إن ساراي أخته؟","tag":"agreed","a":["نصف حقيقة: ساراي كانت أخته غير الشقيقة فعلاً (ابنة أبيه لا ابنة أمه، 20: 12). لكن قصده كان الخداع: إخفاء أنها زوجته. ونصف الحقيقة المقصود به الخداع كذب. والنص لا يبرره: فرعون الوثني يوبخه («ما هذا الذي صنعت بي؟»)، وأبرام صامت بلا جواب. الكتاب صادق في عرض خطايا أبطاله. والأهم: الله يبقى أميناً لوعده رغم عدم أمانة أبرام."]},{"q":"لماذا عاقب الله فرعون وهو لم يعرف أنها متزوجة؟","tag":"debated","a":["الضربات لم تكن بالضرورة عقاباً أخلاقياً لفرعون بقدر ما كانت تدخلاً إلهياً لحماية ساراي، أم النسل الموعود. الله يحمي خطته الفدائية مهما كلف الأمر. ومع ذلك، أخذ فرعون للنساء لقصره بالقوة لم يكن بريئاً. والضربات جعلت فرعون يكتشف الحقيقة. وهي تمهيد لضربات مصر في الخروج: الله يحمي شعبه من فرعون ويُخرجهم بغنى."]},{"q":"هل وعد «أبارك مباركيك ولاعنك ألعنه» ينطبق على دولة إسرائيل الحديثة؟","tag":"debated","a":["هذا موضوع اختلاف بين التقليدين. التدبيريون عادة يرون أن الوعد يمتد لإسرائيل العرقية والدولة الحديثة، فيدعو بعضهم لدعم سياسي لها. والتقليد المصلح (العهدي) يرى أن الوعد يتحقق في المسيح «نسل إبراهيم» الحقيقي (غل 3: 16)، وفي كل من هو «في المسيح» من اليهود والأمم (غل 3: 29). والموقف من المسيح هو الذي يحدد البركة واللعنة. وكلا الطرفين يتفق على محبة الشعب اليهودي والصلاة لخلاصه (رو 10: 1)، ورفض معاداة السامية. وسيأتي النقاش الكامل حول وعد الأرض في الأصحاح 15."]}],"voices":[{"n":"جون كالفن","y":"1509–1564","w":"تفسير سفر التكوين (1554)","b":"يؤكد أن دعوة أبرام نعمة مجانية: الله اختار رجلاً من عائلة وثنية، لا لفضل فيه. ويقول عن سقوطه في مصر إن الله يُظهر ضعف قديسيه لكي لا نعتمد على البشر، بل نتعلم أن الخلاص كله من نعمة الله."},{"n":"جيمس مونتجمري بويس","y":"1938–2000","w":"التكوين: تفسير عرضي (1982–1987)","b":"يلاحظ أن أبرام في الإيمان بنى مذابح، وفي الخوف لم يبنِ مذبحاً في مصر. حين يغيب المذبح، تبدأ الحلول البشرية والكذب. ويرى أن القصة تُظهر أن الوعد يعتمد على أمانة الله لا على أمانة أبرام."},{"n":"بروس والتكي","y":"1930–","w":"التكوين: تفسير (2001)","b":"يرى في 12: 1–3 المحور الذي يدور عليه التكوين كله، بل الكتاب كله: الله يعلن خطته لاستعادة البركة لكل الأمم من خلال نسل إبراهيم. والقصص التالية تختبر: هل سيثق إبراهيم في الوعد؟ وهل سيحفظ الله وعده رغم العوائق؟"}],"questions":["ما \"أرضك وعشيرتك وبيت أبيك\" التي قد يطلب الله منك تركها؟","هل تقدر أن تطيع الله حتى لو لم تعرف «إلى أين»؟","كيف تشعر حين تعرف أن البركة التي وعد بها إبراهيم صارت لك في المسيح (غل 3: 29)؟","ماذا يعلمك أن أبرام لم يبنِ مذبحاً في مصر؟ هل تهمل الصلاة حين تكون خائفاً؟","هل تستخدم «أنصاف الحقائق» لتحمي نفسك؟","هل أنت «بركة» للآخرين من حولك كما دُعي أبرام؟"],"apply":"اكتب على ورقة: \"في المسيح، أنا ابن لإبراهيم ووارث للوعد\" (غل 3: 29). ثم فكر في موقف هذا الأسبوع تميل فيه لحماية نفسك بنصف حقيقة أو بالخوف. قرر أن تقول الحق كاملاً وتثق في حماية الله. وابحث عن طريقة عملية لتكون «بركة» لشخص واحد من غير عائلتك.","keyVerseText":"وَأُبَارِكُ مُبَارِكِيكَ، وَلَاعِنَكَ أَلْعَنُهُ. وَتَتَبَارَكُ فِيكَ جَمِيعُ قَبَائِلِ ٱلْأَرْضِ».","keyVerseLabel":"التكوين ١٢: ٣"},"text":[{"number":1,"text":"وَقَالَ ٱلرَّبُّ لِأَبْرَامَ: «ٱذْهَبْ مِنْ أَرْضِكَ وَمِنْ عَشِيرَتِكَ وَمِنْ بَيْتِ أَبِيكَ إِلَى ٱلْأَرْضِ ٱلَّتِي أُرِيكَ."},{"number":2,"text":"فَأَجْعَلَكَ أُمَّةً عَظِيمَةً وَأُبَارِكَكَ وَأُعَظِّمَ ٱسْمَكَ، وَتَكُونَ بَرَكَةً."},{"number":3,"text":"وَأُبَارِكُ مُبَارِكِيكَ، وَلَاعِنَكَ أَلْعَنُهُ. وَتَتَبَارَكُ فِيكَ جَمِيعُ قَبَائِلِ ٱلْأَرْضِ»."},{"number":4,"text":"فَذَهَبَ أَبْرَامُ كَمَا قَالَ لَهُ ٱلرَّبُّ وَذَهَبَ مَعَهُ لُوطٌ. وَكَانَ أَبْرَامُ ٱبْنَ خَمْسٍ وَسَبْعِينَ سَنَةً لَمَّا خَرَجَ مِنْ حَارَانَ."},{"number":5,"text":"فَأَخَذَ أَبْرَامُ سَارَايَ ٱمْرَأَتَهُ، وَلُوطًا ٱبْنَ أَخِيهِ، وَكُلَّ مُقْتَنَيَاتِهِمَا ٱلَّتِي ٱقْتَنَيَا وَٱلنُّفُوسَ ٱلَّتِي ٱمْتَلَكَا فِي حَارَانَ. وَخَرَجُوا لِيَذْهَبُوا إِلَى أَرْضِ كَنْعَانَ. فَأَتَوْا إِلَى أَرْضِ كَنْعَانَ."},{"number":6,"text":"وَٱجْتَازَ أَبْرَامُ فِي ٱلْأَرْضِ إِلَى مَكَانِ شَكِيمَ إِلَى بَلُّوطَةِ مُورَةَ. وَكَانَ ٱلْكَنْعَانِيُّونَ حِينَئِذٍ فِي ٱلْأَرْضِ."},{"number":7,"text":"وَظَهَرَ ٱلرَّبُّ لِأَبْرَامَ وَقَالَ: «لِنَسْلِكَ أُعْطِي هَذِهِ ٱلْأَرْضَ». فَبَنَى هُنَاكَ مَذْبَحًا لِلرَّبِّ ٱلَّذِي ظَهَرَ لَهُ."},{"number":8,"text":"ثُمَّ نَقَلَ مِنْ هُنَاكَ إِلَى ٱلْجَبَلِ شَرْقِيَّ بَيْتِ إِيلٍ وَنَصَبَ خَيْمَتَهُ. وَلَهُ بَيْتُ إِيلَ مِنَ ٱلْمَغْرِبِ وَعَايُ مِنَ ٱلْمَشْرِقِ. فَبَنَى هُنَاكَ مَذْبَحًا لِلرَّبِّ وَدَعَا بِٱسْمِ ٱلرَّبِّ."},{"number":9,"text":"ثُمَّ ٱرْتَحَلَ أَبْرَامُ ٱرْتِحَالًا مُتَوَالِيًا نَحْوَ ٱلْجَنُوبِ."},{"number":10,"text":"وَحَدَثَ جُوعٌ فِي ٱلْأَرْضِ، فَٱنْحَدَرَ أَبْرَامُ إِلَى مِصْرَ لِيَتَغَرَّبَ هُنَاكَ، لِأَنَّ ٱلْجُوعَ فِي ٱلْأَرْضِ كَانَ شَدِيدًا."},{"number":11,"text":"وَحَدَثَ لَمَّا قَرُبَ أَنْ يَدْخُلَ مِصْرَ أَنَّهُ قَالَ لِسَارَايَ ٱمْرَأَتِهِ: «إِنِّي قَدْ عَلِمْتُ أَنَّكِ ٱمْرَأَةٌ حَسَنَةُ ٱلْمَنْظَرِ."},{"number":12,"text":"فَيَكُونُ إِذَا رَآكِ ٱلْمِصْرِيُّونَ أَنَّهُمْ يَقُولُونَ: هَذِهِ ٱمْرَأَتُهُ. فَيَقْتُلُونَنِي وَيَسْتَبْقُونَكِ."},{"number":13,"text":"قُولِي إِنَّكِ أُخْتِي، لِيَكُونَ لِي خَيْرٌ بِسَبَبِكِ وَتَحْيَا نَفْسِي مِنْ أَجْلِكِ»."},{"number":14,"text":"فَحَدَثَ لَمَّا دَخَلَ أَبْرَامُ إِلَى مِصْرَ أَنَّ ٱلْمِصْرِيِّينَ رَأَوْا ٱلْمَرْأَةَ أَنَّهَا حَسَنَةٌ جِدًّا."},{"number":15,"text":"وَرَآهَا رُؤَسَاءُ فِرْعَوْنَ وَمَدَحُوهَا لَدَى فِرْعَوْنَ، فَأُخِذَتِ ٱلْمَرْأَةُ إِلَى بَيْتِ فِرْعَوْنَ،"},{"number":16,"text":"فَصَنَعَ إِلَى أَبْرَامَ خَيْرًا بِسَبَبِهَا، وَصَارَ لَهُ غَنَمٌ وَبَقَرٌ وَحَمِيرٌ وَعَبِيدٌ وَإِمَاءٌ وَأُتُنٌ وَجِمَالٌ."},{"number":17,"text":"فَضَرَبَ ٱلرَّبُّ فِرْعَوْنَ وَبَيْتَهُ ضَرَبَاتٍ عَظِيمَةً بِسَبَبِ سَارَايَ ٱمْرَأَةِ أَبْرَامَ."},{"number":18,"text":"فَدَعَا فِرْعَوْنُ أَبْرَامَ وَقَالَ: «مَا هَذَا ٱلَّذِي صَنَعْتَ بِي؟ لِمَاذَا لَمْ تُخْبِرْنِي أَنَّهَا ٱمْرَأَتُكَ؟"},{"number":19,"text":"لِمَاذَا قُلْتَ: هِيَ أُخْتِي، حَتَّى أَخَذْتُهَا لِي لِتَكُونَ زَوْجَتِي؟ وَٱلْآنَ هُوَذَا ٱمْرَأَتُكَ! خُذْهَا وَٱذْهَبْ!»."},{"number":20,"text":"فَأَوْصَى عَلَيْهِ فِرْعَوْنُ رِجَالًا فَشَيَّعُوهُ وَٱمْرَأَتَهُ وَكُلَّ مَا كَانَ لَهُ."}],"titles":["في البدء خلق الله","الراحة، والجنة، والرجل والمرأة","السقوط والوعد الأول","قايين وهابيل","من آدم إلى نوح: «ومات»، إلا أخنوخ","فساد الأرض ونوح الذي وجد نعمة","الطوفان","الله يذكر نوحاً","العهد مع نوح وقوس قزح","جدول الأمم","برج بابل ومن سام إلى أبرام","دعوة أبرام والوعد","أبرام ولوط يفترقان","حرب الملوك وملكي صادق","العهد بين الأشلاء: فآمن بالرب فحسبه له براً","هاجر وإسماعيل: الإله الذي يراني","عهد الختان: إبراهيم وسارة","الزوار الثلاثة والشفاعة لسدوم","هلاك سدوم ونجاة لوط","إبراهيم وأبيمالك: تكرار الخطأ","ولادة إسحاق وطرد هاجر","تقديم إسحاق: الرب يرى","موت سارة ومغارة المكفيلة","زوجة لإسحاق: رفقة","موت إبراهيم وولادة التوأمين وبيع البكورية","إسحاق والآبار: الرب أرحب لنا","يعقوب يأخذ البركة بالخداع","سلم يعقوب في بيت إيل","يعقوب عند لابان: راحيل وليئة","حرب الأختين وثروة يعقوب","يعقوب يهرب من لابان: عهد جلعاد","يعقوب يصارع الله في فنيئيل","المصالحة: رأيت وجهك كما يُرى وجه الله","دينة وشكيم: الانتقام في شكيم","الرجوع إلى بيت إيل: موت راحيل وإسحاق","مواليد عيسو: أدوم","يوسف وأحلامه: بيعه من إخوته","يهوذا وثامار: هي أبر مني","يوسف في بيت فوطيفار والسجن: وكان الرب مع يوسف","حلما الساقي والخباز: أليست التعابير لله؟","حلما فرعون: من السجن إلى العرش","الإخوة في مصر: حقاً إننا مذنبون","الرحلة الثانية: بنيامين والوليمة","الطاس في عدل بنيامين: شفاعة يهوذا","أنا يوسف: الله أرسلني قدامكم","يعقوب ينزل إلى مصر: لا تخف","يعقوب أمام فرعون وسياسة يوسف في المجاعة","يعقوب يبارك منسى وأفرايم","بركات يعقوب لأبنائه: حتى يأتي شيلون","أنتم قصدتم لي شراً، أما الله فقصد به خيراً"],"v":{"Gen.12.3":{"t":"وَأُبَارِكُ مُبَارِكِيكَ، وَلَاعِنَكَ أَلْعَنُهُ. وَتَتَبَارَكُ فِيكَ جَمِيعُ قَبَائِلِ ٱلْأَرْضِ».","l":"التكوين ١٢: ٣"},"Gal.3.8":{"t":"وَٱلْكِتَابُ إِذْ سَبَقَ فَرَأَى أَنَّ ٱللهَ بِٱلْإِيمَانِ يُبَرِّرُ ٱلْأُمَمَ، سَبَقَ فَبَشَّرَ إِبْرَاهِيمَ أَنْ «فِيكَ تَتَبَارَكُ جَمِيعُ ٱلْأُمَمِ».","l":"غلاطية ٣: ٨"},"Gal.3.16":{"t":"وَأَمَّا ٱلْمَوَاعِيدُ فَقِيلَتْ فِي إِبْرَاهِيمَ وَفِي نَسْلِهِ. لَا يَقُولُ: «وَفِي ٱلْأَنْسَالِ» كَأَنَّهُ عَنْ كَثِيرِينَ، بَلْ كَأَنَّهُ عَنْ وَاحِدٍ: «وَفِي نَسْلِكَ» ٱلَّذِي هُوَ ٱلْمَسِيحُ.","l":"غلاطية ٣: ١٦"},"John.8.56":{"t":"أَبُوكُمْ إِبْرَاهِيمُ تَهَلَّلَ بِأَنْ يَرَى يَوْمِي فَرَأَى وَفَرِحَ».","l":"يوحنا ٨: ٥٦"},"Heb.11.8":{"t":"بِٱلْإِيمَانِ إِبْرَاهِيمُ لَمَّا دُعِيَ أَطَاعَ أَنْ يَخْرُجَ إِلَى ٱلْمَكَانِ ٱلَّذِي كَانَ عَتِيدًا أَنْ يَأْخُذَهُ مِيرَاثًا، فَخَرَجَ وَهُوَ لَا يَعْلَمُ إِلَى أَيْنَ يَأْتِي.","l":"العبرانيين ١١: ٨"},"Rom.4.3":{"t":"لِأَنَّهُ مَاذَا يَقُولُ ٱلْكِتَابُ؟ «فَآمَنَ إِبْرَاهِيمُ بِٱللهِ فَحُسِبَ لَهُ بِرًّا».","l":"رومية ٤: ٣"},"Jas.2.23":{"t":"وَتَمَّ ٱلْكِتَابُ ٱلْقَائِلُ: «فَآمَنَ إِبْرَاهِيمُ بِٱللهِ فَحُسِبَ لَهُ بِرًّا»، وَدُعِيَ خَلِيلَ ٱللهِ.","l":"يعقوب ٢: ٢٣"},"Gen.15.6":{"t":"فَآمَنَ بِٱلرَّبِّ فَحَسِبَهُ لَهُ بِرًّا.","l":"التكوين ١٥: ٦"},"Gal.3.29":{"t":"فَإِنْ كُنْتُمْ لِلْمَسِيحِ، فَأَنْتُمْ إِذًا نَسْلُ إِبْرَاهِيمَ، وَحَسَبَ ٱلْمَوْعِدِ وَرَثَةٌ.","l":"غلاطية ٣: ٢٩"},"Heb.11.11":{"t":"بِٱلْإِيمَانِ سَارَةُ نَفْسُهَا أَيْضًا أَخَذَتْ قُدْرَةً عَلَى إِنْشَاءِ نَسْلٍ، وَبَعْدَ وَقْتِ ٱلسِّنِّ وَلَدَتْ، إِذْ حَسِبَتِ ٱلَّذِي وَعَدَ صَادِقًا.","l":"العبرانيين ١١: ١١"},"1Pet.3.6":{"t":"كَمَا كَانَتْ سَارَةُ تُطِيعُ إِبْرَاهِيمَ دَاعِيَةً إِيَّاهُ «سَيِّدَهَا». ٱلَّتِي صِرْتُنَّ أَوْلَادَهَا، صَانِعَاتٍ خَيْرًا، وَغَيْرَ خَائِفَاتٍ خَوْفًا ٱلْبَتَّةَ.","l":"بطرس الأولى ٣: ٦"},"2Pet.2.7":{"t":"وَأَنْقَذَ لُوطًا ٱلْبَارَّ، مَغْلُوبًا مِنْ سِيرَةِ ٱلْأَرْدِيَاءِ فِي ٱلدَّعَارَةِ.","l":"بطرس الثانية ٢: ٧"},"Ps.119.105":{"t":"سِرَاجٌ لِرِجْلِي كَلَامُكَ وَنُورٌ لِسَبِيلِي.","l":"المزامير ١١٩: ١٠٥"}},"chs":[{"t":"في البدء خلق الله","sec":"الخلق","w":"أول أصحاح في الكتاب المقدس، وأساس كل ما بعده. لا يبدأ بحجة على وجود الله، بل يفترضه: «في البدء خلق الله السماوات والأرض».","kv":"فَخَلَقَ ٱللهُ ٱلْإِنْسَانَ عَلَى صُورَتِهِ. عَلَى صُورَةِ ٱللهِ خَلَقَهُ. ذَكَرًا وَأُنْثَى خَلَقَهُمْ.","kl":"التكوين ١: ٢٧","pp":["الله (إلوهيم)","روح الله","الإنسان (آدم)"],"v":31},{"t":"الراحة، والجنة، والرجل والمرأة","sec":"التاريخ البدائي","w":"الآيات الثلاث الأولى تختم قصة الخلق: في اليوم السابع استراح الله وبارك اليوم وقدسه.","kv":"لِذَلِكَ يَتْرُكُ ٱلرَّجُلُ أَبَاهُ وَأُمَّهُ وَيَلْتَصِقُ بِٱمْرَأَتِهِ وَيَكُونَانِ جَسَدًا وَاحِدًا.","kl":"التكوين ٢: ٢٤","pp":["الرب الإله (يهوه إلوهيم)","آدم","المرأة (حواء لاحقاً)"],"v":25},{"t":"السقوط والوعد الأول","sec":"التاريخ البدائي","w":"أحد أهم أصحاحات الكتاب المقدس، لأنه يشرح لماذا العالم مكسور. الحية، \"أحيل حيوانات البرية\"، تبدأ بسؤال: «أحقاً قال الله لا تأكلا من كل شجر الجنة؟».","kv":"وَأَضَعُ عَدَاوَةً بَيْنَكِ وَبَيْنَ ٱلْمَرْأَةِ، وَبَيْنَ نَسْلِكِ وَنَسْلِهَا. هُوَ يَسْحَقُ رَأْسَكِ، وَأَنْتِ تَسْحَقِينَ عَقِبَهُ».","kl":"التكوين ٣: ١٥","pp":["الحية","المرأة","آدم"],"v":24},{"t":"قايين وهابيل","sec":"التاريخ البدائي","w":"خارج الجنة، الحياة تستمر. حواء تلد قايين («اقتنيت رجلاً من عند الرب»)، ثم هابيل. هابيل راعي غنم، وقايين عامل في الأرض.","kv":"إِنْ أَحْسَنْتَ أَفَلَا رَفْعٌ؟ وَإِنْ لَمْ تُحْسِنْ فَعِنْدَ ٱلْبَابِ خَطِيَّةٌ رَابِضَةٌ، وَإِلَيْكَ ٱشْتِيَاقُهَا وَأَنْتَ تَسُودُ عَلَيْهَا».","kl":"التكوين ٤: ٧","pp":["قايين","هابيل","لامك"],"v":26},{"t":"من آدم إلى نوح: «ومات»، إلا أخنوخ","sec":"التاريخ البدائي","w":"«هذا كتاب مواليد آدم». أصحاح نسب، قد يبدو مملاً، لكنه يحمل رسالة قوية. يبدأ بتذكير: الله خلق الإنسان على شبهه، ذكراً وأنثى، وباركهم.","kv":"وَسَارَ أَخْنُوخُ مَعَ ٱللهِ، وَلَمْ يُوجَدْ لِأَنَّ ٱللهَ أَخَذَهُ.","kl":"التكوين ٥: ٢٤","pp":["آدم","أخنوخ","متوشالح"],"v":32},{"t":"فساد الأرض ونوح الذي وجد نعمة","sec":"التاريخ البدائي","w":"الشر يبلغ ذروته قبل الطوفان. «أبناء الله» رأوا «بنات الناس» أنهن حسنات فاتخذوا لأنفسهم نساء، وكان «الطغاة» (النفيليم) في الأرض.","kv":"وَأَمَّا نُوحٌ فَوَجَدَ نِعْمَةً فِي عَيْنَيِ ٱلرَّبِّ.","kl":"التكوين ٦: ٨","pp":["أبناء الله وبنات الناس","الطغاة (النفيليم)","نوح"],"v":22},{"t":"الطوفان","sec":"التاريخ البدائي","w":"الرب يقول لنوح: «ادخل أنت وجميع بيتك إلى الفلك، لأني إياك رأيت باراً لديّ في هذا الجيل».","kv":"وَٱلدَّاخِلَاتُ دَخَلَتْ ذَكَرًا وَأُنْثَى، مِنْ كُلِّ ذِي جَسَدٍ، كَمَا أَمَرَهُ ٱللهُ. وَأَغْلَقَ ٱلرَّبُّ عَلَيْهِ.","kl":"التكوين ٧: ١٦","pp":["نوح وعائلته","الرب"],"v":24},{"t":"الله يذكر نوحاً","sec":"التاريخ البدائي","w":"نقطة التحول في قصة الطوفان: «ثم ذكر الله نوحاً وكل الوحوش وكل البهائم التي معه في الفلك».","kv":"ثُمَّ ذَكَرَ ٱللهُ نُوحًا وَكُلَّ ٱلْوُحُوشِ وَكُلَّ ٱلْبَهَائِمِ ٱلَّتِي مَعَهُ فِي ٱلْفُلْكِ. وَأَجَازَ ٱللهُ رِيحًا عَلَى ٱلْأَرْضِ فَهَدَأَتِ ٱلْمِيَاهُ.","kl":"التكوين ٨: ١","pp":["نوح","الغراب","الحمامة"],"v":22},{"t":"العهد مع نوح وقوس قزح","sec":"التاريخ البدائي","w":"بداية جديدة للبشرية. الله يبارك نوحاً وبنيه بنفس كلمات الخلق: «أثمروا واكثروا واملأوا الأرض».","kv":"وَضَعْتُ قَوْسِي فِي ٱلسَّحَابِ فَتَكُونُ عَلَامَةَ مِيثَاقٍ بَيْنِي وَبَيْنَ ٱلْأَرْضِ.","kl":"التكوين ٩: ١٣","pp":["نوح","حام","سام ويافث"],"v":29},{"t":"جدول الأمم","sec":"التاريخ البدائي","w":"«وهذه مواليد بني نوح: سام وحام ويافث. ووُلد لهم بنون بعد الطوفان». أصحاح فريد في الأدب القديم: قائمة بسبعين أمة (رقم الكمال: كل البشرية) تنحدر من أبناء نوح الثلاثة، مرتبة بحسب \"ألسنتهم …","kv":"هَؤُلَاءِ قَبَائِلُ بَنِي نُوحٍ حَسَبَ مَوَالِيدِهِمْ بِأُمَمِهِمْ. وَمِنْ هَؤُلَاءِ تَفَرَّقَتِ ٱلْأُمَمُ فِي ٱلْأَرْضِ بَعْدَ ٱلطُّوفَانِ.","kl":"التكوين ١٠: ٣٢","pp":["يافث","حام","نمرود"],"v":32},{"t":"برج بابل ومن سام إلى أبرام","sec":"التاريخ البدائي وبداية إبراهيم","w":"«وكانت الأرض كلها لساناً واحداً ولغة واحدة». البشر يرتحلون شرقاً ويستقرون في أرض شنعار، ويقولون: «هلم نبنِ لأنفسنا مدينة وبرجاً رأسه بالسماء، ونصنع لأنفسنا اسماً لئلا نتبدد على وجه كل ا…","kv":"وَقَالُوا: «هَلُمَّ نَبْنِ لِأَنْفُسِنَا مَدِينَةً وَبُرْجًا رَأْسُهُ بِٱلسَّمَاءِ. وَنَصْنَعُ لِأَنْفُسِنَا ٱسْمًا لِئَلَّا نَتَبَدَّدَ عَلَى وَجْهِ كُلِّ ٱلْأَرْضِ».","kl":"التكوين ١١: ٤","pp":["بناة البرج","تارح","أبرام"],"v":32},{"t":"دعوة أبرام والوعد","sec":"إبراهيم","w":"نقطة تحول في الكتاب كله. بعد أحد عشر أصحاحاً عن البشرية كلها وفشلها المتكرر، يتكلم الله إلى رجل واحد: «اذهب من أرضك ومن عشيرتك ومن بيت أبيك إلى الأرض التي أريك».","kv":"وَأُبَارِكُ مُبَارِكِيكَ، وَلَاعِنَكَ أَلْعَنُهُ. وَتَتَبَارَكُ فِيكَ جَمِيعُ قَبَائِلِ ٱلْأَرْضِ».","kl":"التكوين ١٢: ٣","pp":["أبرام","ساراي","لوط"],"v":20},{"t":"أبرام ولوط يفترقان","sec":"إبراهيم","w":"أبرام يصعد من مصر غنياً جداً \"بالمواشي والفضة والذهب\"، ويرجع إلى المذبح الأول في بيت إيل، «ودعا هناك أبرام باسم الرب»: استعادة بعد السقوط.","kv":"فَقَالَ أَبْرَامُ لِلُوطٍ: «لَا تَكُنْ مُخَاصَمَةٌ بَيْنِي وَبَيْنَكَ، وَبَيْنَ رُعَاتِي وَرُعَاتِكَ، لِأَنَّنَا نَحْنُ أَخَوَانِ.","kl":"التكوين ١٣: ٨","pp":["أبرام","لوط","أهل سدوم"],"v":18},{"t":"حرب الملوك وملكي صادق","sec":"إبراهيم","w":"أصحاح مختلف عن غيره: مشهد سياسي وعسكري دولي. أربعة ملوك من الشرق، بقيادة كدرلعومر ملك عيلام، يحاربون خمسة ملوك من مدن السهل (سدوم وعمورة وغيرها) الذين تمردوا بعد اثنتي عشرة سنة من الخضوع.","kv":"وَبَارَكَهُ وَقَالَ: «مُبَارَكٌ أَبْرَامُ مِنَ ٱللهِ ٱلْعَلِيِّ مَالِكِ ٱلسَّمَاوَاتِ وَٱلْأَرْضِ، وَمُبَارَكٌ ٱللهُ ٱلْعَلِيُّ ٱلَّذِي أَسْلَمَ أَعْدَاءَكَ فِي يَدِكَ». فَأَعْطَاهُ عُشْرًا مِنْ كُلِّ شَيْءٍ.","kl":"التكوين ١٤: ١٩–٢٠","pp":["كدرلعومر","أبرام العبراني","لوط"],"v":24},{"t":"العهد بين الأشلاء: فآمن بالرب فحسبه له براً","sec":"إبراهيم","w":"بعد انتصاره على الملوك ورفضه غنى سدوم، يأتي كلام الرب لأبرام في رؤيا: «لا تخف يا أبرام.","kv":"فَآمَنَ بِٱلرَّبِّ فَحَسِبَهُ لَهُ بِرًّا.","kl":"التكوين ١٥: ٦","pp":["أبرام","أليعازر الدمشقي","الأموريون"],"v":21},{"t":"هاجر وإسماعيل: الإله الذي يراني","sec":"إبراهيم","w":"عشر سنوات مرت منذ دخول أبرام كنعان، وساراي ما زالت عاقراً. فتقترح حلاً بشرياً شائعاً في ذلك الوقت: «هوذا الرب قد أمسكني عن الولادة.","kv":"فَدَعَتِ ٱسْمَ ٱلرَّبِّ ٱلَّذِي تَكَلَّمَ مَعَهَا: «أَنْتَ إِيلُ رُئِي». لِأَنَّهَا قَالَتْ: «أَهَهُنَا أَيْضًا رَأَيْتُ بَعْدَ رُؤْيَةٍ؟».","kl":"التكوين ١٦: ١٣","pp":["ساراي","أبرام","هاجر"],"v":16},{"t":"عهد الختان: إبراهيم وسارة","sec":"إبراهيم","w":"ثلاث عشرة سنة صمت بعد ولادة إسماعيل. أبرام الآن ابن تسع وتسعين سنة. فيظهر له الرب: \"أنا الله القدير (إيل شداي).","kv":"وَأُقِيمُ عَهْدِي بَيْنِي وَبَيْنَكَ، وَبَيْنَ نَسْلِكَ مِنْ بَعْدِكَ فِي أَجْيَالِهِمْ، عَهْدًا أَبَدِيًّا، لِأَكُونَ إِلَهًا لَكَ وَلِنَسْلِكَ مِنْ بَعْدِكَ.","kl":"التكوين ١٧: ٧","pp":["إبراهيم","سارة","إسماعيل"],"v":27},{"t":"الزوار الثلاثة والشفاعة لسدوم","sec":"إبراهيم","w":"في حر النهار، وإبراهيم جالس عند باب خيمته في بلوطات ممرا، «ظهر له الرب». رفع عينيه فإذا ثلاثة رجال واقفون.","kv":"هَلْ يَسْتَحِيلُ عَلَى ٱلرَّبِّ شَيْءٌ؟ فِي ٱلْمِيعَادِ أَرْجِعُ إِلَيْكَ نَحْوَ زَمَانِ ٱلْحَيَاةِ وَيَكُونُ لِسَارَةَ ٱبْنٌ».","kl":"التكوين ١٨: ١٤","pp":["الرب والرجلان","إبراهيم","سارة"],"v":33},{"t":"هلاك سدوم ونجاة لوط","sec":"إبراهيم","w":"من أكثر أصحاحات الكتاب ظلمة. الملاكان يصلان إلى سدوم مساءً، ولوط \"جالس في باب سدوم\" (من وجهاء المدينة).","kv":"وَحَدَثَ لَمَّا أَخْرَبَ ٱللهُ مُدُنَ ٱلدَّائِرَةِ أَنَّ ٱللهَ ذَكَرَ إِبْرَاهِيمَ، وَأَرْسَلَ لُوطًا مِنْ وَسَطِ ٱلِٱنْقِلَابِ. حِينَ قَلَبَ ٱلْمُدُنَ ٱلَّتِي سَكَنَ فِيهَا لُوطٌ.","kl":"التكوين ١٩: ٢٩","pp":["لوط","امرأة لوط","رجال سدوم"],"v":38},{"t":"إبراهيم وأبيمالك: تكرار الخطأ","sec":"إبراهيم","w":"مفاجأة مؤلمة: بعد كل الوعود والعهود والظهورات، وقبل ولادة إسحاق مباشرة، يكرر إبراهيم نفس خطيته في مصر!","kv":"فَقَالَ لَهُ ٱللهُ فِي ٱلْحُلْمِ: «أَنَا أَيْضًا عَلِمْتُ أَنَّكَ بِسَلَامَةِ قَلْبِكَ فَعَلْتَ هَذَا. وَأَنَا أَيْضًا أَمْسَكْتُكَ عَنْ أَنْ تُخْطِئَ إِلَيَّ، لِذَلِكَ لَمْ أَدَعْكَ تَمَسُّهَا.","kl":"التكوين ٢٠: ٦","pp":["إبراهيم","سارة","أبيمالك"],"v":18},{"t":"ولادة إسحاق وطرد هاجر","sec":"إبراهيم","w":"أخيراً! بعد 25 سنة من الوعد الأول: «وافتقد الرب سارة كما قال، وفعل الرب لسارة كما تكلم.","kv":"وَٱفْتَقَدَ ٱلرَّبُّ سَارَةَ كَمَا قَالَ، وَفَعَلَ ٱلرَّبُّ لِسَارَةَ كَمَا تَكَلَّمَ. فَحَبِلَتْ سَارَةُ وَوَلَدَتْ لِإِبْرَاهِيمَ ٱبْنًا فِي شَيْخُوخَتِهِ، فِي ٱلْوَقْتِ ٱلَّذِي تَكَلَّمَ ٱللهُ عَنْهُ.","kl":"التكوين ٢١: ١–٢","pp":["إسحاق","سارة","إبراهيم"],"v":34},{"t":"تقديم إسحاق: الرب يرى","sec":"إبراهيم","w":"قمة قصة إبراهيم، وواحد من أعظم أصحاحات العهد القديم. «وحدث بعد هذه الأمور أن الله امتحن إبراهيم، فقال له: يا إبراهيم.","kv":"فَقَالَ إِبْرَاهِيمُ: «ٱللهُ يَرَى لَهُ ٱلْخَرُوفَ لِلْمُحْرَقَةِ يَا ٱبْنِي». فَذَهَبَا كِلَاهُمَا مَعًا.","kl":"التكوين ٢٢: ٨","pp":["إبراهيم","إسحاق","ملاك الرب"],"v":24},{"t":"موت سارة ومغارة المكفيلة","sec":"إبراهيم","w":"\"وكانت حياة سارة مئة وسبعاً وعشرين سنة... وماتت سارة في قرية أربع، التي هي حبرون، في أرض كنعان.","kv":"«أَنَا غَرِيبٌ وَنَزِيلٌ عِنْدَكُمْ. أَعْطُونِي مُلْكَ قَبْرٍ مَعَكُمْ لِأَدْفِنَ مَيْتِي مِنْ أَمَامِي».","kl":"التكوين ٢٣: ٤","pp":["سارة","إبراهيم","بنو حث"],"v":20},{"t":"زوجة لإسحاق: رفقة","sec":"إبراهيم","w":"أطول أصحاح في التكوين (67 آية)، قصة رومانسية وروحية عن العناية الإلهية في التفاصيل الصغيرة.","kv":"وَقَالَ: «مُبَارَكٌ ٱلرَّبُّ إِلَهُ سَيِّدِي إِبْرَاهِيمَ ٱلَّذِي لَمْ يَمْنَعْ لُطْفَهُ وَحَقَّهُ عَنْ سَيِّدِي. إِذْ كُنْتُ أَنَا فِي ٱلطَّرِيقِ، هَدَانِي ٱلرَّبُّ إِلَى بَيْتِ إِخْوَةِ سَيِّدِي».","kl":"التكوين ٢٤: ٢٧","pp":["إبراهيم","العبد","رفقة"],"v":67},{"t":"موت إبراهيم وولادة التوأمين وبيع البكورية","sec":"إسحاق ويعقوب","w":"أصحاح انتقالي. يبدأ بنهاية قصة إبراهيم: يتزوج قطورة وينجب ستة أبناء (منهم مديان)، لكنه \"أعطى إسحاق كل ما كان له\"، وأعطى أبناء السراري عطايا وصرفهم شرقاً.","kv":"فَقَالَ لَهَا ٱلرَّبُّ: «فِي بَطْنِكِ أُمَّتَانِ، وَمِنْ أَحْشَائِكِ يَفْتَرِقُ شَعْبَانِ: شَعْبٌ يَقْوَى عَلَى شَعْبٍ، وَكَبِيرٌ يُسْتَعْبَدُ لِصَغِيرٍ».","kl":"التكوين ٢٥: ٢٣","pp":["إبراهيم","قطورة","إسماعيل"],"v":34},{"t":"إسحاق والآبار: الرب أرحب لنا","sec":"إسحاق ويعقوب","w":"الأصحاح الوحيد المخصص لإسحاق كبطل رئيسي. جوع في الأرض (كما في أيام إبراهيم). ويظهر الرب لإسحاق: \"لا تنزل إلى مصر...","kv":"ثُمَّ نَقَلَ مِنْ هُنَاكَ وَحَفَرَ بِئْرًا أُخْرَى وَلَمْ يَتَخَاصَمُوا عَلَيْهَا، فَدَعَا ٱسْمَهَا «رَحُوبُوتَ»، وَقَالَ: «إِنَّهُ ٱلْآنَ قَدْ أَرْحَبَ لَنَا ٱلرَّبُّ وَأَثْمَرْنَا فِي ٱلْأَرْضِ».","kl":"التكوين ٢٦: ٢٢","pp":["إسحاق","رفقة","أبيمالك"],"v":35},{"t":"يعقوب يأخذ البركة بالخداع","sec":"إسحاق ويعقوب","w":"قصة عائلة مفككة، كل فرد فيها يخطئ. إسحاق شاخ وكلّت عيناه، ويريد أن يبارك عيسو سراً، رغم نبوة الله أن «الكبير يُستعبد للصغير» (25: 23)، ورغم أن عيسو باع البكورية وتزوج حثيتين.","kv":"فَٱرْتَعَدَ إِسْحَاقُ ٱرْتِعَادًا عَظِيمًا جِدًّا وَقَالَ: «فَمَنْ هُوَ ٱلَّذِي ٱصْطَادَ صَيْدًا وَأَتَى بِهِ إِلَيَّ فَأَكَلْتُ مِنَ ٱلْكُلِّ قَبْلَ أَنْ تَجِيءَ، وَبَارَكْتُهُ؟ نَعَمْ، وَيَكُونُ مُبَارَكًا».","kl":"التكوين ٢٧: ٣٣","pp":["إسحاق","رفقة","يعقوب"],"v":46},{"t":"سلم يعقوب في بيت إيل","sec":"إسحاق ويعقوب","w":"إسحاق يدعو يعقوب ويباركه هذه المرة عن وعي: \"الله القدير يباركك... ويعطيك بركة إبراهيم\"، ويرسله إلى فدان أرام ليأخذ زوجة من بنات لابان.","kv":"وَهَا أَنَا مَعَكَ، وَأَحْفَظُكَ حَيْثُمَا تَذْهَبُ، وَأَرُدُّكَ إِلَى هَذِهِ ٱلْأَرْضِ، لِأَنِّي لَا أَتْرُكُكَ حَتَّى أَفْعَلَ مَا كَلَّمْتُكَ بِهِ».","kl":"التكوين ٢٨: ١٥","pp":["إسحاق","يعقوب","عيسو"],"v":22},{"t":"يعقوب عند لابان: راحيل وليئة","sec":"إسحاق ويعقوب","w":"يعقوب يصل إلى أرض بني المشرق، إلى بئر في حقل حولها ثلاثة قطعان غنم، وعلى فم البئر حجر كبير.","kv":"وَرَأَى ٱلرَّبُّ أَنَّ لَيْئَةَ مَكْرُوهَةٌ فَفَتَحَ رَحِمَهَا، وَأَمَّا رَاحِيلُ فَكَانَتْ عَاقِرًا.","kl":"التكوين ٢٩: ٣١","pp":["يعقوب","راحيل","ليئة"],"v":35},{"t":"حرب الأختين وثروة يعقوب","sec":"إسحاق ويعقوب","w":"بيت يعقوب يتحول إلى ساحة منافسة مؤلمة. راحيل العاقر تغار من أختها وتصرخ في يعقوب: «هب لي بنين، وإلا فأنا أموت!».","kv":"وَذَكَرَ ٱللهُ رَاحِيلَ، وَسَمِعَ لَهَا ٱللهُ وَفَتَحَ رَحِمَهَا،","kl":"التكوين ٣٠: ٢٢","pp":["راحيل","ليئة","يعقوب"],"v":43},{"t":"يعقوب يهرب من لابان: عهد جلعاد","sec":"إسحاق ويعقوب","w":"بعد عشرين سنة، تتغير الأجواء: بنو لابان يتذمرون أن يعقوب أخذ ثروة أبيهم، ووجه لابان «ليس معه كأمس وأول من أمس».","kv":"لَوْلَا أَنَّ إِلَهَ أَبِي إِلَهَ إِبْرَاهِيمَ وَهَيْبَةَ إِسْحَاقَ كَانَ مَعِي، لَكُنْتَ ٱلْآنَ قَدْ صَرَفْتَنِي فَارِغًا. مَشَقَّتِي وَتَعَبَ يَدَيَّ قَدْ نَظَرَ ٱللهُ، فَوَبَّخَكَ ٱلْبَارِحَةَ».","kl":"التكوين ٣١: ٤٢","pp":["يعقوب","راحيل","ليئة"],"v":55},{"t":"يعقوب يصارع الله في فنيئيل","sec":"إسحاق ويعقوب","w":"نقطة التحول في حياة يعقوب. وهو في طريقه للقاء عيسو، «لاقاه ملائكة الله»، فسمى المكان «محنايم» (معسكرين).","kv":"فَقَالَ: «لَا يُدْعَى ٱسْمُكَ فِي مَا بَعْدُ يَعْقُوبَ بَلْ إِسْرَائِيلَ، لِأَنَّكَ جَاهَدْتَ مَعَ ٱللهِ وَٱلنَّاسِ وَقَدَرْتَ».","kl":"التكوين ٣٢: ٢٨","pp":["يعقوب","الإنسان المصارع","عيسو"],"v":32},{"t":"المصالحة: رأيت وجهك كما يُرى وجه الله","sec":"إسحاق ويعقوب","w":"في الصباح بعد فنيئيل، يرفع يعقوب عينيه فيرى عيسو قادماً ومعه 400 رجل. يرتب عائلته (الجاريتان وأولادهما أولاً، ثم ليئة وأولادها، ثم راحيل ويوسف أخيراً: ترتيب يكشف تحيزه).","kv":"فَرَكَضَ عِيسُو لِلِقَائِهِ وَعَانَقَهُ وَوَقَعَ عَلَى عُنُقِهِ وَقَبَّلَهُ، وَبَكَيَا.","kl":"التكوين ٣٣: ٤","pp":["يعقوب","عيسو","راحيل ويوسف"],"v":20},{"t":"دينة وشكيم: الانتقام في شكيم","sec":"إسحاق ويعقوب","w":"من أصعب أصحاحات الكتاب وأكثرها ظلمة، ولا يُذكر فيه الله إلا في الاسم. دينة، ابنة ليئة، \"خرجت لتنظر بنات الأرض\".","kv":"وَأَتَى بَنُو يَعْقُوبَ مِنَ ٱلْحَقْلِ حِينَ سَمِعُوا. وَغَضِبَ ٱلرِّجَالُ وَٱغْتَاظُوا جِدًّا لِأَنَّهُ صَنَعَ قَبَاحَةً فِي إِسْرَائِيلَ بِمُضَاجَعَةِ ٱبْنَةِ يَعْقُوبَ، وَهَكَذَا لَا يُصْنَعُ.","kl":"التكوين ٣٤: ٧","pp":["دينة","شكيم","حمور"],"v":31},{"t":"الرجوع إلى بيت إيل: موت راحيل وإسحاق","sec":"إسحاق ويعقوب","w":"بعد كارثة شكيم، يتكلم الله: «قم اصعد إلى بيت إيل وأقم هناك، واصنع هناك مذبحاً لله الذي ظهر لك حين هربت من وجه عيسو أخيك».","kv":"وَلْنَقُمْ وَنَصْعَدْ إِلَى بَيْتِ إِيلَ، فَأَصْنَعَ هُنَاكَ مَذْبَحًا لِلهِ ٱلَّذِي ٱسْتَجَابَ لِي فِي يَوْمِ ضِيقَتِي، وَكَانَ مَعِي فِي ٱلطَّرِيقِ ٱلَّذِي ذَهَبْتُ فِيهِ».","kl":"التكوين ٣٥: ٣","pp":["يعقوب / إسرائيل","دبورة","راحيل"],"v":29},{"t":"مواليد عيسو: أدوم","sec":"إسحاق ويعقوب","w":"«وهذه مواليد عيسو، الذي هو أدوم». قبل أن ينتقل التكوين إلى قصة يوسف الطويلة، يغلق ملف عيسو، كما أغلق ملف إسماعيل قبل قصة يعقوب (25: 12–18).","kv":"وَهَؤُلَاءِ هُمُ ٱلْمُلُوكُ ٱلَّذِينَ مَلَكُوا فِي أَرْضِ أَدُومَ، قَبْلَمَا مَلَكَ مَلِكٌ لِبَنِي إِسْرَائِيلَ.","kl":"التكوين ٣٦: ٣١","pp":["عيسو","أليفاز","عماليق"],"v":43},{"t":"يوسف وأحلامه: بيعه من إخوته","sec":"يوسف وإخوته","w":"بداية القصة الأطول والأكثر تماسكاً في التكوين: «هذه مواليد يعقوب». يوسف، ابن سبع عشرة سنة، يرعى مع إخوته (أبناء الجاريتين)، «وأتى يوسف بنميمتهم الرديئة إلى أبيهم».","kv":"فَٱلْآنَ هَلُمَّ نَقْتُلْهُ وَنَطْرَحْهُ فِي إِحْدَى ٱلْآبَارِ وَنَقُولُ: وَحْشٌ رَدِيءٌ أَكَلَهُ. فَنَرَى مَاذَا تَكُونُ أَحْلَامُهُ».","kl":"التكوين ٣٧: ٢٠","pp":["يوسف","يعقوب","رأوبين"],"v":36},{"t":"يهوذا وثامار: هي أبر مني","sec":"يوسف وإخوته","w":"فاصل مفاجئ في قصة يوسف. بعد بيع يوسف مباشرة، \"نزل يهوذا من عند إخوته\"، وتزوج امرأة كنعانية (ابنة شوع)، فولدت له عير وأونان وشيلة.","kv":"فَتَحَقَّقَهَا يَهُوذَا وَقَالَ: «هِيَ أَبَرُّ مِنِّي، لِأَنِّي لَمْ أُعْطِهَا لِشِيلَةَ ٱبْنِي». فَلَمْ يَعُدْ يَعْرِفُهَا أَيْضًا.","kl":"التكوين ٣٨: ٢٦","pp":["يهوذا","ثامار","عير"],"v":30},{"t":"يوسف في بيت فوطيفار والسجن: وكان الرب مع يوسف","sec":"يوسف وإخوته","w":"نرجع إلى يوسف في مصر. «وأما يوسف فأُنزل إلى مصر، واشتراه فوطيفار». والعبارة المفتاحية تتكرر: «وكان الرب مع يوسف، فكان رجلاً ناجحاً».","kv":"لَيْسَ هُوَ فِي هَذَا ٱلْبَيْتِ أَعْظَمَ مِنِّي. وَلَمْ يُمْسِكْ عَنِّي شَيْئًا غَيْرَكِ، لِأَنَّكِ ٱمْرَأَتُهُ. فَكَيْفَ أَصْنَعُ هَذَا ٱلشَّرَّ ٱلْعَظِيمَ وَأُخْطِئُ إِلَى ٱللهِ؟».","kl":"التكوين ٣٩: ٩","pp":["يوسف","فوطيفار","امرأة فوطيفار"],"v":23},{"t":"حلما الساقي والخباز: أليست التعابير لله؟","sec":"يوسف وإخوته","w":"اثنان من كبار موظفي فرعون، رئيس السقاة ورئيس الخبازين، «أذنبا إلى سيدهما»، فوُضعا في نفس السجن، و«أقام رئيس الشرط يوسف عندهما فخدمهما».","kv":"فَقَالَا لَهُ: «حَلُمْنَا حُلْمًا وَلَيْسَ مَنْ يُعَبِّرُهُ». فَقَالَ لَهُمَا يُوسُفُ: «أَلَيْسَتْ لِلهِ ٱلتَّعَابِيرُ؟ قُصَّا عَلَيَّ».","kl":"التكوين ٤٠: ٨","pp":["يوسف","رئيس السقاة","رئيس الخبازين"],"v":23},{"t":"حلما فرعون: من السجن إلى العرش","sec":"يوسف وإخوته","w":"«وحدث من بعد سنتين من الزمان أن فرعون رأى حلماً»: سبع بقرات حسنة سمينة تصعد من النيل، ثم سبع بقرات قبيحة رقيقة تأكلها.","kv":"فَأَجَابَ يُوسُفُ فِرْعَوْنَ قَائِلًا: «لَيْسَ لِي. ٱللهُ يُجِيبُ بِسَلَامَةٍ فِرْعَوْنَ».","kl":"التكوين ٤١: ١٦","pp":["يوسف","فرعون","رئيس السقاة"],"v":57},{"t":"الإخوة في مصر: حقاً إننا مذنبون","sec":"يوسف وإخوته","w":"الجوع يصل إلى كنعان. يعقوب يسمع أن في مصر قمحاً: \"لماذا تنظرون بعضكم إلى بعض؟ انزلوا إلى هناك واشتروا لنا\".","kv":"وَقَالُوا بَعْضُهُمْ لِبَعْضٍ: «حَقًّا إِنَّنَا مُذْنِبُونَ إِلَى أَخِينَا ٱلَّذِي رَأَيْنَا ضِيقَةَ نَفْسِهِ لَمَّا ٱسْتَرْحَمَنَا وَلَمْ نَسْمَعْ. لِذَلِكَ جَاءَتْ عَلَيْنَا هَذِهِ ٱلضِّيقَةُ».","kl":"التكوين ٤٢: ٢١","pp":["يوسف","الإخوة العشرة","رأوبين"],"v":38},{"t":"الرحلة الثانية: بنيامين والوليمة","sec":"يوسف وإخوته","w":"«وكان الجوع شديداً في الأرض». ينفد القمح، ويقول يعقوب: «ارجعوا اشتروا لنا قليلاً من الطعام».","kv":"أَنَا أَضْمَنُهُ. مِنْ يَدِي تَطْلُبُهُ. إِنْ لَمْ أَجِئْ بِهِ إِلَيْكَ وَأُوقِفْهُ قُدَّامَكَ، أَصِرْ مُذْنِبًا إِلَيْكَ كُلَّ ٱلْأَيَّامِ.","kl":"التكوين ٤٣: ٩","pp":["يهوذا","يعقوب / إسرائيل","بنيامين"],"v":34},{"t":"الطاس في عدل بنيامين: شفاعة يهوذا","sec":"يوسف وإخوته","w":"الاختبار الأخير. يوسف يأمر وكيله أن يملأ عدال الرجال طعاماً، ويرد فضة كل واحد، و\"طاسي، طاس الفضة، اجعله في فم عدل الصغير\".","kv":"فَٱلْآنَ لِيَمْكُثْ عَبْدُكَ عِوَضًا عَنِ ٱلْغُلَامِ، عَبْدًا لِسَيِّدِي، وَيَصْعَدِ ٱلْغُلَامُ مَعَ إِخْوَتِهِ.","kl":"التكوين ٤٤: ٣٣","pp":["يهوذا","بنيامين","الإخوة"],"v":34},{"t":"أنا يوسف: الله أرسلني قدامكم","sec":"يوسف وإخوته","w":"بعد خطاب يهوذا، «لم يستطع يوسف أن يضبط نفسه». يأمر الجميع بالخروج، «فلم يقف أحد عنده حين عرّف يوسف إخوته بنفسه.","kv":"فَٱلْآنَ لَيْسَ أَنْتُمْ أَرْسَلْتُمُونِي إِلَى هُنَا بَلِ ٱللهُ. وَهُوَ قَدْ جَعَلَنِي أَبًا لِفِرْعَوْنَ وَسَيِّدًا لِكُلِّ بَيْتِهِ وَمُتَسَلِّطًا عَلَى كُلِّ أَرْضِ مِصْرَ.","kl":"التكوين ٤٥: ٨","pp":["يوسف","الإخوة","بنيامين"],"v":28},{"t":"يعقوب ينزل إلى مصر: لا تخف","sec":"يوسف وإخوته","w":"«فارتحل إسرائيل وكل ما كان له، وأتى إلى بئر سبع، وذبح ذبائح لإله أبيه إسحاق». قبل أن يغادر أرض الموعد، يتوقف يعقوب عند حدودها الجنوبية ليعبد، ربما مع تردد: الله منع إسحاق من النزول إلى …","kv":"فَقَالَ: «أَنَا ٱللهُ، إِلَهُ أَبِيكَ. لَا تَخَفْ مِنَ ٱلنُّزُولِ إِلَى مِصْرَ، لِأَنِّي أَجْعَلُكَ أُمَّةً عَظِيمَةً هُنَاكَ. أَنَا أَنْزِلُ مَعَكَ إِلَى مِصْرَ، وَأَنَا أُصْعِدُكَ أَيْضًا. وَيَضَعُ يُوسُفُ يَدَهُ عَلَى عَيْنَيْكَ».","kl":"التكوين ٤٦: ٣–٤","pp":["يعقوب / إسرائيل","يهوذا","يوسف"],"v":34},{"t":"يعقوب أمام فرعون وسياسة يوسف في المجاعة","sec":"يوسف وإخوته","w":"يوسف يقدم خمسة من إخوته لفرعون، فيقولون ما علمهم: «عبيدك رعاة غنم»، ويطلبون السكن في جاسان.","kv":"فَقَالَ يَعْقُوبُ لِفِرْعَوْنَ: «أَيَّامُ سِنِي غُرْبَتِي مِئَةٌ وَثَلَاثُونَ سَنَةً. قَلِيلَةً وَ رَدِيَّةً كَانَتْ أَيَّامُ سِنِي حَيَاتِي، وَلَمْ تَبْلُغْ إِلَى أَيَّامِ سِنِي حَيَاةِ آبَائِي فِي أَيَّامِ غُرْبَتِهِمْ».","kl":"التكوين ٤٧: ٩","pp":["يعقوب","فرعون","يوسف"],"v":31},{"t":"يعقوب يبارك منسى وأفرايم","sec":"يوسف وإخوته","w":"«قيل ليوسف: هوذا أبوك مريض». فيأخذ يوسف ابنيه منسى وأفرايم ويذهب إليه. «فتشدد إسرائيل وجلس على السرير».","kv":"وَبَارَكَ يُوسُفَ وَقَالَ: «ٱللهُ ٱلَّذِي سَارَ أَمَامَهُ أَبَوَايَ إِبْرَاهِيمُ وَإِسْحَاقُ، ٱللهُ ٱلَّذِي رَعَانِي مُنْذُ وُجُودِي إِلَى هَذَا ٱلْيَوْمِ، ٱلْمَلَاكُ ٱلَّذِي خَلَّصَنِي مِنْ كُلِّ شَرٍّ، يُبَارِكُ ٱلْغُلَامَيْنِ. وَلْيُدْعَ عَلَيْهِمَا ٱسْمِي وَٱسْمُ أَبَوَيَّ إِبْرَاهِيمَ وَإِسْحَاقَ، وَلْيَكْثُرَا كَثِيرًا فِي ٱلْأَرْضِ».","kl":"التكوين ٤٨: ١٥–١٦","pp":["يعقوب / إسرائيل","يوسف","منسى"],"v":22},{"t":"بركات يعقوب لأبنائه: حتى يأتي شيلون","sec":"يوسف وإخوته","w":"«ودعا يعقوب بنيه وقال: اجتمعوا لأنبئكم بما يصيبكم في آخر الأيام». أطول قصيدة نبوية في التكوين.","kv":"لَا يَزُولُ قَضِيبٌ مِنْ يَهُوذَا وَمُشْتَرِعٌ مِنْ بَيْنِ رِجْلَيْهِ حَتَّى يَأْتِيَ شِيلُونُ وَلَهُ يَكُونُ خُضُوعُ شُعُوبٍ.","kl":"التكوين ٤٩: ١٠","pp":["رأوبين","شمعون ولاوي","يهوذا"],"v":33},{"t":"أنتم قصدتم لي شراً، أما الله فقصد به خيراً","sec":"يوسف وإخوته","w":"الأصحاح الأخير في التكوين. «فوقع يوسف على وجه أبيه وبكى عليه وقبله». يأمر الأطباء بتحنيطه (40 يوماً)، ويبكي المصريون عليه 70 يوماً: جنازة رسمية كجنازة ملكية.","kv":"أَنْتُمْ قَصَدْتُمْ لِي شَرًّا، أَمَّا ٱللهُ فَقَصَدَ بِهِ خَيْرًا، لِكَيْ يَفْعَلَ كَمَا ٱلْيَوْمَ، لِيُحْيِيَ شَعْبًا كَثِيرًا.","kl":"التكوين ٥٠: ٢٠","pp":["يوسف","الإخوة","المصريون"],"v":26}],"books":[{"id":"Gen","slug":"genesis","name":"التكوين","t":"ot","g":"torah","gn":"التوراة","n":50,"done":true},{"id":"Exod","slug":"exodus","name":"الخروج","t":"ot","g":"torah","gn":"التوراة","n":40,"done":false},{"id":"Lev","slug":"leviticus","name":"اللاويين","t":"ot","g":"torah","gn":"التوراة","n":27,"done   requestAnimationFrame(() => { items[start] && items[start].scrollIntoView({ inline: 'center', block: 'nearest' }); items[start] && items[start].classList.add('on'); onChange(items[start]); });

function flip(dir) {
