<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ثلاث أفكار للتصميم · لمجد الله</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#111}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:#1d1b18}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.d{font-family:'Readex Pro',system-ui,sans-serif}
.s{font-family:'Noto Naskh Arabic',serif}
svg{display:block}

/* concept switcher */
#switch{position:fixed;top:0;inset-inline:0;z-index:100;height:46px;display:flex;align-items:center;gap:6px;padding:0 8px;background:#111;color:#fff;font-family:'Readex Pro';font-size:13px}
#switch span{opacity:.6;margin-inline-end:4px;white-space:nowrap}
#switch button{flex:1;height:32px;border-radius:16px;background:#2a2a2a;font-size:13px;white-space:nowrap}
#switch button[aria-pressed=true]{background:#fff;color:#111;font-weight:500}
#stage{position:fixed;top:46px;bottom:0;inset-inline:0;max-width:520px;margin:0 auto;overflow:hidden;background:#F6EFE3}
.concept{position:absolute;inset:0;display:none}
.concept.on{display:block}

/* ===== A: stories ===== */
#A{background:#1E2A4A}
.bars{position:absolute;top:10px;inset-inline:12px;display:flex;gap:4px;z-index:5}
.bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.bars i b{display:block;height:100%;width:0;background:#fff}
.bars i.done b{width:100%}
.atop{position:absolute;top:20px;inset-inline:12px;display:flex;align-items:center;justify-content:space-between;z-index:5;color:#fff;font-family:'Readex Pro';font-size:13px;padding-top:6px}
.atop button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.18)}
.card{position:absolute;inset:0;padding:84px 26px 110px;display:flex;flex-direction:column;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.card.on{opacity:1;pointer-events:auto}
.card .ey{font-family:'Readex Pro';font-size:14px;opacity:.75;margin-bottom:8px;letter-spacing:.2px}
.card h1{font-family:'Readex Pro';font-weight:700;font-size:44px;line-height:1.15;margin:0}
.card h2{font-family:'Readex Pro';font-weight:600;font-size:28px;line-height:1.3;margin:0 0 18px}
.card p{font-size:19px;line-height:1.8;margin:0}
.card ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:14px}
.card li{display:flex;gap:14px;font-size:18px;line-height:1.65}
.card li em{font-style:normal;font-family:'Readex Pro';font-weight:700;font-size:15px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.18)}
.bigq{font-family:'Noto Naskh Arabic';font-size:30px;line-height:1.9}
.pillbtn{margin-top:26px;align-self:flex-start;height:52px;padding:0 24px;border-radius:26px;font-family:'Readex Pro';font-weight:500;font-size:16px;display:inline-flex;align-items:center;gap:10px}
.hint{position:absolute;bottom:34px;inset-inline:0;text-align:center;font-family:'Readex Pro';font-size:13px;opacity:.7}
.tapzone{position:absolute;top:70px;bottom:90px;width:30%;z-index:3}
.tapzone.r{right:0}.tapzone.l{left:0}
.amap{border-radius:22px;overflow:hidden;margin:6px -6px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:14px;opacity:.9}
.legend b{font-family:'Readex Pro';font-weight:600}
.word{font-family:'Noto Naskh Arabic';font-size:56px;line-height:1.2;margin:4px 0 6px}
/* overlays (shared) */
.ov{position:absolute;inset:0;z-index:20;background:#FBF7F0;overflow:auto;transform:translateY(100%);transition:transform .3s ease}
.ov.on{transform:none}
.ovh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;height:58px;padding:0 14px;background:rgba(251,247,240,.94);backdrop-filter:blur(8px);border-bottom:1px solid #ece4d6;font-family:'Readex Pro';font-weight:600;font-size:17px}
.ovh span{flex:1}
.ovh button{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#efe7da}
.read{padding:8px 22px 60px;max-width:640px;margin:0 auto}
.peri{font-family:'Readex Pro';font-weight:600;font-size:16px;color:#C2502D;margin:28px 0 4px}
.scr{font-family:'Noto Naskh Arabic';font-size:21px;line-height:2.15}
.scr p{margin:0}
.vn{font-family:'Readex Pro';font-size:.55em;color:#B08A4E;font-weight:600;vertical-align:super;margin:0 2px}
.key{background:linear-gradient(transparent 58%,#F6D9CC 58%)}
.acc{margin:14px 0}
.acc details{background:#fff;border:1px solid #ece4d6;border-radius:18px;margin-bottom:10px;overflow:hidden}
.acc summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px;font-family:'Readex Pro';font-weight:500;font-size:16.5px;cursor:pointer}
.acc summary::-webkit-details-marker{display:none}
.acc summary i{font-style:normal;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:none}
.acc summary span{flex:1}
.acc summary small{color:#9a9388;font-weight:400}
.acc .b{padding:0 16px 16px;font-size:16.5px;line-height:1.85}
.en{padding:10px 0;border-top:1px dashed #ece4d6}
.en:first-child{border-top:0;padding-top:0}
.en b{display:block;font-family:'Readex Pro';font-weight:600}
.en p{margin:2px 0 0;color:#5f5a52}
.orig{font-family:'Noto Naskh Arabic';color:#B08A4E;font-weight:400}
.tg{display:inline-block;font-family:'Readex Pro';font-size:12px;border-radius:12px;padding:1px 10px;margin-bottom:4px}
.tg.agreed{background:#E3F0E8;color:#3E7A5A}.tg.debated{background:#F7EDD6;color:#9A6A12}

/* ===== B: map first ===== */
#B{background:#EFE6D3}
#bmap{position:absolute;top:66px;bottom:200px;inset-inline:0;overflow:hidden}
#bmap svg{width:100%;height:100%}
.bpill{position:absolute;top:12px;inset-inline:12px;z-index:5;display:flex;align-items:center;gap:6px;background:#fff;border-radius:20px;box-shadow:0 6px 20px rgba(0,0,0,.12);padding:6px}
.bpill button.nv{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:#F3ECE0;font-size:18px}
.bpill .t{flex:1;text-align:center;line-height:1.25;font-family:'Readex Pro'}
.bpill .t b{display:block;font-weight:600;font-size:16px}
.bpill .t small{color:#8d867b;font-size:12.5px}
.bsheet{position:absolute;inset-inline:0;bottom:0;z-index:6;background:#FBF7F0;border-radius:26px 26px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.15);height:88%;transform:translateY(calc(100% - 210px));transition:transform .3s ease;display:flex;flex-direction:column}
.bsheet.half{transform:translateY(45%)}
.bsheet.full{transform:translateY(0)}
.grip{padding:10px 0 4px;display:grid;place-items:center;cursor:grab;touch-action:none}
.grip i{width:44px;height:5px;border-radius:3px;background:#d9cfbf}
.bhead{padding:4px 18px 10px}
.bhead h3{font-family:'Readex Pro';font-weight:600;font-size:20px;margin:0}
.bhead p{margin:4px 0 0;color:#6b655c;font-size:15px;line-height:1.6}
.btabs{display:flex;gap:8px;padding:0 18px 12px}
.btabs button{flex:1;height:44px;border-radius:14px;background:#EFE7DA;font-family:'Readex Pro';font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:6px}
.btabs button[aria-pressed=true]{background:#1d1b18;color:#fff}
.bbody{flex:1;overflow:auto;padding:0 18px 40px;border-top:1px solid #ece4d6}
.place{display:flex;gap:12px;align-items:flex-start;margin:10px 0 0;padding:14px;border-radius:18px;background:#fff;border:1px solid #ece4d6}
.place .n{width:34px;height:34px;border-radius:50%;background:#C2502D;color:#fff;font-family:'Readex Pro';font-weight:600;display:grid;place-items:center;flex:none}
.place b{font-family:'Readex Pro';font-weight:600;font-size:16px}
.place p{margin:2px 0 0;color:#5f5a52;font-size:15px;line-height:1.7}

/* ===== C: magazine ===== */
#C{overflow-y:auto;scroll-behavior:smooth;background:#111}
.blk{min-height:100%;padding:70px 26px 60px;position:relative}
.blk .no{font-family:'Readex Pro';font-weight:300;font-size:15px;letter-spacing:1px;opacity:.7}
.blk h2{font-family:'Readex Pro';font-weight:700;font-size:34px;line-height:1.2;margin:4px 0 20px}
.blk p{font-size:18px;line-height:1.85;margin:0 0 12px}
.c-hero{background:#111;color:#F6EFE3;display:flex;flex-direction:column;justify-content:flex-end}
.c-hero .giant{font-family:'Readex Pro';font-weight:700;font-size:170px;line-height:.9;color:#E4572E;margin:0 -6px 6px}
.c-hero h1{font-family:'Readex Pro';font-weight:700;font-size:40px;line-height:1.15;margin:0}
.c-hero .ey{font-family:'Readex Pro';opacity:.7;font-size:14px;margin-bottom:12px}
.c-sum{background:#F6EFE3}
.c-sum ol{list-style:none;padding:0;margin:0;counter-reset:s}
.c-sum li{counter-increment:s;display:flex;gap:16px;padding:16px 0;border-top:2px solid #1d1b18;font-size:18px;line-height:1.7}
.c-sum li:before{content:counter(s, arabic-indic);font-family:'Readex Pro';font-weight:700;font-size:28px;line-height:1.1;color:#E4572E;width:30px;flex:none}
.c-text{background:#FBF7F0}
.c-map{background:#1F3B3A;color:#F6EFE3}
.c-map .mp{border-radius:22px;overflow:hidden;margin:0 -8px}
.c-christ{background:#E4572E;color:#fff}
.c-word{background:#F2C14E}
.c-deep{background:#F6EFE3}
.c-live{background:#111;color:#F6EFE3}
.c-live .q{padding:18px 0;border-top:1px solid #333;font-size:18px;line-height:1.7}
.c-next{background:#E4572E;color:#fff;min-height:auto;display:block;padding:40px 26px 80px}
.c-next b{display:block;font-family:'Readex Pro';font-size:30px;font-weight:700;line-height:1.25}

.csec{position:sticky;top:0;z-index:9;height:40px;margin-bottom:-40px;display:flex;align-items:center;padding:0 18px;background:rgba(17,17,17,.88);backdrop-filter:blur(8px);color:#fff;font-family:'Readex Pro';font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none}
.csec.on{opacity:1}
.csec i{position:absolute;bottom:0;inset-inline-start:0;height:3px;background:#E4572E;width:0}
.rail{position:sticky;top:50%;float:left;margin-left:8px;transform:translateY(-50%);z-index:9;display:flex;flex-direction:column;gap:6px;height:0;overflow:visible}
.rail-in{display:flex;flex-direction:column;gap:7px;background:rgba(17,17,17,.75);backdrop-filter:blur(6px);padding:8px 6px;border-radius:20px;transform:translateY(-50%)}
.rail button{width:26px;height:26px;border-radius:50%;font-family:'Readex Pro';font-size:12px;color:#fff;opacity:.55;display:grid;place-items:center}
.rail button.on{opacity:1;background:#E4572E}
.cjump{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:30;background:#111;color:#fff;font-family:'Readex Pro';font-size:14px;height:46px;padding:0 20px;border-radius:23px;display:none;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.cjump.on{display:flex}
.jmenu{position:absolute;inset:0;z-index:40;background:rgba(17,17,17,.96);color:#fff;display:none;flex-direction:column;justify-content:center;padding:30px}
.jmenu.on{display:flex}
.jmenu button{display:flex;gap:16px;align-items:baseline;text-align:start;padding:12px 0;font-family:'Readex Pro';font-size:24px;font-weight:600;border-bottom:1px solid #333}
.jmenu button i{font-style:normal;font-weight:300;font-size:15px;color:#E4572E;width:28px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);z-index:200;background:#111;color:#fff;font-family:'Readex Pro';font-size:14px;padding:10px 18px;border-radius:14px;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div id="switch"><span>الفكرة:</span>
  <button data-c="A" aria-pressed="true">١ · قصص</button>
  <button data-c="B" aria-pressed="false">٢ · الخريطة أولاً</button>
  <button data-c="C" aria-pressed="false">٣ · مجلة</button>
</div>
<div id="stage">
  <section class="concept on" id="A"></section>
  <section class="concept" id="B"></section>
  <section class="concept" id="C"></section>
</div>
<div class="toast" id="toast"></div>
<script>
const D = {"ch":{"title":"دعوة أبرام والوعد","section":"إبراهيم (11: 27 – 25: 18)","where":"نقطة تحول في الكتاب كله. بعد أحد عشر أصحاحاً عن البشرية كلها وفشلها المتكرر، يتكلم الله إلى رجل واحد: «اذهب من أرضك ومن عشيرتك ومن بيت أبيك إلى الأرض التي أريك». ومعها سبعة وعود: «فأجعلك أمة عظيمة، وأباركك، وأعظم اسمك، وتكون بركة. وأبارك مباركيك، ولاعنك ألعنه، وتتبارك فيك جميع قبائل الأرض». فذهب أبرام «كما قال له الرب»، وهو ابن خمس وسبعين سنة، مع ساراي ولوط. وصل إلى شكيم في كنعان، فظهر له الرب وقال: «لنسلك أعطي هذه الأرض»، فبنى مذبحاً. ثم إلى بيت إيل، فبنى مذبحاً آخر و«دعا باسم الرب». لكن جاء جوع، فنزل أبرام إلى مصر. وهناك خاف على حياته لأن ساراي جميلة، فطلب منها أن تقول إنها أخته. فأُخذت إلى بيت فرعون! لكن الرب ضرب فرعون وبيته بضربات عظيمة، ففهم فرعون الحقيقة ووبخ أبرام وأخرجه. رجل الإيمان العظيم يسقط في أول اختبار.","before":"الأصحاح الحادي عشر: برج بابل، ونسب سام حتى أبرام، وساراي العاقر.","after":"الأصحاح الثالث عشر: أبرام ولوط يفترقان.","pericopes":[{"at":1,"t":"الدعوة والوعود"},{"at":4,"t":"الطاعة والرحيل"},{"at":6,"t":"شكيم: لنسلك أعطي هذه الأرض"},{"at":8,"t":"بيت إيل: دعا باسم الرب"},{"at":10,"t":"النزول إلى مصر"},{"at":14,"t":"ساراي في بيت فرعون"},{"at":17,"t":"الرب يحمي ساراي"}],"outline":[{"r":"1","t":"وقال الرب لأبرام: اذهب من أرضك ومن عشيرتك ومن بيت أبيك إلى الأرض التي أريك"},{"r":"2-3","t":"فأجعلك أمة عظيمة وأباركك وأعظم اسمك، وتكون بركة. وأبارك مباركيك، ولاعنك ألعنه. وتتبارك فيك جميع قبائل الأرض"},{"r":"4-5","t":"فذهب أبرام كما قال له الرب، وذهب معه لوط. وكان أبرام ابن خمس وسبعين سنة لما خرج من حاران... وخرجوا ليذهبوا إلى أرض كنعان. فأتوا إلى أرض كنعان"},{"r":"6-7","t":"واجتاز أبرام في الأرض إلى مكان شكيم إلى بلوطة مورة. وكان الكنعانيون حينئذ في الأرض. وظهر الرب لأبرام وقال: لنسلك أعطي هذه الأرض. فبنى هناك مذبحاً للرب الذي ظهر له"},{"r":"8-9","t":"ثم نقل من هناك إلى الجبل شرقي بيت إيل ونصب خيمته... فبنى هناك مذبحاً للرب ودعا باسم الرب. ثم ارتحل أبرام ارتحالاً متوالياً نحو الجنوب"},{"r":"10-13","t":"وحدث جوع في الأرض، فانحدر أبرام إلى مصر ليتغرب هناك... وقال لساراي امرأته: إني قد علمت أنك امرأة حسنة المنظر... فيقتلونني ويستبقونك. قولي إنك أختي، ليكون لي خير بسببك وتحيا نفسي من أجلك"},{"r":"14-16","t":"فحدث لما دخل أبرام إلى مصر أن المصريين رأوا المرأة أنها حسنة جداً... فأُخذت المرأة إلى بيت فرعون. فصنع إلى أبرام خيراً بسببها، وصار له غنم وبقر وحمير وعبيد وإماء وأتن وجمال"},{"r":"17-20","t":"فضرب الرب فرعون وبيته ضربات عظيمة بسبب ساراي امرأة أبرام. فدعا فرعون أبرام وقال: ما هذا الذي صنعت بي؟ لماذا لم تخبرني أنها امرأتك؟... والآن هوذا امرأتك، خذها واذهب! فأوصى عليه فرعون رجالاً فشيعوه وامرأته وكل ما كان له"}],"keyVerse":"Gen.12.3","people":[{"n":"أبرام","d":"ابن 75 سنة، من عائلة وثنية (يش 24: 2)، بلا أولاد. الله يختاره بنعمة مطلقة، لا لفضل فيه. يطيع بإيمان (عب 11: 8)، لكنه يسقط في الخوف والكذب في مصر."},{"n":"ساراي","d":"جميلة جداً رغم أنها في الستين أو أكثر. ضحية خوف زوجها. والله يحميها لأنها أم النسل الموعود."},{"n":"لوط","d":"ابن أخي أبرام، يرافقه. سيصير لاحقاً سبب مشكلة."},{"n":"فرعون","d":"لقب ملك مصر («البيت العظيم»). لا يُذكر اسمه. المفارقة: الوثني يتصرف بنزاهة أكثر من رجل الإيمان، ويوبخه."}],"places":[{"n":"حاران","d":"نقطة الانطلاق، في شمال بلاد الرافدين. نحو 650 كم إلى كنعان."},{"n":"شكيم","d":"مدينة في وسط كنعان، بين جبلي عيبال وجرزيم (نابلس اليوم). أول مكان يصل إليه أبرام ويبني فيه مذبحاً. وفيها سيجدد يشوع العهد (يش 24)، وقربها بئر يعقوب حيث تكلم يسوع مع السامرية (يو 4)."},{"n":"بيت إيل","d":"«بيت الله»، شمال أورشليم. فيها سيرى يعقوب السلم (28: 19)."},{"n":"النقب","d":"«الجنوب»، المنطقة الصحراوية جنوب كنعان."},{"n":"مصر","d":"ملجأ تقليدي وقت الجوع بسبب النيل. وسيتكرر النزول إلى مصر مع يعقوب وأبنائه."}],"summary":["وقال الرب لأبرام: اذهب من أرضك ومن عشيرتك ومن بيت أبيك إلى الأرض التي أريك. فأجعلك أمة عظيمة وأباركك وأعظم اسمك، وتكون بركة. وأبارك مباركيك، ولاعنك ألعنه. وتتبارك فيك جميع قبائل الأرض.","فذهب أبرام كما قال له الرب، وذهب معه لوط. وكان أبرام ابن خمس وسبعين سنة لما خرج من حاران. فأخذ أبرام ساراي امرأته، ولوطاً ابن أخيه، وكل مقتنياتهما التي اقتنيا والنفوس التي امتلكا في حاران. وخرجوا ليذهبوا إلى أرض كنعان. فأتوا إلى أرض كنعان. واجتاز أبرام في الأرض إلى مكان شكيم إلى بلوطة مورة. وكان الكنعانيون حينئذ في الأرض. وظهر الرب لأبرام وقال: لنسلك أعطي هذه الأرض. فبنى هناك مذبحاً للرب الذي ظهر له. ثم نقل من هناك إلى الجبل شرقي بيت إيل ونصب خيمته... فبنى هناك مذبحاً للرب ودعا باسم الرب.","وحدث جوع في الأرض، فانحدر أبرام إلى مصر ليتغرب هناك، لأن الجوع في الأرض كان شديداً. وحدث لما قرب أن يدخل مصر أنه قال لساراي امرأته: إني قد علمت أنك امرأة حسنة المنظر. فيكون إذا رآك المصريون أنهم يقولون: هذه امرأته. فيقتلونني ويستبقونك. قولي إنك أختي، ليكون لي خير بسببك وتحيا نفسي من أجلك. فحدث لما دخل أبرام إلى مصر أن المصريين رأوا المرأة أنها حسنة جداً. ورآها رؤساء فرعون ومدحوها لدى فرعون، فأُخذت المرأة إلى بيت فرعون. فصنع إلى أبرام خيراً بسببها.","فضرب الرب فرعون وبيته ضربات عظيمة بسبب ساراي امرأة أبرام. فدعا فرعون أبرام وقال: ما هذا الذي صنعت بي؟ لماذا لم تخبرني أنها امرأتك؟ لماذا قلت هي أختي، حتى أخذتها لي لتكون زوجتي؟ والآن هوذا امرأتك، خذها واذهب! فأوصى عليه فرعون رجالاً فشيعوه وامرأته وكل ما كان له."],"background":[{"t":"الترك المضاعف","d":"الدعوة تطلب ترك ثلاث دوائر متزايدة القرب: «أرضك» (الوطن)، و«عشيرتك» (القبيلة)، و«بيت أبيك» (العائلة). في العالم القديم، هذه كانت الهوية والأمان والميراث. وفي المقابل، الوجهة غير محددة: «الأرض التي أريك». إيمان حقيقي: «خرج وهو لا يعلم إلى أين يأتي» (عب 11: 8)."},{"t":"خمس بركات مقابل خمس لعنات","d":"كلمة «بارك» تتكرر خمس مرات في 12: 2–3، كأنها رد على كلمة «لعن» التي ظهرت خمس مرات في 1–11 (3: 14، 17؛ 4: 11؛ 5: 29؛ 9: 25). الله يبدأ مشروع إلغاء اللعنة من خلال أبرام."},{"t":"المذابح","d":"أبرام لم يبنِ مدناً بل مذابح. أينما ذهب، أعلن ملكية الرب للأرض بالعبادة. والكنعانيون ما زالوا هناك: أبرام يملك الأرض بالوعد فقط، لا بالواقع."}],"words":[{"w":"اذهب","orig":"לֶךְ־לְךָ (لِخ لِخا)","d":"حرفياً «اذهب لنفسك». نفس التعبير سيتكرر في 22: 2 («اذهب إلى أرض المريا»): أول وآخر اختبار لإيمان إبراهيم."},{"w":"بارك / بركة","orig":"בָּרַךְ (بارك)","d":"منح الحياة والازدهار والخير من الله. ونقيضها «لعن» (أرار)."},{"w":"قبائل","orig":"מִשְׁפְּחֹת (مشبحوت)","d":"عشائر، عائلات. نفس الكلمة في جدول الأمم (10: 5، 32). البركة لكل «عشيرة» تفرقت في بابل."},{"w":"نسل","orig":"זֶרַע (زرع)","d":"بذرة، ذرية. مفرد بصيغته، ويُستخدم للجمع والمفرد. بولس يرى فيه إشارة للمسيح (غل 3: 16)."},{"w":"دعا باسم الرب","orig":"קָרָא בְּשֵׁם יְהוָה (قارا بشيم يهوه)","d":"عبادة علنية وصلاة. نفس التعبير في 4: 26. أبرام يمجد «اسم» الرب بدل أن «يصنع لنفسه اسماً» كبناة بابل."}],"otQuotes":[],"links":[{"ref":"Gal.3.8","d":"والكتاب إذ سبق فرأى أن الله بالإيمان يبرر الأمم، سبق فبشر إبراهيم أن فيك تتبارك جميع الأمم.","label":"غلاطية ٣: ٨"},{"ref":"Gal.3.16","d":"وأما المواعيد فقيلت في إبراهيم وفي نسله. لا يقول: وفي الأنسال كأنه عن كثيرين، بل كأنه عن واحد: وفي نسلك الذي هو المسيح.","label":"غلاطية ٣: ١٦"},{"ref":"Heb.11.8","d":"بالإيمان إبراهيم لما دعي أطاع أن يخرج إلى المكان الذي كان عتيداً أن يأخذه ميراثاً، فخرج وهو لا يعلم إلى أين يأتي.","label":"العبرانيين ١١: ٨"},{"ref":"Acts.3.25-26","d":"أنتم أبناء الأنبياء والعهد... قائلاً لإبراهيم: وبنسلك تتبارك جميع قبائل الأرض. إليكم أولاً، إذ أقام الله فتاه يسوع، أرسله يبارككم.","label":"أعمال الرسل ٣: ٢٥–٢٦"},{"ref":"Rom.4.13","d":"فإنه ليس بالناموس كان الوعد لإبراهيم أو لنسله أن يكون وارثاً للعالم، بل ببر الإيمان.","label":"رومية ٤: ١٣"},{"ref":"Josh.24.2-3","d":"تارح أبو إبراهيم... وعبدوا آلهة أخرى. فأخذت إبراهيم أباكم من عبر النهر.","label":"يشوع ٢٤: ٢–٣"},{"ref":"Gen.20.2","d":"وقال إبراهيم عن سارة امرأته: هي أختي. فأرسل أبيمالك ملك جرار وأخذ سارة.","label":"التكوين ٢٠: ٢"}],"christ":["الوعد «تتبارك فيك جميع قبائل الأرض» هو، كما يقول بولس، «الإنجيل» المبشر به مسبقاً لإبراهيم (غل 3: 8). البركة لكل الأمم تأتي من خلال «النسل» الواحد، المسيح (غل 3: 16). ففي المسيح تُرفع اللعنة: \"المسيح افتدانا من لعنة الناموس، إذ صار لعنة لأجلنا... لتصير بركة إبراهيم للأمم في المسيح يسوع\" (غل 3: 13–14). كل مؤمن من كل أمة هو ابن لإبراهيم بالإيمان (غل 3: 7، 29).","وأبرام يترك وطنه وبيت أبيه طاعة لله، لكن المسيح ترك أكثر بكثير: مجد السماء وحضن الآب (في 2: 6–7). وحيث فشل أبرام في مصر (خاف وكذب ليحمي نفسه وعرض زوجته للخطر)، المسيح العريس الحقيقي بذل نفسه ليحمي عروسه، الكنيسة (أف 5: 25)."],"hard":[{"q":"هل كذب أبرام حين قال إن ساراي أخته؟","tag":"agreed","a":["نصف حقيقة: ساراي كانت أخته غير الشقيقة فعلاً (ابنة أبيه لا ابنة أمه، 20: 12). لكن قصده كان الخداع: إخفاء أنها زوجته. ونصف الحقيقة المقصود به الخداع كذب. والنص لا يبرره: فرعون الوثني يوبخه («ما هذا الذي صنعت بي؟»)، وأبرام صامت بلا جواب. الكتاب صادق في عرض خطايا أبطاله. والأهم: الله يبقى أميناً لوعده رغم عدم أمانة أبرام."]},{"q":"لماذا عاقب الله فرعون وهو لم يعرف أنها متزوجة؟","tag":"debated","a":["الضربات لم تكن بالضرورة عقاباً أخلاقياً لفرعون بقدر ما كانت تدخلاً إلهياً لحماية ساراي، أم النسل الموعود. الله يحمي خطته الفدائية مهما كلف الأمر. ومع ذلك، أخذ فرعون للنساء لقصره بالقوة لم يكن بريئاً. والضربات جعلت فرعون يكتشف الحقيقة. وهي تمهيد لضربات مصر في الخروج: الله يحمي شعبه من فرعون ويُخرجهم بغنى."]},{"q":"هل وعد «أبارك مباركيك ولاعنك ألعنه» ينطبق على دولة إسرائيل الحديثة؟","tag":"debated","a":["هذا موضوع اختلاف بين التقليدين. التدبيريون عادة يرون أن الوعد يمتد لإسرائيل العرقية والدولة الحديثة، فيدعو بعضهم لدعم سياسي لها. والتقليد المصلح (العهدي) يرى أن الوعد يتحقق في المسيح «نسل إبراهيم» الحقيقي (غل 3: 16)، وفي كل من هو «في المسيح» من اليهود والأمم (غل 3: 29). والموقف من المسيح هو الذي يحدد البركة واللعنة. وكلا الطرفين يتفق على محبة الشعب اليهودي والصلاة لخلاصه (رو 10: 1)، ورفض معاداة السامية. وسيأتي النقاش الكامل حول وعد الأرض في الأصحاح 15."]}],"voices":[{"n":"جون كالفن","y":"1509–1564","w":"تفسير سفر التكوين (1554)","b":"يؤكد أن دعوة أبرام نعمة مجانية: الله اختار رجلاً من عائلة وثنية، لا لفضل فيه. ويقول عن سقوطه في مصر إن الله يُظهر ضعف قديسيه لكي لا نعتمد على البشر، بل نتعلم أن الخلاص كله من نعمة الله."},{"n":"جيمس مونتجمري بويس","y":"1938–2000","w":"التكوين: تفسير عرضي (1982–1987)","b":"يلاحظ أن أبرام في الإيمان بنى مذابح، وفي الخوف لم يبنِ مذبحاً في مصر. حين يغيب المذبح، تبدأ الحلول البشرية والكذب. ويرى أن القصة تُظهر أن الوعد يعتمد على أمانة الله لا على أمانة أبرام."},{"n":"بروس والتكي","y":"1930–","w":"التكوين: تفسير (2001)","b":"يرى في 12: 1–3 المحور الذي يدور عليه التكوين كله، بل الكتاب كله: الله يعلن خطته لاستعادة البركة لكل الأمم من خلال نسل إبراهيم. والقصص التالية تختبر: هل سيثق إبراهيم في الوعد؟ وهل سيحفظ الله وعده رغم العوائق؟"}],"questions":["ما \"أرضك وعشيرتك وبيت أبيك\" التي قد يطلب الله منك تركها؟","هل تقدر أن تطيع الله حتى لو لم تعرف «إلى أين»؟","كيف تشعر حين تعرف أن البركة التي وعد بها إبراهيم صارت لك في المسيح (غل 3: 29)؟","ماذا يعلمك أن أبرام لم يبنِ مذبحاً في مصر؟ هل تهمل الصلاة حين تكون خائفاً؟","هل تستخدم «أنصاف الحقائق» لتحمي نفسك؟","هل أنت «بركة» للآخرين من حولك كما دُعي أبرام؟"],"apply":"اكتب على ورقة: \"في المسيح، أنا ابن لإبراهيم ووارث للوعد\" (غل 3: 29). ثم فكر في موقف هذا الأسبوع تميل فيه لحماية نفسك بنصف حقيقة أو بالخوف. قرر أن تقول الحق كاملاً وتثق في حماية الله. وابحث عن طريقة عملية لتكون «بركة» لشخص واحد من غير عائلتك.","keyVerseText":"وَأُبَارِكُ مُبَارِكِيكَ، وَلَاعِنَكَ أَلْعَنُهُ. وَتَتَبَارَكُ فِيكَ جَمِيعُ قَبَائِلِ ٱلْأَرْضِ».","keyVerseLabel":"التكوين ١٢: ٣"},"text":[{"number":1,"text":"وَقَالَ ٱلرَّبُّ لِأَبْرَامَ: «ٱذْهَبْ مِنْ أَرْضِكَ وَمِنْ عَشِيرَتِكَ وَمِنْ بَيْتِ أَبِيكَ إِلَى ٱلْأَرْضِ ٱلَّتِي أُرِيكَ."},{"number":2,"text":"فَأَجْعَلَكَ أُمَّةً عَظِيمَةً وَأُبَارِكَكَ وَأُعَظِّمَ ٱسْمَكَ، وَتَكُونَ بَرَكَةً."},{"number":3,"text":"وَأُبَارِكُ مُبَارِكِيكَ، وَلَاعِنَكَ أَلْعَنُهُ. وَتَتَبَارَكُ فِيكَ جَمِيعُ قَبَائِلِ ٱلْأَرْضِ»."},{"number":4,"text":"فَذَهَبَ أَبْرَامُ كَمَا قَالَ لَهُ ٱلرَّبُّ وَذَهَبَ مَعَهُ لُوطٌ. وَكَانَ أَبْرَامُ ٱبْنَ خَمْسٍ وَسَبْعِينَ سَنَةً لَمَّا خَرَجَ مِنْ حَارَانَ."},{"number":5,"text":"فَأَخَذَ أَبْرَامُ سَارَايَ ٱمْرَأَتَهُ، وَلُوطًا ٱبْنَ أَخِيهِ، وَكُلَّ مُقْتَنَيَاتِهِمَا ٱلَّتِي ٱقْتَنَيَا وَٱلنُّفُوسَ ٱلَّتِي ٱمْتَلَكَا فِي حَارَانَ. وَخَرَجُوا لِيَذْهَبُوا إِلَى أَرْضِ كَنْعَانَ. فَأَتَوْا إِلَى أَرْضِ كَنْعَانَ."},{"number":6,"text":"وَٱجْتَازَ أَبْرَامُ فِي ٱلْأَرْضِ إِلَى مَكَانِ شَكِيمَ إِلَى بَلُّوطَةِ مُورَةَ. وَكَانَ ٱلْكَنْعَانِيُّونَ حِينَئِذٍ فِي ٱلْأَرْضِ."},{"number":7,"text":"وَظَهَرَ ٱلرَّبُّ لِأَبْرَامَ وَقَالَ: «لِنَسْلِكَ أُعْطِي هَذِهِ ٱلْأَرْضَ». فَبَنَى هُنَاكَ مَذْبَحًا لِلرَّبِّ ٱلَّذِي ظَهَرَ لَهُ."},{"number":8,"text":"ثُمَّ نَقَلَ مِنْ هُنَاكَ إِلَى ٱلْجَبَلِ شَرْقِيَّ بَيْتِ إِيلٍ وَنَصَبَ خَيْمَتَهُ. وَلَهُ بَيْتُ إِيلَ مِنَ ٱلْمَغْرِبِ وَعَايُ مِنَ ٱلْمَشْرِقِ. فَبَنَى هُنَاكَ مَذْبَحًا لِلرَّبِّ وَدَعَا بِٱسْمِ ٱلرَّبِّ."},{"number":9,"text":"ثُمَّ ٱرْتَحَلَ أَبْرَامُ ٱرْتِحَالًا مُتَوَالِيًا نَحْوَ ٱلْجَنُوبِ."},{"number":10,"text":"وَحَدَثَ جُوعٌ فِي ٱلْأَرْضِ، فَٱنْحَدَرَ أَبْرَامُ إِلَى مِصْرَ لِيَتَغَرَّبَ هُنَاكَ، لِأَنَّ ٱلْجُوعَ فِي ٱلْأَرْضِ كَانَ شَدِيدًا."},{"number":11,"text":"وَحَدَثَ لَمَّا قَرُبَ أَنْ يَدْخُلَ مِصْرَ أَنَّهُ قَالَ لِسَارَايَ ٱمْرَأَتِهِ: «إِنِّي قَدْ عَلِمْتُ أَنَّكِ ٱمْرَأَةٌ حَسَنَةُ ٱلْمَنْظَرِ."},{"number":12,"text":"فَيَكُونُ إِذَا رَآكِ ٱلْمِصْرِيُّونَ أَنَّهُمْ يَقُولُونَ: هَذِهِ ٱمْرَأَتُهُ. فَيَقْتُلُونَنِي وَيَسْتَبْقُونَكِ."},{"number":13,"text":"قُولِي إِنَّكِ أُخْتِي، لِيَكُونَ لِي خَيْرٌ بِسَبَبِكِ وَتَحْيَا نَفْسِي مِنْ أَجْلِكِ»."},{"number":14,"text":"فَحَدَثَ لَمَّا دَخَلَ أَبْرَامُ إِلَى مِصْرَ أَنَّ ٱلْمِصْرِيِّينَ رَأَوْا ٱلْمَرْأَةَ أَنَّهَا حَسَنَةٌ جِدًّا."},{"number":15,"text":"وَرَآهَا رُؤَسَاءُ فِرْعَوْنَ وَمَدَحُوهَا لَدَى فِرْعَوْنَ، فَأُخِذَتِ ٱلْمَرْأَةُ إِلَى بَيْتِ فِرْعَوْنَ،"},{"number":16,"text":"فَصَنَعَ إِلَى أَبْرَامَ خَيْرًا بِسَبَبِهَا، وَصَارَ لَهُ غَنَمٌ وَبَقَرٌ وَحَمِيرٌ وَعَبِيدٌ وَإِمَاءٌ وَأُتُنٌ وَجِمَالٌ."},{"number":17,"text":"فَضَرَبَ ٱلرَّبُّ فِرْعَوْنَ وَبَيْتَهُ ضَرَبَاتٍ عَظِيمَةً بِسَبَبِ سَارَايَ ٱمْرَأَةِ أَبْرَامَ."},{"number":18,"text":"فَدَعَا فِرْعَوْنُ أَبْرَامَ وَقَالَ: «مَا هَذَا ٱلَّذِي صَنَعْتَ بِي؟ لِمَاذَا لَمْ تُخْبِرْنِي أَنَّهَا ٱمْرَأَتُكَ؟"},{"number":19,"text":"لِمَاذَا قُلْتَ: هِيَ أُخْتِي، حَتَّى أَخَذْتُهَا لِي لِتَكُونَ زَوْجَتِي؟ وَٱلْآنَ هُوَذَا ٱمْرَأَتُكَ! خُذْهَا وَٱذْهَبْ!»."},{"number":20,"text":"فَأَوْصَى عَلَيْهِ فِرْعَوْنُ رِجَالًا فَشَيَّعُوهُ وَٱمْرَأَتَهُ وَكُلَّ مَا كَانَ لَهُ."}],"titles":["في البدء خلق الله","الراحة، والجنة، والرجل والمرأة","السقوط والوعد الأول","قايين وهابيل","من آدم إلى نوح: «ومات»، إلا أخنوخ","فساد الأرض ونوح الذي وجد نعمة","الطوفان","الله يذكر نوحاً","العهد مع نوح وقوس قزح","جدول الأمم","برج بابل ومن سام إلى أبرام","دعوة أبرام والوعد","أبرام ولوط يفترقان","حرب الملوك وملكي صادق","العهد بين الأشلاء: فآمن بالرب فحسبه له براً","هاجر وإسماعيل: الإله الذي يراني","عهد الختان: إبراهيم وسارة","الزوار الثلاثة والشفاعة لسدوم","هلاك سدوم ونجاة لوط","إبراهيم وأبيمالك: تكرار الخطأ","ولادة إسحاق وطرد هاجر","تقديم إسحاق: الرب يرى","موت سارة ومغارة المكفيلة","زوجة لإسحاق: رفقة","موت إبراهيم وولادة التوأمين وبيع البكورية","إسحاق والآبار: الرب أرحب لنا","يعقوب يأخذ البركة بالخداع","سلم يعقوب في بيت إيل","يعقوب عند لابان: راحيل وليئة","حرب الأختين وثروة يعقوب","يعقوب يهرب من لابان: عهد جلعاد","يعقوب يصارع الله في فنيئيل","المصالحة: رأيت وجهك كما يُرى وجه الله","دينة وشكيم: الانتقام في شكيم","الرجوع إلى بيت إيل: موت راحيل وإسحاق","مواليد عيسو: أدوم","يوسف وأحلامه: بيعه من إخوته","يهوذا وثامار: هي أبر مني","يوسف في بيت فوطيفار والسجن: وكان الرب مع يوسف","حلما الساقي والخباز: أليست التعابير لله؟","حلما فرعون: من السجن إلى العرش","الإخوة في مصر: حقاً إننا مذنبون","الرحلة الثانية: بنيامين والوليمة","الطاس في عدل بنيامين: شفاعة يهوذا","أنا يوسف: الله أرسلني قدامكم","يعقوب ينزل إلى مصر: لا تخف","يعقوب أمام فرعون وسياسة يوسف في المجاعة","يعقوب يبارك منسى وأفرايم","بركات يعقوب لأبنائه: حتى يأتي شيلون","أنتم قصدتم لي شراً، أما الله فقصد به خيراً"]};

function scripture() {

  for (const v of D.text) {

  const io = new IntersectionObserver((es) => es.forEach((en) => { if (en.isIntersecting) { const id = en.target.id.slice(2); const k = blocks.findIndex((b) => b[0] === id); $('#csecl').textContent = k > 0 ? ar(String(k).padStart(2, '0')) + ' · ' + blocks[k][1] : ''; $('#csec').classList.toggle('on', k > 0); } }), { root: Cc, threshold: .35 });
  blocks.forEach(([id]) => io.observe($('#c-' + id)));
  Cc.addEventListener('scroll', () => { $('#cprog').style.width = (Cc.scrollTop / (Cc.scrollHeight - Cc.clientHeight) * 100) + '%'; }); Cc.addEventListener('scroll', () => $('#cjump').classList.toggle('on', Cc.scrollTop > 300 && $('#C').classList.contains('on')));
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-toast]'); if (t) { e.preventDefault(); toast(t.dataset.toast); }
  const o = e.target.closest('[data-open-ov]'); if (o) $('#' + o.dataset.openOv).classList.add('on');
  const s = e.target.closest('#switch button'); if (s) {
    $$('#switch button').forEach((b) => b.setAttribute('aria-pressed', b === s));
    $$('.concept').forEach((c) => c.classList.toggle('on', c.id === s.dataset.c));
    $('#cjump').classList.toggle('on', s.dataset.c === 'C' && $('#C').scrollTop > 300);
    try { localStorage.setItem('proto3-c', s.dataset.c); } catch {}
  }
});
buildA(); buildB(); buildC();
try { const c = localStorage.getItem('proto3-c'); if (c) $(`#switch [data-c=${c}]`).click(); } catch {}
</script>
