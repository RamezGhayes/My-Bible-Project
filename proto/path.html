<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الطريق: نموذج القصص · لمجد الله</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#1E2A4A;--navy2:#26355C;--terra:#D2603A;--mustard:#E2B53E;--sage:#7FA58A;--cream:#F6EFE3;--paper:#FBF7F0;--ink:#1d1b18;--soft:#6b655c;--line:#ece4d6;--gold:#C9A24B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0f1424}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:var(--ink);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.d{font-family:'Readex Pro',system-ui,sans-serif}
svg{display:block}
#shell{position:fixed;inset:0;max-width:520px;margin:0 auto;background:var(--cream);overflow:hidden}
.view{position:absolute;inset:0 0 72px 0;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
.view.on{display:block}

/* bottom nav */
#nav{position:absolute;bottom:0;inset-inline:0;height:72px;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 8px 10px;z-index:10}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:'Readex Pro';font-size:12.5px;color:#9a9388;border-radius:14px}
#nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button[aria-current=true]{color:var(--terra)}
#nav button[aria-current=true] svg{stroke-width:2.2}

/* ---------- PATH ---------- */
.phead{background:var(--navy);color:#fff;padding:22px 20px 26px;border-radius:0 0 28px 28px}
.phead .row{display:flex;align-items:center;gap:14px}
.ring{width:66px;height:66px;flex:none;position:relative}
.ring svg{width:66px;height:66px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:'Readex Pro';font-weight:600;font-size:15px;line-height:1.1;text-align:center}
.ring b small{display:block;font-size:10px;font-weight:400;opacity:.7}
.phead h1{font-family:'Readex Pro';font-weight:700;font-size:26px;margin:0;line-height:1.2}
.phead p{margin:2px 0 0;opacity:.75;font-size:14px}
.stats{display:flex;gap:8px;margin-top:16px}
.stat{flex:1;background:rgba(255,255,255,.09);border-radius:14px;padding:9px 10px;text-align:center;font-family:'Readex Pro'}
.stat b{display:block;font-size:18px;font-weight:600}
.stat small{font-size:11.5px;opacity:.75}
.today{margin:-14px 16px 0;position:relative;z-index:2;background:#fff;border-radius:22px;padding:16px;display:flex;gap:14px;align-items:center;box-shadow:0 10px 30px rgba(30,42,74,.14)}
.today .ill{width:74px;height:74px;border-radius:18px;background:var(--navy);flex:none;overflow:hidden}
.today small{font-family:'Readex Pro';font-size:12.5px;color:var(--terra)}
.today b{display:block;font-family:'Readex Pro';font-weight:600;font-size:18px;line-height:1.35}
.today span{font-size:13.5px;color:var(--soft)}
.go{margin-inline-start:auto;width:48px;height:48px;border-radius:50%;background:var(--terra);color:#fff;display:grid;place-items:center;flex:none;font-size:20px}
.trail{position:relative;margin:26px 0 30px}
.trail>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sect{position:relative;z-index:1;margin:8px auto 6px;width:max-content;max-width:90%;font-family:'Readex Pro';font-weight:600;font-size:14px;background:var(--cream);color:var(--navy);padding:6px 16px;border-radius:20px;border:1.5px solid var(--navy)}
.node{position:relative;z-index:1;height:92px}
.node button{position:absolute;top:10px;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-family:'Readex Pro';font-weight:600;font-size:21px;transform:translateX(50%)}
.node.done button{background:var(--gold);color:#fff;box-shadow:0 5px 0 #a8853a}
.node.cur button{background:var(--terra);color:#fff;box-shadow:0 5px 0 #a8452a;animation:pulse 2s infinite}
.node.todo button{background:#fff;color:#b9b0a2;border:3px solid #e3d9c8;box-shadow:0 5px 0 #e3d9c8}
.node .lab{position:absolute;top:24px;font-family:'Readex Pro';font-size:13px;color:var(--soft);max-width:38%;line-height:1.4}
.node .bub{position:absolute;top:-22px;transform:translateX(50%);background:var(--navy);color:#fff;font-family:'Readex Pro';font-size:13px;padding:5px 12px;border-radius:12px;white-space:nowrap}
.node .bub:after{content:"";position:absolute;bottom:-5px;left:50%;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:var(--navy)}
.node .mini{position:absolute;top:14px;width:46px;height:60px;border-radius:9px;transform:translateX(50%) rotate(-6deg);box-shadow:0 4px 10px rgba(0,0,0,.15)}
@keyframes pulse{0%,100%{box-shadow:0 5px 0 #a8452a,0 0 0 0 rgba(210,96,58,.45)}50%{box-shadow:0 5px 0 #a8452a,0 0 0 14px rgba(210,96,58,0)}}
.check{width:26px;height:26px}

/* ---------- STORIES ---------- */
#story{position:absolute;inset:0;z-index:30;display:none;background:var(--navy)}
#story.on{display:block}
.bars{position:absolute;top:12px;inset-inline:12px;display:flex;gap:4px;z-index:6}
.bars i{flex:1;height:3px;border-radius:2px;background:rgba(127,127,127,.35);overflow:hidden}
.bars i.done{background:currentColor}
.stop{position:absolute;top:22px;inset-inline:10px;display:flex;align-items:center;justify-content:space-between;z-index:6;font-family:'Readex Pro';font-size:13.5px;padding-top:4px}
.stop button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(127,127,127,.18);font-size:16px}
.card{position:absolute;inset:0;padding:82px 24px 120px;display:flex;flex-direction:column;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;transform:scale(.985)}
.card.on{opacity:1;pointer-events:auto;transform:none}
.ey{font-family:'Readex Pro';font-size:13.5px;opacity:.75;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.ey i{font-style:normal;font-size:16px}
.card h1{font-family:'Readex Pro';font-weight:700;font-size:42px;line-height:1.15;margin:0}
.card h2{font-family:'Readex Pro';font-weight:600;font-size:27px;line-height:1.3;margin:0 0 16px}
.card p{font-size:18.5px;line-height:1.8;margin:0}
.card ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:13px}
.card li{display:flex;gap:13px;font-size:17.5px;line-height:1.65}
.card li em{font-style:normal;font-family:'Readex Pro';font-weight:700;font-size:14px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.bigq{font-family:'Noto Naskh Arabic';font-size:29px;line-height:1.9;display:block;quotes:none}
.pbtn{margin-top:22px;align-self:flex-start;height:50px;padding:0 22px;border-radius:25px;font-family:'Readex Pro';font-weight:500;font-size:15.5px;display:inline-flex;align-items:center;gap:10px}
.more{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);z-index:7;height:46px;padding:0 20px;border-radius:23px;font-family:'Readex Pro';font-weight:500;font-size:14.5px;display:flex;align-items:center;gap:8px;white-space:nowrap;background:rgba(255,255,255,.16);backdrop-filter:blur(6px)}
.more.dark{background:rgba(30,42,74,.09)}
.more span{display:inline-block;animation:bob 1.6s infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.tz{position:absolute;top:76px;bottom:90px;width:28%;z-index:4}
.tz.r{right:0}.tz.l{left:0}
.smap{border-radius:20px;overflow:hidden;margin:4px -4px 12px;box-shadow:0 10px 30px rgba(0,0,0,.25);height:230px}
.smap svg{width:100%;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13.5px;opacity:.9}
.legend b{font-family:'Readex Pro'}
.hword{font-family:'Noto Naskh Arabic';font-size:60px;line-height:1.2;margin:2px 0 4px}
.people{display:flex;gap:12px;overflow-x:auto;margin:6px -24px 0;padding:6px 24px 14px;scroll-snap-type:x mandatory}
.thread{position:relative;margin-top:6px}
.tbox{border-radius:18px;padding:14px 16px;font-size:16px;line-height:1.75}
.tbox small{display:block;font-family:'Readex Pro';font-size:12.5px;margin-bottom:4px;opacity:.85}
.tbox .s{font-family:'Noto Naskh Arabic';font-size:18px}
.tline{height:46px;position:relative;display:flex;align-items:center;justify-content:center}
.tline:before{content:"";position:absolute;top:0;bottom:0;left:50%;width:3px;margin-left:-1.5px;background:linear-gradient(var(--gold),#f1d58f,var(--gold));border-radius:2px}
.tline span{position:relative;background:var(--gold);color:var(--navy);font-family:'Readex Pro';font-weight:600;font-size:12.5px;padding:4px 12px;border-radius:12px}
.hl{background:var(--gold);color:var(--navy);border-radius:4px;padding:0 3px}

/* reward */
.reward{align-items:center;text-align:center}
.reward .badge{width:84px;height:84px;border-radius:50%;background:var(--gold);display:grid;place-items:center;margin:0 auto 12px;box-shadow:0 0 0 10px rgba(201,162,75,.18)}
.reward .badge svg{width:42px;height:42px;stroke:var(--navy);fill:none;stroke-width:3}
.unlock{display:flex;gap:10px;justify-content:center;margin:18px 0 6px;perspective:800px}
.unlock .pc{animation:flipin .7s both}
.unlock .pc:nth-child(2){animation-delay:.25s}.unlock .pc:nth-child(3){animation-delay:.5s}
@keyframes flipin{from{transform:rotateY(90deg) translateY(10px);opacity:0}to{transform:none;opacity:1}}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--gold);animation:fall 2.4s linear infinite;opacity:.8}
@keyframes fall{from{transform:translateY(-20px)}to{transform:translateY(110vh)}}

/* person card (collectible) */
.pc{width:118px;flex:none;border-radius:16px;padding:3px;background:linear-gradient(150deg,#f1d58f,var(--gold) 40%,#8f6d2a);scroll-snap-align:start;text-align:center;color:var(--ink)}
.pc .in{background:var(--paper);border-radius:13px;padding:10px 8px 10px;height:100%}
.pc .med{width:62px;height:62px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;border:2.5px solid var(--gold)}
.pc .med svg{width:36px;height:36px}
.pc b{display:block;font-family:'Readex Pro';font-weight:600;font-size:15px;line-height:1.3}
.pc small{display:block;font-size:11.5px;color:var(--soft);line-height:1.4;margin-top:2px}
.pc.locked{background:#d8cfc0}
.pc.locked .in{background:#ece5d9}
.pc.locked .med{border-color:#cfc5b4;background:#e2d9ca}
.pc.locked b,.pc.locked small{color:#b0a593}

/* ---------- SHEET (اعرف أكثر) ---------- */
.scrim{position:absolute;inset:0;background:rgba(10,14,30,.45);z-index:40;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;inset-inline:0;bottom:0;z-index:41;background:var(--paper);border-radius:26px 26px 0 0;max-height:86%;overflow:auto;transform:translateY(105%);transition:transform .28s ease;padding:10px 20px 34px}
.sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:#ddd3c3;margin:0 auto 12px}
.sheet h3{font-family:'Readex Pro';font-weight:600;font-size:21px;margin:0 0 4px}
.sheet .sub{color:#9a9388;font-size:14px;margin:0 0 12px;font-family:'Readex Pro'}
.sheet p{margin:0 0 10px;font-size:17px;line-height:1.85}
.en{padding:12px 0;border-top:1px dashed var(--line)}
.en:first-child{border-top:0}
.en b{display:block;font-family:'Readex Pro';font-weight:600;font-size:16px}
.en p{margin:3px 0 0 !important;color:var(--soft);font-size:16px !important}
.orig{font-family:'Noto Naskh Arabic';color:var(--gold);font-weight:400}
.tg{display:inline-block;font-family:'Readex Pro';font-size:12px;border-radius:12px;padding:1px 10px;margin-bottom:4px}
.tg.agreed{background:#E3F0E8;color:#3E7A5A}.tg.debated{background:#F7EDD6;color:#9A6A12}
.hub{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.hub button{border-radius:18px;padding:14px;text-align:start;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
.hub button i{font-style:normal;font-size:22px}
.hub button b{font-family:'Readex Pro';font-weight:600;font-size:15.5px;line-height:1.3}
.hub button small{font-size:12px;opacity:.7;font-family:'Readex Pro'}
.backlink{font-family:'Readex Pro';font-size:14px;color:var(--terra);margin-bottom:8px;display:inline-block}

/* reader */
.reader{position:absolute;inset:0;z-index:35;background:var(--paper);overflow:auto;transform:translateY(100%);transition:transform .3s}
.reader.on{transform:none}
.rh{position:sticky;top:0;display:flex;align-items:center;height:58px;padding:0 14px;background:rgba(251,247,240,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);font-family:'Readex Pro';font-weight:600;font-size:17px;z-index:2}
.rh span{flex:1}
.rh button{width:40px;height:40px;border-radius:12px;background:#efe7da;display:grid;place-items:center}
.rbody{padding:4px 22px 60px}
.peri{font-family:'Readex Pro';font-weight:600;font-size:16px;color:var(--terra);margin:26px 0 4px}
.scr{font-family:'Noto Naskh Arabic';font-size:21px;line-height:2.15}
.scr p{margin:0}
.vn{font-family:'Readex Pro';font-size:.55em;color:#B08A4E;font-weight:600;vertical-align:super;margin:0 2px}
.key{background:linear-gradient(transparent 58%,#F6D9CC 58%)}

/* ---------- CARD DETAIL ---------- */
#pdet{position:absolute;inset:0;z-index:50;background:var(--navy);overflow:auto;display:none;color:#fff}
#pdet.on{display:block}
.pd-top{display:flex;justify-content:space-between;padding:14px}
.pd-top button{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center}
.bigcard{margin:0 26px;border-radius:26px;padding:4px;background:linear-gradient(150deg,#f6dd9a,var(--gold) 45%,#8f6d2a);box-shadow:0 20px 50px rgba(0,0,0,.35);color:var(--ink)}
.bigcard .in{background:var(--paper);border-radius:22px;padding:22px 18px 18px;text-align:center;position:relative;overflow:hidden}
.bigcard .in:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0,rgba(201,162,75,.18),transparent 60%)}
.bigcard .med{position:relative;width:118px;height:118px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;border:4px solid var(--gold);box-shadow:inset 0 0 0 6px var(--paper),inset 0 0 0 7px rgba(201,162,75,.4)}
.bigcard .med svg{width:66px;height:66px}
.bigcard h2{position:relative;font-family:'Readex Pro';font-weight:700;font-size:28px;margin:0}
.bigcard .mean{position:relative;font-size:14px;color:var(--soft);margin-top:2px}
.bigcard .role{position:relative;display:inline-block;margin-top:10px;font-family:'Readex Pro';font-size:13px;font-weight:500;background:var(--navy);color:#fff;padding:4px 14px;border-radius:14px}
.facts{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px}
.facts div{background:var(--cream);border-radius:14px;padding:8px 4px;line-height:1.35}
.facts b{display:block;font-family:'Readex Pro';font-weight:600;font-size:14.5px}
.facts small{font-size:11px;color:var(--soft)}
.traits{position:relative;display:flex;gap:8px;margin-top:10px}
.traits div{flex:1;border-radius:14px;padding:10px;text-align:start;font-size:13.5px;line-height:1.5}
.traits b{display:block;font-family:'Readex Pro';font-size:12px;margin-bottom:2px}
.pd-sec{padding:26px 24px 0}
.pd-sec h3{font-family:'Readex Pro';font-weight:600;font-size:18px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.tl{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 -24px;padding-inline:24px}
.tl button{flex:none;width:112px;border-radius:16px;padding:10px;background:rgba(255,255,255,.08);text-align:start}
.tl button.here{background:var(--terra)}
.tl button b{display:block;font-family:'Readex Pro';font-size:12px;opacity:.8}
.tl button span{display:block;font-size:14.5px;line-height:1.4;margin-top:2px}
.nt{background:rgba(255,255,255,.07);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.nt small{font-family:'Readex Pro';color:var(--mustard);font-size:13px}
.nt p{margin:4px 0 0;font-family:'Noto Naskh Arabic';font-size:17.5px;line-height:1.85}
.cx{margin:0 24px;border-radius:20px;padding:18px;background:var(--gold);color:var(--navy);font-size:17px;line-height:1.8}
.cx b{font-family:'Readex Pro';display:block;font-size:14px;margin-bottom:4px}

/* ---------- COLLECTION / MAPS ---------- */
.vh{padding:22px 20px 6px}
.vh h1{font-family:'Readex Pro';font-weight:700;font-size:26px;margin:0}
.vh p{margin:4px 0 0;color:var(--soft);font-size:15px}
.bar2{height:8px;border-radius:4px;background:#e6dccb;margin:14px 20px 4px;overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--gold);border-radius:4px}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px 20px 30px}
.cgrid .pc{width:auto}
.mlist{padding:12px 20px 30px;display:flex;flex-direction:column;gap:14px}
.mcard{border-radius:22px;overflow:hidden;background:#fff;border:1px solid var(--line);text-align:start;width:100%}
.mcard .mv{height:150px;background:var(--navy);position:relative}
.mcard .mv svg{width:100%;height:100%}
.mcard .mt{padding:12px 16px}
.mcard .mt b{font-family:'Readex Pro';font-weight:600;font-size:17px;display:block}
.mcard .mt small{color:var(--soft);font-size:13.5px}
.mcard.lock{opacity:.6}
.mcard.lock .mv{display:grid;place-items:center;color:#fff;font-family:'Readex Pro';background:#9aa3b8}
#mapfull{position:absolute;inset:0;z-index:45;background:#EFE6D3;display:none}
#mapfull.on{display:block}
#mapfull .mf{position:absolute;inset:0 0 170px 0}
#mapfull .mf svg{width:100%;height:100%}
#mapfull .mtop{position:absolute;top:12px;inset-inline:12px;display:flex;gap:8px;align-items:center;background:#fff;border-radius:18px;padding:6px;box-shadow:0 6px 18px rgba(0,0,0,.12);z-index:2}
#mapfull .mtop b{flex:1;text-align:center;font-family:'Readex Pro';font-weight:600}
#mapfull .mtop button{width:40px;height:40px;border-radius:12px;background:#F3ECE0}
#mapfull .minfo{position:absolute;bottom:0;inset-inline:0;height:170px;background:var(--paper);border-radius:22px 22px 0 0;padding:16px 20px;box-shadow:0 -6px 20px rgba(0,0,0,.1);overflow:auto}
#mapfull .minfo b{font-family:'Readex Pro';font-weight:600;font-size:18px}
#mapfull .minfo p{margin:4px 0 0;color:var(--soft);font-size:15.5px;line-height:1.7}

.toast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%) translateY(16px);z-index:90;background:var(--ink);color:#fff;font-family:'Readex Pro';font-size:14px;padding:10px 18px;border-radius:14px;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div id="shell">
  <section class="view on" id="v-path"></section>
  <section class="view" id="v-maps"></section>
  <section class="view" id="v-cards"></section>
  <nav id="nav">
    <button data-v="path" aria-current="true"><svg viewBox="0 0 24 24"><path d="M6 20c0-4 4-4 6-8s6-4 6-8"/><circle cx="6" cy="20" r="1.6"/><circle cx="18" cy="4" r="1.6"/></svg>الطريق</button>
    <button data-v="maps" aria-current="false"><svg viewBox="0 0 24 24"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>الخرائط</button>
    <button data-v="cards" aria-current="false"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="11" height="15" rx="2"/><path d="M8 21h9a2 2 0 0 0 2-2V7"/></svg>بطاقاتي</button>
  </nav>
  <div id="story"></div>
  <div class="reader" id="reader"></div>
  <div id="pdet"></div>
  <div id="mapfull"></div>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet"></div>
  <div class="toast" id="toast"></div>
</div>
<script>
const D = {"ch":{"title":"دعوة أبرام والوعد","section":"إبراهيم (11: 27 – 25: 18)","where":"نقطة تحول في الكتاب كله. بعد أحد عشر أصحاحاً عن البشرية كلها وفشلها المتكرر، يتكلم الله إلى رجل واحد: «اذهب من أرضك ومن عشيرتك ومن بيت أبيك إلى الأرض التي أريك». ومعها سبعة وعود: «فأجعلك أمة عظيمة، وأباركك، وأعظم اسمك، وتكون بركة. وأبارك مباركيك، ولاعنك ألعنه، وتتبارك فيك جميع قبائل الأرض». فذهب أبرام «كما قال له الرب»، وهو ابن خمس وسبعين سنة، مع ساراي ولوط. وصل إلى شكيم في كنعان، فظهر له الرب وقال: «لنسلك أعطي هذه الأرض»، فبنى مذبحاً. ثم إلى بيت إيل، فبنى مذبحاً آخر و«دعا باسم الرب». لكن جاء جوع، فنزل أبرام إلى مصر. وهناك خاف على حياته لأن ساراي جميلة، فطلب منها أن تقول إنها أخته. فأُخذت إلى بيت فرعون! لكن الرب ضرب فرعون وبيته بضربات عظيمة، ففهم فرعون الحقيقة ووبخ أبرام وأخرجه. رجل الإيمان العظيم يسقط في أول اختبار.","before":"الأصحاح الحادي عشر: برج بابل، ونسب سام حتى أبرام، وساراي العاقر.","after":"الأصحاح الثالث عشر: أبرام ولوط يفترقان.","pericopes":[{"at":1,"t":"الدعوة والوعود"},{"at":4,"t":"الطاعة والرحيل"},{"at":6,"t":"شكيم: لنسلك أعطي هذه الأرض"},{"at":8,"t":"بيت إيل: دعا باسم الرب"},{"at":10,"t":"النزول إلى مصر"},{"at":14,"t":"ساراي في بيت فرعون"},{"at":17,"t":"الرب يحمي ساراي"}],"outline":[{"r":"1","t":"وقال الرب لأبرام: اذهب من أرضك ومن عشيرتك ومن بيت أبيك إلى الأرض التي أريك"},{"r":"2-3","t":"فأجعلك أمة عظيمة وأباركك وأعظم اسمك، وتكون بركة. وأبارك مباركيك، ولاعنك ألعنه. وتتبارك فيك جميع قبائل الأرض"},{"r":"4-5","t":"فذهب أبرام كما قال له الرب، وذهب معه لوط. وكان أبرام ابن خمس وسبعين سنة لما خرج من حاران... وخرجوا ليذهبوا إلى أرض كنعان. فأتوا إلى أرض كنعان"},{"r":"6-7","t":"واجتاز أبرام في الأرض إلى مكان شكيم إلى بلوطة مورة. وكان الكنعانيون حينئذ في الأرض. وظهر الرب لأبرام وقال: لنسلك أعطي هذه الأرض. فبنى هناك مذبحاً للرب الذي ظهر له"},{"r":"8-9","t":"ثم نقل من هناك إلى الجبل شرقي بيت إيل ونصب خيمته... فبنى هناك مذبحاً للرب ودعا باسم الرب. ثم ارتحل أبرام ارتحالاً متوالياً نحو الجنوب"},{"r":"10-13","t":"وحدث جوع في الأرض، فانحدر أبرام إلى مصر ليتغرب هناك... وقال لساراي امرأته: إني قد علمت أنك امرأة حسنة المنظر... فيقتلونني ويستبقونك. قولي إنك أختي، ليكون لي خير بسببك وتحيا نفسي من أجلك"},{"r":"14-16","t":"فحدث لما دخل أبرام إلى مصر أن المصريين رأوا المرأة أنها حسنة جداً... فأُخذت المرأة إلى بيت فرعون. فصنع إلى أبرام خيراً بسببها، وصار له غنم وبقر وحمير وعبيد وإماء وأتن وجمال"},{"r":"17-20","t":"فضرب الرب فرعون وبيته ضربات عظيمة بسبب ساراي امرأة أبرام. فدعا فرعون أبرام وقال: ما هذا الذي صنعت بي؟ لماذا لم تخبرني أنها امرأتك؟... والآن هوذا امرأتك، خذها واذهب! فأوصى عليه فرعون رجالاً فشيعوه وامرأته وكل ما كان له"}],"keyVerse":"Gen.12.3","people":[{"n":"أبرام","d":"ابن 75 سنة، من عائلة وثنية (يش 24: 2)، بلا أولاد. الله يختاره بنعمة مطلقة، لا لفضل فيه. يطيع بإيمان (عب 11: 8)، لكنه يسقط في الخوف والكذب في مصر."},{"n":"ساراي","d":"جميلة جداً رغم أنها في الستين أو أكثر. ضحية خوف زوجها. والله يحميها لأنها أم النسل الموعود."},{"n":"لوط","d":"ابن أخي أبرام، يرافقه. سيصير لاحقاً سبب مشكلة."},{"n":"فرعون","d":"لقب ملك مصر («البيت العظيم»). لا يُذكر اسمه. المفارقة: الوثني يتصرف بنزاهة أكثر من رجل الإيمان، ويوبخه."}],"places":[{"n":"حاران","d":"نقطة الانطلاق، في شمال بلاد الرافدين. نحو 650 كم إلى كنعان."},{"n":"شكيم","d":"مدينة في وسط كنعان، بين جبلي عيبال وجرزيم (نابلس اليوم). أول مكان يصل إليه أبرام ويبني فيه مذبحاً. وفيها سيجدد يشوع العهد (يش 24)، وقربها بئر يعقوب حيث تكلم يسوع مع السامرية (يو 4)."},{"n":"بيت إيل","d":"«بيت الله»، شمال أورشليم. فيها سيرى يعقوب السلم (28: 19)."},{"n":"النقب","d":"«الجنوب»، المنطقة الصحراوية جنوب كنعان."},{"n":"مصر","d":"ملجأ تقليدي وقت الجوع بسبب النيل. وسيتكرر النزول إلى مصر مع يعقوب وأبنائه."}],"summary":["وقال الرب لأبرام: اذهب من أرضك ومن عشيرتك ومن بيت أبيك إلى الأرض التي أريك. فأجعلك أمة عظيمة وأباركك وأعظم اسمك، وتكون بركة. وأبارك مباركيك، ولاعنك ألعنه. وتتبارك فيك جميع قبائل الأرض.","فذهب أبرام كما قال له الرب، وذهب معه لوط. وكان أبرام ابن خمس وسبعين سنة لما خرج من حاران. فأخذ أبرام ساراي امرأته، ولوطاً ابن أخيه، وكل مقتنياتهما التي اقتنيا والنفوس التي امتلكا في حاران. وخرجوا ليذهبوا إلى أرض كنعان. فأتوا إلى أرض كنعان. واجتاز أبرام في الأرض إلى مكان شكيم إلى بلوطة مورة. وكان الكنعانيون حينئذ في الأرض. وظهر الرب لأبرام وقال: لنسلك أعطي هذه الأرض. فبنى هناك مذبحاً للرب الذي ظهر له. ثم نقل من هناك إلى الجبل شرقي بيت إيل ونصب خيمته... فبنى هناك مذبحاً للرب ودعا باسم الرب.","وحدث جوع في الأرض، فانحدر أبرام إلى مصر ليتغرب هناك، لأن الجوع في الأرض كان شديداً. وحدث لما قرب أن يدخل مصر أنه قال لساراي امرأته: إني قد علمت أنك امرأة حسنة المنظر. فيكون إذا رآك المصريون أنهم يقولون: هذه امرأته. فيقتلونني ويستبقونك. قولي إنك أختي، ليكون لي خير بسببك وتحيا نفسي من أجلك. فحدث لما دخل أبرام إلى مصر أن المصريين رأوا المرأة أنها حسنة جداً. ورآها رؤساء فرعون ومدحوها لدى فرعون، فأُخذت المرأة إلى بيت فرعون. فصنع إلى أبرام خيراً بسببها.","فضرب الرب فرعون وبيته ضربات عظيمة بسبب ساراي امرأة أبرام. فدعا فرعون أبرام وقال: ما هذا الذي صنعت بي؟ لماذا لم تخبرني أنها امرأتك؟ لماذا قلت هي أختي، حتى أخذتها لي لتكون زوجتي؟ والآن هوذا امرأتك، خذها واذهب! فأوصى عليه فرعون رجالاً فشيعوه وامرأته وكل ما كان له."],"background":[{"t":"الترك المضاعف","d":"الدعوة تطلب ترك ثلاث دوائر متزايدة القرب: «أرضك» (الوطن)، و«عشيرتك» (القبيلة)، و«بيت أبيك» (العائلة). في العالم القديم، هذه كانت الهوية والأمان والميراث. وفي المقابل، الوجهة غير محددة: «الأرض التي أريك». إيمان حقيقي: «خرج وهو لا يعلم إلى أين يأتي» (عب 11: 8)."},{"t":"خمس بركات مقابل خمس لعنات","d":"كلمة «بارك» تتكرر خمس مرات في 12: 2–3، كأنها رد على كلمة «لعن» التي ظهرت خمس مرات في 1–11 (3: 14، 17؛ 4: 11؛ 5: 29؛ 9: 25). الله يبدأ مشروع إلغاء اللعنة من خلال أبرام."},{"t":"المذابح","d":"أبرام لم يبنِ مدناً بل مذابح. أينما ذهب، أعلن ملكية الرب للأرض بالعبادة. والكنعانيون ما زالوا هناك: أبرام يملك الأرض بالوعد فقط، لا بالواقع."}],"words":[{"w":"اذهب","orig":"לֶךְ־לְךָ (لِخ لِخا)","d":"حرفياً «اذهب لنفسك». نفس التعبير سيتكرر في 22: 2 («اذهب إلى أرض المريا»): أول وآخر اختبار لإيمان إبراهيم."},{"w":"بارك / بركة","orig":"בָּרַךְ (بارك)","d":"منح الحياة والازدهار والخير من الله. ونقيضها «لعن» (أرار)."},{"w":"قبائل","orig":"מִשְׁפְּחֹת (مشبحوت)","d":"عشائر، عائلات. نفس الكلمة في جدول الأمم (10: 5، 32). البركة لكل «عشيرة» تفرقت في بابل."},{"w":"نسل","orig":"זֶרַע (زرع)","d":"بذرة، ذرية. مفرد بصيغته، ويُستخدم للجمع والمفرد. بولس يرى فيه إشارة للمسيح (غل 3: 16)."},{"w":"دعا باسم الرب","orig":"קָרָא בְּשֵׁם יְהוָה (قارا بشيم يهوه)","d":"عبادة علنية وصلاة. نفس التعبير في 4: 26. أبرام يمجد «اسم» الرب بدل أن «يصنع لنفسه اسماً» كبناة بابل."}],"otQuotes":[],"links":[{"ref":"Gal.3.8","d":"والكتاب إذ سبق فرأى أن الله بالإيمان يبرر الأمم، سبق فبشر إبراهيم أن فيك تتبارك جميع الأمم.","label":"غلاطية ٣: ٨"},{"ref":"Gal.3.16","d":"وأما المواعيد فقيلت في إبراهيم وفي نسله. لا يقول: وفي الأنسال كأنه عن كثيرين، بل كأنه عن واحد: وفي نسلك الذي هو المسيح.","label":"غلاطية ٣: ١٦"},{"ref":"Heb.11.8","d":"بالإيمان إبراهيم لما دعي أطاع أن يخرج إلى المكان الذي كان عتيداً أن يأخذه ميراثاً، فخرج وهو لا يعلم إلى أين يأتي.","label":"العبرانيين ١١: ٨"},{"ref":"Acts.3.25-26","d":"أنتم أبناء الأنبياء والعهد... قائلاً لإبراهيم: وبنسلك تتبارك جميع قبائل الأرض. إليكم أولاً، إذ أقام الله فتاه يسوع، أرسله يبارككم.","label":"أعمال الرسل ٣: ٢٥–٢٦"},{"ref":"Rom.4.13","d":"فإنه ليس بالناموس كان الوعد لإبراهيم أو لنسله أن يكون وارثاً للعالم، بل ببر الإيمان.","label":"رومية ٤: ١٣"},{"ref":"Josh.24.2-3","d":"تارح أبو إبراهيم... وعبدوا آلهة أخرى. فأخذت إبراهيم أباكم من عبر النهر.","label":"يشوع ٢٤: ٢–٣"},{"ref":"Gen.20.2","d":"وقال إبراهيم عن سارة امرأته: هي أختي. فأرسل أبيمالك ملك جرار وأخذ سارة.","label":"التكوين ٢٠: ٢"}],"christ":["الوعد «تتبارك فيك جميع قبائل الأرض» هو، كما يقول بولس، «الإنجيل» المبشر به مسبقاً لإبراهيم (غل 3: 8). البركة لكل الأمم تأتي من خلال «النسل» الواحد، المسيح (غل 3: 16). ففي المسيح تُرفع اللعنة: \"المسيح افتدانا من لعنة الناموس، إذ صار لعنة لأجلنا... لتصير بركة إبراهيم للأمم في المسيح يسوع\" (غل 3: 13–14). كل مؤمن من كل أمة هو ابن لإبراهيم بالإيمان (غل 3: 7، 29).","وأبرام يترك وطنه وبيت أبيه طاعة لله، لكن المسيح ترك أكثر بكثير: مجد السماء وحضن الآب (في 2: 6–7). وحيث فشل أبرام في مصر (خاف وكذب ليحمي نفسه وعرض زوجته للخطر)، المسيح العريس الحقيقي بذل نفسه ليحمي عروسه، الكنيسة (أف 5: 25)."],"hard":[{"q":"هل كذب أبرام حين قال إن ساراي أخته؟","tag":"agreed","a":["نصف حقيقة: ساراي كانت أخته غير الشقيقة فعلاً (ابنة أبيه لا ابنة أمه، 20: 12). لكن قصده كان الخداع: إخفاء أنها زوجته. ونصف الحقيقة المقصود به الخداع كذب. والنص لا يبرره: فرعون الوثني يوبخه («ما هذا الذي صنعت بي؟»)، وأبرام صامت بلا جواب. الكتاب صادق في عرض خطايا أبطاله. والأهم: الله يبقى أميناً لوعده رغم عدم أمانة أبرام."]},{"q":"لماذا عاقب الله فرعون وهو لم يعرف أنها متزوجة؟","tag":"debated","a":["الضربات لم تكن بالضرورة عقاباً أخلاقياً لفرعون بقدر ما كانت تدخلاً إلهياً لحماية ساراي، أم النسل الموعود. الله يحمي خطته الفدائية مهما كلف الأمر. ومع ذلك، أخذ فرعون للنساء لقصره بالقوة لم يكن بريئاً. والضربات جعلت فرعون يكتشف الحقيقة. وهي تمهيد لضربات مصر في الخروج: الله يحمي شعبه من فرعون ويُخرجهم بغنى."]},{"q":"هل وعد «أبارك مباركيك ولاعنك ألعنه» ينطبق على دولة إسرائيل الحديثة؟","tag":"debated","a":["هذا موضوع اختلاف بين التقليدين. التدبيريون عادة يرون أن الوعد يمتد لإسرائيل العرقية والدولة الحديثة، فيدعو بعضهم لدعم سياسي لها. والتقليد المصلح (العهدي) يرى أن الوعد يتحقق في المسيح «نسل إبراهيم» الحقيقي (غل 3: 16)، وفي كل من هو «في المسيح» من اليهود والأمم (غل 3: 29). والموقف من المسيح هو الذي يحدد البركة واللعنة. وكلا الطرفين يتفق على محبة الشعب اليهودي والصلاة لخلاصه (رو 10: 1)، ورفض معاداة السامية. وسيأتي النقاش الكامل حول وعد الأرض في الأصحاح 15."]}],"voices":[{"n":"جون كالفن","y":"1509–1564","w":"تفسير سفر التكوين (1554)","b":"يؤكد أن دعوة أبرام نعمة مجانية: الله اختار رجلاً من عائلة وثنية، لا لفضل فيه. ويقول عن سقوطه في مصر إن الله يُظهر ضعف قديسيه لكي لا نعتمد على البشر، بل نتعلم أن الخلاص كله من نعمة الله."},{"n":"جيمس مونتجمري بويس","y":"1938–2000","w":"التكوين: تفسير عرضي (1982–1987)","b":"يلاحظ أن أبرام في الإيمان بنى مذابح، وفي الخوف لم يبنِ مذبحاً في مصر. حين يغيب المذبح، تبدأ الحلول البشرية والكذب. ويرى أن القصة تُظهر أن الوعد يعتمد على أمانة الله لا على أمانة أبرام."},{"n":"بروس والتكي","y":"1930–","w":"التكوين: تفسير (2001)","b":"يرى في 12: 1–3 المحور الذي يدور عليه التكوين كله، بل الكتاب كله: الله يعلن خطته لاستعادة البركة لكل الأمم من خلال نسل إبراهيم. والقصص التالية تختبر: هل سيثق إبراهيم في الوعد؟ وهل سيحفظ الله وعده رغم العوائق؟"}],"questions":["ما \"أرضك وعشيرتك وبيت أبيك\" التي قد يطلب الله منك تركها؟","هل تقدر أن تطيع الله حتى لو لم تعرف «إلى أين»؟","كيف تشعر حين تعرف أن البركة التي وعد بها إبراهيم صارت لك في المسيح (غل 3: 29)؟","ماذا يعلمك أن أبرام لم يبنِ مذبحاً في مصر؟ هل تهمل الصلاة حين تكون خائفاً؟","هل تستخدم «أنصاف الحقائق» لتحمي نفسك؟","هل أنت «بركة» للآخرين من حولك كما دُعي أبرام؟"],"apply":"اكتب على ورقة: \"في المسيح، أنا ابن لإبراهيم ووارث للوعد\" (غل 3: 29). ثم فكر في موقف هذا الأسبوع تميل فيه لحماية نفسك بنصف حقيقة أو بالخوف. قرر أن تقول الحق كاملاً وتثق في حماية الله. وابحث عن طريقة عملية لتكون «بركة» لشخص واحد من غير عائلتك.","keyVerseText":"وَأُبَارِكُ مُبَارِكِيكَ، وَلَاعِنَكَ أَلْعَنُهُ. وَتَتَبَارَكُ فِيكَ جَمِيعُ قَبَائِلِ ٱلْأَرْضِ».","keyVerseLabel":"التكوين ١٢: ٣"},"text":[{"number":1,"text":"وَقَالَ ٱلرَّبُّ لِأَبْرَامَ: «ٱذْهَبْ مِنْ أَرْضِكَ وَمِنْ عَشِيرَتِكَ وَمِنْ بَيْتِ أَبِيكَ إِلَى ٱلْأَرْضِ ٱلَّتِي أُرِيكَ."},{"number":2,"text":"فَأَجْعَلَكَ أُمَّةً عَظِيمَةً وَأُبَارِكَكَ وَأُعَظِّمَ ٱسْمَكَ، وَتَكُونَ بَرَكَةً."},{"number":3,"text":"وَأُبَارِكُ مُبَارِكِيكَ، وَلَاعِنَكَ أَلْعَنُهُ. وَتَتَبَارَكُ فِيكَ جَمِيعُ قَبَائِلِ ٱلْأَرْضِ»."},{"number":4,"text":"فَذَهَبَ أَبْرَامُ كَمَا قَالَ لَهُ ٱلرَّبُّ وَذَهَبَ مَعَهُ لُوطٌ. وَكَانَ أَبْرَامُ ٱبْنَ خَمْسٍ وَسَبْعِينَ سَنَةً لَمَّا خَرَجَ مِنْ حَارَانَ."},{"number":5,"text":"فَأَخَذَ أَبْرَامُ سَارَايَ ٱمْرَأَتَهُ، وَلُوطًا ٱبْنَ أَخِيهِ، وَكُلَّ مُقْتَنَيَاتِهِمَا ٱلَّتِي ٱقْتَنَيَا وَٱلنُّفُوسَ ٱلَّتِي ٱمْتَلَكَا فِي حَارَانَ. وَخَرَجُوا لِيَذْهَبُوا إِلَى أَرْضِ كَنْعَانَ. فَأَتَوْا إِلَى أَرْضِ كَنْعَانَ."},{"number":6,"text":"وَٱجْتَازَ أَبْرَامُ فِي ٱلْأَرْضِ إِلَى مَكَانِ شَكِيمَ إِلَى بَلُّوطَةِ مُورَةَ. وَكَانَ ٱلْكَنْعَانِيُّونَ حِينَئِذٍ فِي ٱلْأَرْضِ."},{"number":7,"text":"وَظَهَرَ ٱلرَّبُّ لِأَبْرَامَ وَقَالَ: «لِنَسْلِكَ أُعْطِي هَذِهِ ٱلْأَرْضَ». فَبَنَى هُنَاكَ مَذْبَحًا لِلرَّبِّ ٱلَّذِي ظَهَرَ لَهُ."},{"number":8,"text":"ثُمَّ نَقَلَ مِنْ هُنَاكَ إِلَى ٱلْجَبَلِ شَرْقِيَّ بَيْتِ إِيلٍ وَنَصَبَ خَيْمَتَهُ. وَلَهُ بَيْتُ إِيلَ مِنَ ٱلْمَغْرِبِ وَعَايُ مِنَ ٱلْمَشْرِقِ. فَبَنَى هُنَاكَ مَذْبَحًا لِلرَّبِّ وَدَعَا بِٱسْمِ ٱلرَّبِّ."},{"number":9,"text":"ثُمَّ ٱرْتَحَلَ أَبْرَامُ ٱرْتِحَالًا مُتَوَالِيًا نَحْوَ ٱلْجَنُوبِ."},{"number":10,"text":"وَحَدَثَ جُوعٌ فِي ٱلْأَرْضِ، فَٱنْحَدَرَ أَبْرَامُ إِلَى مِصْرَ لِيَتَغَرَّبَ هُنَاكَ، لِأَنَّ ٱلْجُوعَ فِي ٱلْأَرْضِ كَانَ شَدِيدًا."},{"number":11,"text":"وَحَدَثَ لَمَّا قَرُبَ أَنْ يَدْخُلَ مِصْرَ أَنَّهُ قَالَ لِسَارَايَ ٱمْرَأَتِهِ: «إِنِّي قَدْ عَلِمْتُ أَنَّكِ ٱمْرَأَةٌ حَسَنَةُ ٱلْمَنْظَرِ."},{"number":12,"text":"فَيَكُونُ إِذَا رَآكِ ٱلْمِصْرِيُّونَ أَنَّهُمْ يَقُولُونَ: هَذِهِ ٱمْرَأَتُهُ. فَيَقْتُلُونَنِي وَيَسْتَبْقُونَكِ."},{"number":13,"text":"قُولِي إِنَّكِ أُخْتِي، لِيَكُونَ لِي خَيْرٌ بِسَبَبِكِ وَتَحْيَا نَفْسِي مِنْ أَجْلِكِ»."},{"number":14,"text":"فَحَدَثَ لَمَّا دَخَلَ أَبْرَامُ إِلَى مِصْرَ أَنَّ ٱلْمِصْرِيِّينَ رَأَوْا ٱلْمَرْأَةَ أَنَّهَا حَسَنَةٌ جِدًّا."},{"number":15,"text":"وَرَآهَا رُؤَسَاءُ فِرْعَوْنَ وَمَدَحُوهَا لَدَى فِرْعَوْنَ، فَأُخِذَتِ ٱلْمَرْأَةُ إِلَى بَيْتِ فِرْعَوْنَ،"},{"number":16,"text":"فَصَنَعَ إِلَى أَبْرَامَ خَيْرًا بِسَبَبِهَا، وَصَارَ لَهُ غَنَمٌ وَبَقَرٌ وَحَمِيرٌ وَعَبِيدٌ وَإِمَاءٌ وَأُتُنٌ وَجِمَالٌ."},{"number":17,"text":"فَضَرَبَ ٱلرَّبُّ فِرْعَوْنَ وَبَيْتَهُ ضَرَبَاتٍ عَظِيمَةً بِسَبَبِ سَارَايَ ٱمْرَأَةِ أَبْرَامَ."},{"number":18,"text":"فَدَعَا فِرْعَوْنُ أَبْرَامَ وَقَالَ: «مَا هَذَا ٱلَّذِي صَنَعْتَ بِي؟ لِمَاذَا لَمْ تُخْبِرْنِي أَنَّهَا ٱمْرَأَتُكَ؟"},{"number":19,"text":"لِمَاذَا قُلْتَ: هِيَ أُخْتِي، حَتَّى أَخَذْتُهَا لِي لِتَكُونَ زَوْجَتِي؟ وَٱلْآنَ هُوَذَا ٱمْرَأَتُكَ! خُذْهَا وَٱذْهَبْ!»."},{"number":20,"text":"فَأَوْصَى عَلَيْهِ فِرْعَوْنُ رِجَالًا فَشَيَّعُوهُ وَٱمْرَأَتَهُ وَكُلَّ مَا كَانَ لَهُ."}],"titles":["في البدء خلق الله","الراحة، والجنة، والرجل والمرأة","السقوط والوعد الأول","قايين وهابيل","من آدم إلى نوح: «ومات»، إلا أخنوخ","فساد الأرض ونوح الذي وجد نعمة","الطوفان","الله يذكر نوحاً","العهد مع نوح وقوس قزح","جدول الأمم","برج بابل ومن سام إلى أبرام","دعوة أبرام والوعد","أبرام ولوط يفترقان","حرب الملوك وملكي صادق","العهد بين الأشلاء: فآمن بالرب فحسبه له براً","هاجر وإسماعيل: الإله الذي يراني","عهد الختان: إبراهيم وسارة","الزوار الثلاثة والشفاعة لسدوم","هلاك سدوم ونجاة لوط","إبراهيم وأبيمالك: تكرار الخطأ","ولادة إسحاق وطرد هاجر","تقديم إسحاق: الرب يرى","موت سارة ومغارة المكفيلة","زوجة لإسحاق: رفقة","موت إبراهيم وولادة التوأمين وبيع البكورية","إسحاق والآبار: الرب أرحب لنا","يعقوب يأخذ البركة بالخداع","سلم يعقوب في بيت إيل","يعقوب عند لابان: راحيل وليئة","حرب الأختين وثروة يعقوب","يعقوب يهرب من لابان: عهد جلعاد","يعقوب يصارع الله في فنيئيل","المصالحة: رأيت وجهك كما يُرى وجه الله","دينة وشكيم: الانتقام في شكيم","الرجوع إلى بيت إيل: موت راحيل وإسحاق","مواليد عيسو: أدوم","يوسف وأحلامه: بيعه من إخوته","يهوذا وثامار: هي أبر مني","يوسف في بيت فوطيفار والسجن: وكان الرب مع يوسف","حلما الساقي والخباز: أليست التعابير لله؟","حلما فرعون: من السجن إلى العرش","الإخوة في مصر: حقاً إننا مذنبون","الرحلة الثانية: بنيامين والوليمة","الطاس في عدل بنيامين: شفاعة يهوذا","أنا يوسف: الله أرسلني قدامكم","يعقوب ينزل إلى مصر: لا تخف","يعقوب أمام فرعون وسياسة يوسف في المجاعة","يعقوب يبارك منسى وأفرايم","بركات يعقوب لأبنائه: حتى يأتي شيلون","أنتم قصدتم لي شراً، أما الله فقصد به خيراً"],"v":{"Gen.12.3":{"t":"وَأُبَارِكُ مُبَارِكِيكَ، وَلَاعِنَكَ أَلْعَنُهُ. وَتَتَبَارَكُ فِيكَ جَمِيعُ قَبَائِلِ ٱلْأَرْضِ».","l":"التكوين ١٢: ٣"},"Gal.3.8":{"t":"وَٱلْكِتَابُ إِذْ سَبَقَ فَرَأَى أَنَّ ٱللهَ بِٱلْإِيمَانِ يُبَرِّرُ ٱلْأُمَمَ، سَبَقَ فَبَشَّرَ إِبْرَاهِيمَ أَنْ «فِيكَ تَتَبَارَكُ جَمِيعُ ٱلْأُمَمِ».","l":"غلاطية ٣: ٨"},"Gal.3.16":{"t":"وَأَمَّا ٱلْمَوَاعِيدُ فَقِيلَتْ فِي إِبْرَاهِيمَ وَفِي نَسْلِهِ. لَا يَقُولُ: «وَفِي ٱلْأَنْسَالِ» كَأَنَّهُ عَنْ كَثِيرِينَ، بَلْ كَأَنَّهُ عَنْ وَاحِدٍ: «وَفِي نَسْلِكَ» ٱلَّذِي هُوَ ٱلْمَسِيحُ.","l":"غلاط function pcard(id, opts = {}) {
  const P = PEOPLE[id] || COLLECTION.find((c) => c.id === id);
  const locked = opts.locked;
  return `<button class="pc${locked ? ' locked' : ''}" data-person="${locked ? '' : id}" ${locked ? `data-toast="تُفتح في ${esc(P.s)}"` : ''}><div class="in">

// ====================== PATH ======================
function renderPath() {
  const total = 50, nDone = done.length, cur = [...Array(50).keys()].map((i) => i + 1).find((n) => !done.includes(n)) || 50;
  const R = 26, circ = 2 * Math.PI * R;
  const SECT = { 1: 'التاريخ البدائي', 12: 'إبراهيم', 25: 'إسحاق ويعقوب', 37: 'يوسف وإخوته' };
  const CARD_AT = { 2: 'adam', 3: 'eve', 6: 'noah', 12: 'abram' };
  const X = (n) => 50 + 26 * Math.sin(n * 0.9);
  let rows = '', ys = [], y = 0;
  for (let n = 1; n <= 50; n++) {
    if (SECT[n]) { rows += `<div class="sect">${SECT[n]}</div>`; y += 46; }
    const st = done.includes(n) ? 'done' : n === cur ? 'cur' : 'todo';
    const x = X(n);
    ys.push([100 - x, y + 44]);
    const cardId = CARD_AT[n];
    const cardSide = x > 50 ? 16 : 84;
    rows += `<div class="node ${st}" id="n${n}">
      ${n === cur ? `<span class="bub" style="right:${x}%">ابدأ من هنا</span>` : ''}
      <button style="right:${x}%" data-ch="${n}" aria-label="التكوين ${n}">${st === 'done' ? '<svg class="check" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>' : ar(n)}</button>
      ${cardId ? `<button class="mini" data-person="${owned.includes(cardId) && PEOPLE[cardId] ? cardId : ''}" ${owned.includes(cardId) ? '' : 'data-toast="تُفتح بطاقة هذه الشخصية حين تكمل الأصحاح"'} style="right:${cardSide}%;background:linear-gradient(150deg,#f1d58f,#C9A24B);opacity:${owned.includes(cardId) ? 1 : .4};padding:3px"><span style="display:grid;place-items:center;height:100%;background:#FBF7F0;border-radius:7px">${(() => { const P = PEOPLE[cardId] || COLLECTION.find((c) => c.id === cardId); return `<span style="width:30px;height:30px;display:block">${ICON[P.icon](P.col)}</span>`; })()}</span></button>` : `<span class="lab" style="${x > 50 ? 'left' : 'right'}:6%;text-align:${x > 50 ? 'left' : 'right'}">${n === cur ? esc(D.titles[n - 1]) : ''}</span>`}
    </div>`;
    y += 92;
  }
  const W = 100;
  let d = '';
  ys.forEach(([x, yy], i) => { d += (i ? ` S ${x} ${yy - 40} ${x} ${yy}` : `M ${x} ${yy}`); });
  const curIdx = cur - 1;
  let dDone = ''; ys.slice(0, curIdx + 1).forEach(([x, yy], i) => { dDone += (i ? ` S ${x} ${yy - 40} ${x} ${yy}` : `M ${x} ${yy}`); });
  $('#v-path').innerHTML = `
  <div class="phead">
    <div class="row">
      <div class="ring"><svg viewBox="0 0 66 66"><circle cx="33" cy="33" r="${R}" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="7"/><circle cx="33" cy="33" r="${R}" fill="none" stroke="#E2B53E" stroke-width="7" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ * (1 - nDone / total)}"/></svg><b>${ar(nDone)}<small>من ${ar(total)}</small></b></div>
      <div><h1>سفر التكوين</h1><p>البدايات: الخلق والسقوط والوعد</p></div>
    </div>
    <div class="stats">
      <div class="stat"><b>${ar(nDone)}</b><small>أصحاحاً قرأتها</small></div>
      <div class="stat"><b>${ar(owned.length)}</b><small>بطاقة شخصية</small></div>
      <div class="stat"><b>${ar(4)}</b><small>أيام متتالية</small></div>
    </div>
  </div>
  <button class="today" data-ch="${cur}" style="width:calc(100% - 32px);text-align:start">
    <span class="ill">${cover(true)}</span>
    <span><small>محطتك التالية · ٧ دقائق</small><b>التكوين ${ar(cur)}: ${esc(D.titles[cur - 1])}</b><span>رجل واحد، ودعوة واحدة، ووعد للعالم كله.</span></span>
    <span class="go">←</span>
  </button>
  <div class="trail" style="height:${y}px">
    <svg viewBox="0 0 100 ${y}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="#e3d9c8" stroke-width="1.6" vector-effect="non-scaling-stroke" style="stroke-width:6px"/><path d="${dDone}" fill="none" stroke="#C9A24B" vector-effect="non-scaling-stroke" style="stroke-width:6px"/></svg>
    <div style="position:absolute;inset:0">${rows}</div>
  </div>`;
  // fix: rows are absolutely layered on svg; set sect/node flow
  requestAnimationFrame(() => { const n = $('#n' + cur); if (n && !renderPath.scrolled) { $('#v-path').scrollTop = n.offsetTop + 260 - 200; renderPath.scrolled = true; } });
}
function cover(small) {

        <div class="tbox" style="background:var(--gold);color:var(--navy)"><small>العهد الجديد · ${esc(V('Gal.3.16').l)}</small><span class="s">وَفِي نَسْلِكَ <b>ٱلَّذِي هُوَ ٱلْمَسِيحُ</b></span></div>
      </div><p style="font-size:16px;margin-top:14px;opacity:.85">البركة لكل الأمم تأتي من خلال نسل واحد من إبراهيم: يسوع.</p>`, 'christ'),
    c('#3E6B57', '#fff', 'word', `<div class="ey"><i>✍️</i>كلمة من الأصل العبري</div><div class="hword">בָּרַךְ</div><h2 style="margin-bottom:8px">بارك</h2><p>${md(C.words.find((w) => w.w.includes('بارك'))?.d || '')} تتكرر <b>خمس مرات</b> في آيتين، رداً على كلمة «لعن» التي تكررت خمس مرات قبلها.</p>`, 'word'),
    c('#F6EFE3', '#1d1b18', 'you', `<div class="ey" style="color:var(--terra)"><i>💬</i>لك أنت</div><h2>${md(C.questions[0])}</h2><div style="background:#fff;border-radius:18px;padding:16px;margin-top:6px"><b class="d" style="font-size:14px;color:var(--terra)">خطوة هذا الأسبوع</b><p style="font-size:16.5px;margin-top:4px">${md(C.apply)}</p></div>`, 'you'),
    c('#1E2A4A', '#fff', 'reward', `<div class="reward" style="display:flex;flex-direction:column">${Array.from({ length: 14 }, (_, i) => `<i class="spark" style="right:${(i * 37) % 100}%;top:-${(i * 13) % 40}px;animation-delay:${(i % 7) * .3}s"></i>`).join('')}
      <div class="badge"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></div>
      <h2 style="margin-bottom:4px">أكملت التكوين ١٢</h2><p style="opacity:.8;font-size:16px">المحطة ١٢ من ٥٠ · حصلت على ٣ بطاقات جديدة</p>
      <div class="unlock">${pcard('abram')}${pcard('sarai')}${pcard('lot')}</div>
      <button class="pbtn" style="background:var(--mustard);color:var(--navy);align-self:center" data-more="hub">ادرس أعمق</button>
      <button class="pbtn" style="background:rgba(255,255,255,.12);color:#fff;align-self:center;margin-top:10px" data-closestory="next">التالي: التكوين ١٣ ←</button></div>`, null),
  ];
}
let si = 0, cards = [];
function openStory(n) {
  if (n !== 12) { toast('في النموذج: التكوين ١٢ فقط'); return; }
  cards = storyCards(); si = 0;
  const S = $('#story');
  S.innerHTML = `<div class="bars">${cards.map(() => '<i></i>').join('')}</div>
  <div class="stop"><button data-closestory aria-label="إغلاق">✕</button><span>التكوين ١٢</span><button data-more="hub" aria-label="ادرس أعمق">☰</button></div>
  ${cards.map((c, k) => `<div class="card" style="background:${c.bg};color:${c.fg}" data-k="${k}">${c.html}${c.more ? `<button class="more${c.fg === '#fff' ? '' : ' dark'}" data-more="${c.more}"><span>↑</span> اعرف أكثر</button>` : ''}</div>`).join('')}
  <div class="tz r" data-dir="-1"></div><div class="tz l" data-dir="1"></div>`;
  S.classList.add('on'); showCard();
}
function showCard() {
  const S = $('#story');
  $$('.card', S).forEach((c, k) => c.classList.toggle('on', k === si));
  $$('.bars i', S).forEach((b, k) => b.classList.toggle('done', k <= si));
  $('.bars', S).style.color = cards[si].fg; $('.stop', S).style.color = cards[si].fg;
  if (cards[si].key === 'reward' && !done.includes(12)) { done.push(12); ['abram', 'sarai', 'lot'].forEach((p) => owned.includes(p) || owned.push(p)); save(); }
}
function step(d) { si = Math.max(0, Math.min(cards.length - 1, si + d)); showCard(); }

// ====================== SHEET / READER ======================
function openSheet(key) {
  const sh = $('#sheet');
  if (key === 'reader') { closeSheet(); openReader(); return; }
  sh.innerHTML = `<div class="grab"></div>${MORE[key]()}`;
  sh.scrollTop = 0; sh.classList.add('on'); $('#scrim').classList.add('on');
}
function closeSheet() { $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); }
function openReader() {
  const kv = /\.(\d+)$/.exec(C.keyVerse)[1];
  const per = Object.fromEntries(C.pericopes.map((p) => [p.at, p.t]));
  let h = '', o = false;
  for (const v of D.text) {
    if (per[v.number]) { if (o) h += '</p>'; h += `<h3 class="peri">${esc(per[v.number])}</h3><p>`; o = true; } else if (!o) { h += '<p>'; o = true; }
    h += `<span class="${v.number == kv ? 'key' : ''}"><span class="vn">${ar(v.number)}</span>${esc(v.text)} </span>`;
  }
  $('#reader').innerHTML = `<div class="rh"><span>التكوين ١٢</span><button data-closereader>✕</button></div><div class="rbody"><div class="scr">${h}</p></div>
  <button class="pbtn" style="background:var(--navy);color:#fff;margin-top:26px" data-closereader>رجوع للقصة</button></div>`;
  $('#reader').classList.add('on'); $('#reader').scrollTop = 0;
}

// ====================== PERSON DETAIL ======================
function openPerson(id) {
  const P = PEOPLE[id];
  if (!P) { toast('في النموذج: أبرام وساراي ولوط فقط'); return; }
  $('#pdet').innerHTML = `<div class="pd-top"><button data-closeperson>✕</button><button data-toast="مشاركة البطاقة">↗</button></div>
  <div class="bigcard"><div class="in">
    <div class="med" style="background:${P.bg}">${ICON[P.icon](P.col)}</div>
    <h2>${esc(P.full)}</h2><div class="mean">معنى الاسم: ${esc(P.mean)}</div><span class="role">${esc(P.role)}</span>
    <div class="facts">${P.facts.map(([a, b]) => `<div><b>${a}</b><small>${b}</small></div>`).join('')}</div>
    <div class="traits"><div style="background:#E3F0E8;color:#2f5d43"><b>أبرز صفة</b>${md(P.trait)}</div><div style="background:#F7EDD6;color:#7a5410"><b>صراعه</b>${md(P.strug)}</div></div>
  </div></div>
  <div class="pd-sec"><h3>⭐ آية تلخصه</h3><div class="nt"><small>${esc(V(P.key).l)}</small><p>${esc(V(P.key).t)}</p></div></div>
  <div class="pd-sec"><h3>🧭 محطات حياته</h3><div class="tl">${P.life.map(([c, t]) => `<button class="${c === 12 ? 'here' : ''}" data-toast="${c === 12 ? 'أنت هنا الآن' : 'يفتح التكوين ' + ar(c)}"><b>التكوين ${ar(c)}</b><span>${esc(t)}</span></button>`).join('')}</div></div>
  <div class="pd-sec"><h3>📜 في العهد الجديد</h3>${P.nt.map((r) => `<div class="nt"><small>${esc(V(r).l)}</small><p>${esc(V(r).t)}</p></div>`).join('')}</div>
  <div class="pd-sec" style="padding-bottom:10px"><h3>✝️ كيف يشير إلى المسيح</h3></div>
  <div class="cx">${md(P.christ)}</div><div style="height:40px"></div>`;
  $('#pdet').classList.add('on'); $('#pdet').scrollTop = 0;
}

// ====================== CARDS & MAPS VIEWS ======================
function renderCards() {
  const n = owned.length, tot = 52;
  $('#v-cards').innerHTML = `<div class="vh"><h1>بطاقاتي</h1><p>كل شخصية تقابلها في القراءة تنضم إلى مجموعتك.</p></div>
  <div class="bar2"><i style="width:${n / tot * 100}%"></i></div><p style="margin:0 20px;font-family:'Readex Pro';font-size:13px;color:var(--soft)">${ar(n)} من ${ar(tot)} شخصية في التكوين</p>
  <div class="cgrid">${COLLECTION.map((c) => owned.includes(c.id) ? pcard(c.id) : pcard(c.id, { locked: true })).join('')}</div>`;
}
function renderMaps() {
  $('#v-maps').innerHTML = `<div class="vh"><h1>الخرائط</h1><p>كل رحلة في الكتاب على خريطة، مرتبطة بأصحاحاتها.</p></div>
  <div class="mlist">
    <button class="mcard" data-openmap><div class="mv">${mapSVG({ theme: 'navy', vb: '80 40 490 250', fit: 'slice', labels: false })}</div><div class="mt"><b>رحلة أبرام</b><small>التكوين ١١–١٣ · من أور إلى مصر · ٦ محطات</small></div></button>
    ${[['الطوفان وجبال أراراط', 'التكوين ٦–٩'], ['رحلات يعقوب', 'التكوين ٢٨–٣٥'], ['يوسف إلى مصر', 'التكوين ٣٧–٥٠'], ['الخروج من مصر', 'سفر الخروج']].map(([a, b]) => `<button class="mcard lock" data-toast="تُفتح حين تصل إلى ${b}"><div class="mv">🔒 قريباً</div><div class="mt"><b>${a}</b><small>${b}</small></div></button>`).join('')}
  </div>`;
}
let mapActive = 'haran';
function openMap() {
  closeSheet();
  const p = PLACES.find((x) => x.id === mapActive); const i = PLACES.indexOf(p);
  $('#mapfull').innerHTML = `<div class="mf">${mapSVG({ theme: 'sand', active: mapActive, vb: '80 40 490 250', fit: 'meet' })}</div>
  <div class="mtop"><button data-closemap>✕</button><b>رحلة أبرام</b><button data-mstep="1">←</button></div>
  <div class="minfo"><b>${ar(i + 1)} · ${p.n}</b><p>${md(p.d)}</p><p style="font-family:'Readex Pro';font-size:13px;color:var(--terra);margin-top:6px">اضغط أي نقطة، أو ← للمحطة التالية</p></div>`;
  $('#mapfull').classList.add('on');
}

// ====================== EVENTS ======================
document.addEventListener('click', (e) => {
  const q = (s) => e.target.closest(s);
  let b;
  if ((b = q('[data-v]'))) { $$('#nav button').forEach((x) => x.setAttribute('aria-current', x === b)); $$('.view').forEach((v) => v.classList.toggle('on', v.id === 'v-' + b.dataset.v)); ({ path: renderPath, maps: renderMaps, cards: renderCards })[b.dataset.v](); return; }
  if ((b = q('[data-person]')) && b.dataset.person) { openPerson(b.dataset.person); return; }
  if ((b = q('[data-toast]'))) { toast(b.dataset.toast); return; }
  if ((b = q('[data-ch]'))) { openStory(+b.dataset.ch); return; }
  if ((b = q('[data-more]'))) { openSheet(b.dataset.more); return; }
  if (q('[data-reader]')) { openReader(); return; }
  if (q('[data-closereader]')) { $('#reader').classList.remove('on'); return; }
  if (q('[data-closeperson]')) { $('#pdet').classList.remove('on'); return; }
  if (q('[data-openmap]')) { openMap(); return; }
  if (q('[data-closemap]')) { $('#mapfull').classList.remove('on'); return; }
  if ((b = q('[data-mstep]'))) { const i = PLACES.findIndex((x) => x.id === mapActive); mapActive = PLACES[(i + 1) % PLACES.length].id; openMap(); return; }
  if ((b = q('#mapfull [data-pin]'))) { mapActive = b.dataset.pin; openMap(); return; }
  if ((b = q('[data-closestory]'))) { $('#story').classList.remove('on'); renderPath(); if (b.dataset.closestory === 'next') toast('هنا يبدأ التكوين ١٣'); return; }
  if (q('#scrim')) { closeSheet(); return; }
  if ((b = q('.tz'))) { step(+b.dataset.dir); return; }
});
let sx = 0, sy = 0;
$('#story').addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
$('#story').addEventListener('touchend', (e) => {
  if ($('#sheet').classList.contains('on') || $('#reader').classList.contains('on') || $('#pdet').classList.contains('on')) return;
  if (e.target.closest('.people')) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1);
  else if (dy < -70 && cards[si].more) openSheet(cards[si].more);
}, { passive: true });
renderPath();
</script>
</body>
</html>
