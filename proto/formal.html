<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نموذج رسمي · لمجد الله</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#17191E;--ink2:#23262D;--paper:#FAF8F4;--cream:#F2EEE6;--line:#E4DED3;--soft:#6E6A63;--faint:#A29C92;--accent:#8C2F1E;--gold:#B39459;--gold2:#D7C49A;--navy:#1F2A44}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d0e11}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:var(--ink);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
#shell{position:fixed;inset:0;max-width:520px;margin:0 auto;background:var(--paper);overflow:hidden}
.view{position:absolute;inset:0 0 64px 0;overflow-y:auto;display:none}
.view.on{display:block}
#nav{position:absolute;bottom:0;inset-inline:0;height:64px;background:var(--paper);border-top:1px solid var(--line);display:flex;z-index:10}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:'Readex Pro';font-size:12px;color:var(--faint)}
#nav button[aria-current=true]{color:var(--ink)}
#nav button[aria-current=true] .ic{stroke-width:2}

/* ---------- book page ---------- */
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 22px 0;font-family:'Readex Pro';font-size:13px;color:var(--soft)}
.top b{font-weight:500;color:var(--ink);letter-spacing:.2px}
.bk{padding:30px 22px 8px}
.bk .ey{font-family:'Readex Pro';font-size:12.5px;color:var(--accent);letter-spacing:.4px}
.bk h1{font-family:'Noto Naskh Arabic';font-weight:700;font-size:40px;line-height:1.25;margin:6px 0 8px}
.bk p{margin:0;font-size:16.5px;line-height:1.85;color:#3b3934}
.prog{display:flex;align-items:center;gap:12px;margin:22px 0 0;font-family:'Readex Pro';font-size:12.5px;color:var(--soft)}
.prog .bar{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--ink)}
.cta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 22px 6px;padding:16px 18px;background:var(--ink);color:#fff;border-radius:16px;width:calc(100% - 44px);text-align:start}
.cta small{display:block;font-family:'Readex Pro';font-size:12px;opacity:.6;margin-bottom:2px}
.cta b{font-family:'Readex Pro';font-weight:500;font-size:16.5px}
.toc{padding:10px 22px 40px}
.toc h2{font-family:'Readex Pro';font-weight:500;font-size:12.5px;color:var(--faint);letter-spacing:.4px;margin:26px 0 6px;padding-bottom:8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.row{display:flex;align-items:baseline;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);width:100%;text-align:start}
.row .n{font-family:'Readex Pro';font-size:14px;color:var(--faint);width:24px;flex:none}
.row .t{flex:1;font-size:16.5px;line-height:1.5}
.row .s{font-family:'Readex Pro';font-size:11.5px;color:var(--faint)}
.row.done .n{color:var(--gold)}
.row.cur{background:linear-gradient(90deg,transparent,var(--cream) 30%);margin:0 -22px;padding-inline:22px;width:calc(100% + 44px)}
.row.cur .n{color:var(--accent);font-weight:600}
.row.cur .s{color:var(--accent)}

/* ---------- chapter story ---------- */
#story{position:absolute;inset:0;z-index:30;display:none;background:var(--paper)}
#story.on{display:block}
.bars{position:absolute;top:12px;inset-inline:16px;display:flex;gap:3px;z-index:6}
.bars i{flex:1;height:2px;background:rgba(128,128,128,.28)}
.bars i.on{background:currentColor}
.stop{position:absolute;top:20px;inset-inline:8px;display:flex;align-items:center;justify-content:space-between;z-index:6;font-family:'Readex Pro';font-size:13px;padding-top:4px}
.stop button{width:42px;height:42px;display:grid;place-items:center;border-radius:12px}
.card{position:absolute;inset:0;padding:84px 26px 112px;display:flex;flex-direction:column;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.card.on{opacity:1;pointer-events:auto}
.lab{font-family:'Readex Pro';font-size:12px;letter-spacing:.6px;opacity:.65;margin-bottom:14px;display:flex;gap:10px;align-items:center}
.lab:before{content:"";width:22px;height:1px;background:currentColor;opacity:.6}
.card h1{font-family:'Noto Naskh Arabic';font-weight:700;font-size:40px;line-height:1.3;margin:0}
.card h2{font-family:'Noto Naskh Arabic';font-weight:700;font-size:28px;line-height:1.4;margin:0 0 18px}
.card p{font-size:18px;line-height:1.85;margin:0}
.card ol{list-style:none;padding:0;margin:0;counter-reset:k}
.card ol li{counter-increment:k;display:flex;gap:16px;padding:14px 0;border-top:1px solid rgba(128,128,128,.25);font-size:17px;line-height:1.7}
.card ol li:before{content:counter(k, arabic-indic);font-family:'Readex Pro';font-size:14px;opacity:.55;width:14px;flex:none;padding-top:3px}
.q{font-family:'Noto Naskh Arabic';font-size:28px;line-height:1.95;quotes:none;display:block}
.ref{font-family:'Readex Pro';font-size:13px;opacity:.7;margin-top:14px;display:block}
.btn{margin-top:24px;align-self:flex-start;height:48px;padding:0 22px;border-radius:12px;font-family:'Readex Pro';font-weight:500;font-size:15px;display:inline-flex;align-items:center;gap:10px}
.more{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);z-index:7;height:44px;padding:0 18px;border-radius:12px;font-family:'Readex Pro';font-size:14px;display:flex;align-items:center;gap:8px;white-space:nowrap;border:1px solid currentColor;opacity:.85}
.tz{position:absolute;top:76px;bottom:90px;width:26%;z-index:4}
.tz.r{right:0}.tz.l{left:0}
.smap{border-radius:14px;overflow:hidden;margin:2px 0 12px;height:240px;border:1px solid rgba(255,255,255,.12)}
.smap svg{width:100%;height:100%}
.legend{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px 10px;font-size:13.5px;opacity:.85}
.legend b{font-family:'Readex Pro';font-weight:500;margin-inline-end:4px}
.ppl{display:flex;flex-direction:column;gap:0}
.pr{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid rgba(128,128,128,.25);text-align:start;width:100%}
.pr .av{width:54px;height:54px;border-radius:50%;flex:none;overflow:hidden;background:#2b2e36;display:grid;place-items:center;font-family:'Noto Naskh Arabic';font-size:24px;color:var(--gold2);border:1px solid var(--gold)}
.pr .av img{width:100%;height:100%;object-fit:cover}
.pr b{display:block;font-family:'Readex Pro';font-weight:500;font-size:17px}
.pr small{font-size:14px;opacity:.7}
.pr .ic{margin-inline-start:auto;opacity:.5}
.thread .bx{border-radius:12px;padding:14px 16px}
.thread small{display:block;font-family:'Readex Pro';font-size:12px;opacity:.7;margin-bottom:6px;letter-spacing:.3px}
.thread .s{font-family:'Noto Naskh Arabic';font-size:20px;line-height:1.8}
.thread .ln{height:40px;display:flex;align-items:center;gap:10px;padding-inline-start:16px;font-family:'Readex Pro';font-size:12px;color:var(--gold2)}
.thread .ln:before{content:"";width:1px;height:100%;background:var(--gold)}
.thread mark{background:none;color:var(--gold2);border-bottom:1px solid var(--gold)}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(10,12,18,.42);z-index:40;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;inset-inline:0;bottom:0;z-index:41;background:var(--paper);border-radius:20px 20px 0 0;max-height:86%;overflow:auto;transform:translateY(105%);transition:transform .28s ease;padding:10px 22px 34px}
.sheet.on{transform:none}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}
.sheet h3{font-family:'Noto Naskh Arabic';font-weight:700;font-size:22px;margin:0 0 2px}
.sheet .sub{color:var(--faint);font-size:13.5px;margin:0 0 14px;font-family:'Readex Pro'}
.sheet p{margin:0 0 10px;font-size:16.5px;line-height:1.85}
.en{padding:13px 0;border-top:1px solid var(--line)}
.en b{display:block;font-family:'Readex Pro';font-weight:500;font-size:15.5px}
.en p{margin:3px 0 0 !important;color:#4d4a44;font-size:15.5px !important}
.orig{font-family:'Noto Naskh Arabic';color:var(--gold);font-weight:400}
.tg{display:inline-block;font-family:'Readex Pro';font-size:11.5px;border:1px solid currentColor;border-radius:6px;padding:0 8px;margin-bottom:4px}
.tg.agreed{color:#3E7A5A}.tg.debated{color:#9A6A12}
.menu .row{padding:15px 0}
.menu .row .ic{color:var(--soft)}
.menu .row .t{font-family:'Readex Pro';font-size:16px}
.back{font-family:'Readex Pro';font-size:13.5px;color:var(--accent);display:inline-flex;align-items:center;gap:4px;margin-bottom:10px}

/* reader */
.reader{position:absolute;inset:0;z-index:35;background:var(--paper);overflow:auto;transform:translateY(100%);transition:transform .3s}
.reader.on{transform:none}
.rh{position:sticky;top:0;display:flex;align-items:center;height:56px;padding:0 10px 0 16px;background:rgba(250,248,244,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);font-family:'Readex Pro';font-weight:500;font-size:16px;z-index:2}
.rh span{flex:1}
.rh button{width:42px;height:42px;display:grid;place-items:center}
.rbody{padding:6px 24px 60px}
.peri{font-family:'Readex Pro';font-weight:500;font-size:14.5px;color:var(--accent);margin:28px 0 4px}
.scr{font-family:'Noto Naskh Arabic';font-size:21px;line-height:2.15}
.scr p{margin:0}
.vn{font-family:'Readex Pro';font-size:.52em;color:var(--gold);vertical-align:super;margin:0 2px}
.key{border-bottom:1.5px solid var(--accent)}

/* ---------- PERSON CARD ---------- */
#viewer{position:absolute;inset:0;z-index:50;background:#121318;display:none;flex-direction:column;color:#fff}
#viewer.on{display:flex}
.vtop{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 0;font-family:'Readex Pro';font-size:13px;color:#9a978f}
.vtop button{width:44px;height:44px;display:grid;place-items:center;color:#fff}
.stage{flex:1;display:flex;align-items:center;justify-content:center;perspective:1400px;padding:6px 0;touch-action:pan-y}
.pcard{width:min(84vw,336px);aspect-ratio:63/92;border-radius:16px;background:#1b1d23;padding:9px;box-shadow:0 30px 60px rgba(0,0,0,.5),0 0 0 1px rgba(215,196,154,.25) inset;transition:transform .32s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d;position:relative}
.pin{position:absolute;inset:9px;border-radius:10px;background:var(--paper);color:var(--ink);overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--gold)}
.ph{display:flex;align-items:baseline;justify-content:space-between;padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.ph b{font-family:'Noto Naskh Arabic';font-weight:700;font-size:23px;line-height:1.2}
.ph small{font-family:'Readex Pro';font-size:11px;color:var(--soft)}
.portrait{position:relative;margin:8px 8px 0;flex:1;min-height:0;border-radius:6px;overflow:hidden;background:linear-gradient(160deg,#3a3630,#1e1c19);display:grid;place-items:center}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.portrait .mono{font-family:'Noto Naskh Arabic';font-size:110px;color:rgba(215,196,154,.32);line-height:1}
.portrait .add{position:absolute;bottom:8px;left:8px;font-family:'Readex Pro';font-size:11px;background:rgba(0,0,0,.45);color:#fff;padding:5px 10px;border-radius:6px;display:flex;gap:6px;align-items:center}
.portrait .era{position:absolute;top:8px;right:8px;font-family:'Readex Pro';font-size:10.5px;background:rgba(250,248,244,.9);color:var(--ink);padding:3px 8px;border-radius:5px}
.portrait:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 0 -60px 60px -30px rgba(0,0,0,.35);pointer-events:none}
.role{padding:10px 12px 0}
.role .r{font-family:'Readex Pro';font-weight:500;font-size:12px;color:var(--accent);letter-spacing:.3px}
.role p{margin:3px 0 0;font-size:14px;line-height:1.65;color:#3b3934}
.cells{display:grid;grid-template-columns:repeat(3,1fr);margin:10px 12px 0;border-top:1px solid var(--line)}
.cells div{padding:8px 4px 0;text-align:center;border-inline-start:1px solid var(--line);line-height:1.35}
.cells div:first-child{border-inline-start:0}
.cells small{display:block;font-family:'Readex Pro';font-size:9.5px;color:var(--faint);letter-spacing:.3px}
.cells b{display:block;font-family:'Readex Pro';font-weight:500;font-size:12.5px;margin-top:2px}
.pf{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 9px;margin-top:auto;font-family:'Readex Pro';font-size:9.5px;color:var(--faint)}
.face{padding:0 14px;flex:1;overflow:hidden;display:flex;flex-direction:column}
.face h4{font-family:'Readex Pro';font-weight:500;font-size:11px;color:var(--accent);letter-spacing:.4px;margin:12px 0 6px}
.kv{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.55}
.kv span{width:76px;flex:none;font-family:'Readex Pro';font-size:11.5px;color:var(--faint);padding-top:2px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.duo div{border:1px solid var(--line);border-radius:6px;padding:8px;font-size:12.5px;line-height:1.55}
.duo small{display:block;font-family:'Readex Pro';font-size:10px;color:var(--faint);margin-bottom:2px}
.tl div{display:flex;gap:10px;padding:5px 0;font-size:13.5px;line-height:1.5;border-bottom:1px solid var(--line)}
.tl span{font-family:'Readex Pro';font-size:11px;color:var(--gold);width:58px;flex:none;padding-top:2px}
.nts{display:flex;flex-wrap:wrap;gap:6px}
.nts span{font-family:'Readex Pro';font-size:11.5px;border:1px solid var(--line);border-radius:5px;padding:2px 8px}
.cx{margin-top:10px;background:var(--ink);color:#fff;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.7}
.cx small{display:block;font-family:'Readex Pro';font-size:10px;color:var(--gold2);letter-spacing:.4px;margin-bottom:2px}
.dots{display:flex;justify-content:center;align-items:center;gap:14px;padding:4px 0 2px;font-family:'Readex Pro';font-size:12.5px;color:#8d8a83}
.dots i{width:6px;height:6px;border-radius:50%;background:#45474d}
.dots i.on{background:var(--gold2);width:18px;border-radius:3px}
.hint{text-align:center;font-family:'Readex Pro';font-size:12px;color:#77756f;padding:2px 0 8px}
.who{display:flex;gap:8px;justify-content:center;padding:4px 16px 18px}
.who button{font-family:'Readex Pro';font-size:13px;height:36px;padding:0 14px;border-radius:10px;border:1px solid #33353b;color:#bdb9b0}
.who button[aria-pressed=true]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.full{display:block;margin:0 auto 14px;font-family:'Readex Pro';font-size:13px;color:var(--gold2);border-bottom:1px solid var(--gold);padding-bottom:2px}

/* people & maps views */
.vh{padding:30px 22px 10px}
.vh .ey{font-family:'Readex Pro';font-size:12.5px;color:var(--accent);letter-spacing:.4px}
.vh h1{font-family:'Noto Naskh Arabic';font-weight:700;font-size:34px;margin:4px 0 6px}
.vh p{margin:0;color:var(--soft);font-size:15.5px;line-height:1.75}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px 22px 30px}
.mini{border-radius:10px;background:#1b1d23;padding:5px;text-align:start}
.mini .in{background:var(--paper);border-radius:6px;overflow:hidden;border:1px solid var(--gold)}
.mini .im{aspect-ratio:4/4.4;background:linear-gradient(160deg,#3a3630,#1e1c19);display:grid;place-items:center;position:relative}
.mini .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mini .im span{font-family:'Noto Naskh Arabic';font-size:52px;color:rgba(215,196,154,.32)}
.mini .tx{padding:8px 10px 10px}
.mini b{display:block;font-family:'Noto Naskh Arabic';font-weight:700;font-size:17px;line-height:1.3}
.mini small{font-family:'Readex Pro';font-size:11px;color:var(--soft)}
.mini.off{opacity:.45}
.mlist{padding:8px 22px 30px}
.mrow{display:block;width:100%;text-align:start;margin-top:14px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.mrow .mv{height:150px;background:var(--navy)}
.mrow .mv svg{width:100%;height:100%}
.mrow .mt{padding:12px 14px;display:flex;justify-content:space-between;align-items:baseline}
.mrow b{font-family:'Readex Pro';font-weight:500;font-size:16px}
.mrow small{font-family:'Readex Pro';font-size:12px;color:var(--faint)}
.mrow.off .mv{background:var(--cream)}
#mapfull{position:absolute;inset:0;z-index:45;background:#EFE6D3;display:none}
#mapfull.on{display:block}
#mapfull .mf{position:absolute;inset:0 0 160px 0}
#mapfull .mf svg{width:100%;height:100%}
#mapfull .mtop{position:absolute;top:10px;inset-inline:10px;display:flex;align-items:center;background:var(--paper);border-radius:12px;padding:4px;z-index:2;border:1px solid var(--line)}
#mapfull .mtop b{flex:1;text-align:center;font-family:'Readex Pro';font-weight:500;font-size:15px}
#mapfull .mtop button{width:42px;height:42px;display:grid;place-items:center}
#mapfull .minfo{position:absolute;bottom:0;inset-inline:0;height:160px;background:var(--paper);border-top:1px solid var(--line);padding:16px 22px;overflow:auto}
#mapfull .minfo b{font-family:'Noto Naskh Arabic';font-weight:700;font-size:20px}
#mapfull .minfo p{margin:4px 0 0;color:#4d4a44;font-size:15px;line-height:1.75}
.toast{position:absolute;bottom:84px;left:50%;transform:translateX(-50%) translateY(14px);z-index:90;background:var(--ink);color:#fff;font-family:'Readex Pro';font-size:13.5px;padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div id="shell">
  <section class="view on" id="v-book"></section>
  <section class="view" id="v-people"></section>
  <section class="view" id="v-maps"></section>
  <nav id="nav">
    <button data-v="book" aria-current="true"><svg class="ic" viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H19v15H5.5A1.5 1.5 0 0 0 4 20.5zM4 20.5V5.5"/></svg>الكتاب</button>
    <button data-v="people" aria-current="false"><svg class="ic" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="2"/><circle cx="12" cy="10" r="2.6"/><path d="M8.5 16c.6-1.6 2-2.4 3.5-2.4s2.9.8 3.5 2.4"/></svg>الشخصيات</button>
    <button data-v="maps" aria-current="false"><svg class="ic" viewBox="0 0 24 24"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>الخرائط</button>
  </nav>
  <div id="story"></div>
  <div class="reader" id="reader"></div>
  <div id="viewer"></div>
  <div id="mapfull"></div>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet"></div>
  <div class="toast" id="toast"></div>
  <input type="file" id="file" accept="image/*" hidden>
</div>
<script>
const D = {"ch":{"title":"دعوة أبرام والوعد","section":"إبراهيم (11: 27 – 25: 18)","where":"نقطة تحول في الكتاب كله. بعد أحد عشر أصحاحاً عن البشرية كلها وفشلها المتكرر، يتكلم الله إلى رجل واحد: «اذهب من أرضك ومن عشيرتك ومن بيت أبيك إلى الأرض التي أريك». ومعها سبعة وعود: «فأجعلك أمة عظيمة، وأباركك، وأعظم اسمك، وتكون بركة. وأبارك مباركيك، ولاعنك ألعنه، وتتبارك فيك جميع قبائل الأرض». فذهب أبرام «كما قال له الرب»، وهو ابن خمس وسبعين سنة، مع ساراي ولوط. وصل إلى شكيم في كنعان، فظهر له الرب وقال: «لنسلك أعطي هذه الأرض»، فبنى مذبحاً. ثم إلى بيت إيل، فبنى مذبحاً آخر و«دعا باسم الرب». لكن جاء جوع، فنزل أبرام إلى مصر. وهناك خاف على حياته لأن ساراي جميلة، فطلب منها أن تقول إنها أخته. فأُخذت إلى بيت فرعون! لكن الرب ضرب فرعون وبيته بضربات عظيمة، ففهم فرعون الحقيقة ووبخ أبرام وأخرجه. رجل الإيمان العظيم يسقط في أول اختبار.","before":"الأصحاح الحادي عشر: برج بابل، ونسب سام حتى أبرام، وساراي العاقر.","after":"الأصحاح الثالث عشر: أبرام ولوط يفترقان.","pericopes":[{"at":1,"t":"الدعوة والوعود"},{"at":4,"t":"الطاعة والرحيل"},{"at":6,"t":"شكيم: لنسلك أعطي هذه الأرض"},{"at":8,"t":"بيت إيل: دعا باسم الرب"},{"at":10,"t":"النزول إلى مصر"},{"at":14,"t":"ساراي في بيت فرعون"},{"at":17,"t":"الرب يحمي ساراي"}],"outline":[{"r":"1","t":"وقال الرب لأبرام: اذهب من أرضك ومن عشيرتك ومن بيت أبيك إلى الأرض التي أريك"},{"r":"2-3","t":"فأجعلك أمة عظيمة وأباركك وأعظم اسمك، وتكون بركة. وأبارك مباركيك، ولاعنك ألعنه. وتتبارك فيك جميع قبائل الأرض"},{"r":"4-5","t":"فذهب أبرام كما قال له الرب، وذهب معه لوط. وكان أبرام ابن خمس وسبعين سنة لما خرج من حاران... وخرجوا ليذهبوا إلى أرض كنعان. فأتوا إلى أرض كنعان"},{"r":"6-7","t":"واجتاز أبرام في الأرض إلى مكان شكيم إلى بلوطة مورة. وكان الكنعانيون حينئذ في الأرض. وظهر الرب لأبرام وقال: لنسلك أعطي هذه الأرض. فبنى هناك مذبحاً للرب الذي ظهر له"},{"r":"8-9","t":"ثم نقل من هناك إلى الجبل شرقي بيت إيل ونصب خيمته... فبنى هناك مذبحاً للرب ودعا باسم الرب. ثم ارتحل أبرام ارتحالاً متوالياً نحو الجنوب"},{"r":"10-13","t":"وحدث جوع في الأرض، فانحدر أبرام إلى مصر ليتغرب هناك... وقال لساراي امرأته: إني قد علمت أنك امرأة حسنة المنظر... فيقتلونني ويستبقونك. قولي إنك أختي، ليكون لي خير بسببك وتحيا نفسي من أجلك"},{"r":"14-16","t":"فحدث لما دخل أبرام إلى مصر أن المصريين رأوا المرأة أنها حسنة جداً... فأُخذت المرأة إلى بيت فرعون. فصنع إلى أبرام خيراً بسببها، وصار له غنم وبقر وحمير وعبيد وإماء وأتن وجمال"},{"r":"17-20","t":"فضرب الرب فرعون وبيته ضربات عظيمة بسبب ساراي امرأة أبرام. فدعا فرعون أبرام وقال: ما هذا الذي صنعت بي؟ لماذا لم تخبرني أنها امرأتك؟... والآن هوذا امرأتك، خذها واذهب! فأوصى عليه فرعون رجالاً فشيعوه وامرأته وكل ما كان له"}],"keyVerse":"Gen.12.3","people":[{"n":"أبرام","d":"ابن 75 سنة، من عائلة وثنية (يش 24: 2)، بلا أولاد. الله يختاره بنعمة مطلقة، لا لفضل فيه. يطيع بإيمان (عب 11: 8)، لكنه يسقط في الخوف والكذب في مصر."},{"n":"ساراي","d":"جميلة جداً رغم أنها في الستين أو أكثر. ضحية خوف زوجها. والله يحميها لأنها أم النسل الموعود."},{"n":"لوط","d":"ابن أخي أبرام، يرافقه. سيصير لاحقاً سبب مشكلة."},{"n":"فرعون","d":"لقب ملك مصر («البيت العظيم»). لا يُذكر اسمه. المفارقة: الوثني يتصرف بنزاهة أكثر من رجل الإيمان، ويوبخه."}],"places":[{"n":"حاران","d":"نقطة الانطلاق، في شمال بلاد الرافدين. نحو 650 كم إلى كنعان."},{"n":"شكيم","d":"مدينة في وسط كنعان، بين جبلي عيبال وجرزيم (نابلس اليوم). أول مكان يصل إليه أبرام ويبني فيه مذبحاً. وفيها سيجدد يشوع العهد (يش 24)، وقربها بئر يعقوب حيث تكلم يسوع مع السامرية (يو 4)."},{"n":"بيت إيل","d":"«بيت الله»، شمال أورشليم. فيها سيرى يعقوب السلم (28: 19)."},{"n":"النقب","d":"«الجنوب»، المنطقة الصحراوية جنوب كنعان."},{"n":"مصر","d":"ملجأ تقليدي وقت الجوع بسبب النيل. وسيتكرر النزول إلى مصر مع يعقوب وأبنائه."}],"summary":["وقال الرب لأبرام: اذهب من أرضك ومن عشيرتك ومن بيت أبيك إلى الأرض التي أريك. فأجعلك أمة عظيمة وأباركك وأعظم اسمك، وتكون بركة. وأبارك مباركيك، ولاعنك ألعنه. وتتبارك فيك جميع قبائل الأرض.","فذهب أبرام كما قال له الرب، وذهب معه لوط. وكان أبرام ابن خمس وسبعين سنة لما خرج من حاران. فأخذ أبرام ساراي امرأته، ولوطاً ابن أخيه، وكل مقتنياتهما التي اقتنيا والنفوس التي امتلكا في حاران. وخرجوا ليذهبوا إلى أرض كنعان. فأتوا إلى أرض كنعان. واجتاز أبرام في الأرض إلى مكان شكيم إلى بلوطة مورة. وكان الكنعانيون حينئذ في الأرض. وظهر الرب لأبرام وقال: لنسلك أعطي هذه الأرض. فبنى هناك مذبحاً للرب الذي ظهر له. ثم نقل من هناك إلى الجبل شرقي بيت إيل ونصب خيمته... فبنى هناك مذبحاً للرب ودعا باسم الرب.","وحدث جوع في الأرض، فانحدر أبرام إلى مصر ليتغرب هناك، لأن الجوع في الأرض كان شديداً. وحدث لما قرب أن يدخل مصر أنه قال لساراي امرأته: إني قد علمت أنك امرأة حسنة المنظر. فيكون إذا رآك المصريون أنهم يقولون: هذه امرأته. فيقتلونني ويستبقونك. قولي إنك أختي، ليكون لي خير بسببك وتحيا نفسي من أجلك. فحدث لما دخل أبرام إلى مصر أن المصريين رأوا المرأة أنها حسنة جداً. ورآها رؤساء فرعون ومدحوها لدى فرعون، فأُخذت المرأة إلى بيت فرعون. فصنع إلى أبرام خيراً بسببها.","فضرب الرب فرعون وبيته ضربات عظيمة بسبب ساراي امرأة أبرام. فدعا فرعون أبرام وقال: ما هذا الذي صنعت بي؟ لماذا لم تخبرني أنها امرأتك؟ لماذا قلت هي أختي، حتى أخذتها لي لتكون زوجتي؟ والآن هوذا امرأتك، خذها واذهب! فأوصى عليه فرعون رجالاً فشيعوه وامرأته وكل ما كان له."],"background":[{"t":"الترك المضاعف","d":"الدعوة تطلب ترك ثلاث دوائر متزايدة القرب: «أرضك» (الوطن)، و«عشيرتك» (القبيلة)، و«بيت أبيك» (العائلة). في العالم القديم، هذه كانت الهوية والأمان والميراث. وفي المقابل، الوجهة غير محددة: «الأرض التي أريك». إيمان حقيقي: «خرج وهو لا يعلم إلى أين يأتي» (عب 11: 8)."},{"t":"خمس بركات مقابل خمس لعنات","d":"كلمة «بارك» تتكرر خمس مرات في 12: 2–3، كأنها رد على كلمة «لعن» التي ظهرت خمس مرات في 1–11 (3: 14، 17؛ 4: 11؛ 5: 29؛ 9: 25). الله يبدأ مشروع إلغاء اللعنة من خلال أبرام."},{"t":"المذابح","d":"أبرام لم يبنِ مدناً بل مذابح. أينما ذهب، أعلن ملكية الرب للأرض بالعبادة. والكنعانيون ما زالوا هناك: أبرام يملك الأرض بالوعد فقط، لا بالواقع."}],"words":[{"w":"اذهب","orig":"לֶךְ־לְךָ (لِخ لِخا)","d":"حرفياً «اذهب لنفسك». نفس التعبير سيتكرر في 22: 2 («اذهب إلى أرض المريا»): أول وآخر اختبار لإيمان إبراهيم."},{"w":"بارك / بركة","orig":"בָּרַךְ (بارك)","d":"منح الحياة والازدهار والخير من الله. ونقيضها «لعن» (أرار)."},{"w":"قبائل","orig":"מִשְׁפְּחֹת (مشبحوت)","d":"عشائر، عائلات. نفس الكلمة في جدول الأمم (10: 5، 32). البركة لكل «عشيرة» تفرقت في بابل."},{"w":"نسل","orig":"זֶרַע (زرع)","d":"بذرة، ذرية. مفرد بصيغته، ويُستخدم للجمع والمفرد. بولس يرى فيه إشارة للمسيح (غل 3: 16)."},{"w":"دعا باسم الرب","orig":"קָרָא בְּשֵׁם יְהוָה (قارا بشيم يهوه)","d":"عبادة علنية وصلاة. نفس التعبير في 4: 26. أبرام يمجد «اسم» الرب بدل أن «يصنع لنفسه اسماً» كبناة بابل."}],"otQuotes":[],"links":[{"ref":"Gal.3.8","d":"والكتاب إذ سبق فرأى أن الله بالإيمان يبرر الأمم، سبق فبشر إبراهيم أن فيك تتبارك جميع الأمم.","label":"غلاطية ٣: ٨"},{"ref":"Gal.3.16","d":"وأما المواعيد فقيلت في إبراهيم وفي نسله. لا يقول: وفي الأنسال كأنه عن كثيرين، بل كأنه عن واحد: وفي نسلك الذي هو المسيح.","label":"غلاطية ٣: ١٦"},{"ref":"Heb.11.8","d":"بالإيمان إبراهيم لما دعي أطاع أن يخرج إلى المكان الذي كان عتيداً أن يأخذه ميراثاً، فخرج وهو لا يعلم إلى أين يأتي.","label":"العبرانيين ١١: ٨"},{"ref":"Acts.3.25-26","d":"أنتم أبناء الأنبياء والعهد... قائلاً لإبراهيم: وبنسلك تتبارك جميع قبائل الأرض. إليكم أولاً، إذ أقام الله فتاه يسوع، أرسله يبارككم.","label":"أعمال الرسل ٣: ٢٥–٢٦"},{"ref":"Rom.4.13","d":"فإنه ليس بالناموس كان الوعد لإبراهيم أو لنسله أن يكون وارثاً للعالم، بل ببر الإيمان.","label":"رومية ٤: ١٣"},{"ref":"Josh.24.2-3","d":"تارح أبو إبراهيم... وعبدوا آلهة أخرى. فأخذت إبراهيم أباكم من عبر النهر.","label":"يشوع ٢٤: ٢–٣"},{"ref":"Gen.20.2","d":"وقال إبراهيم عن سارة امرأته: هي أختي. فأرسل أبيمالك ملك جرار وأخذ سارة.","label":"التكوين ٢٠: ٢"}],"christ":["الوعد «تتبارك فيك جميع قبائل الأرض» هو، كما يقول بولس، «الإنجيل» المبشر به مسبقاً لإبراهيم (غل 3: 8). البركة لكل الأمم تأتي من خلال «النسل» الواحد، المسيح (غل 3: 16). ففي المسيح تُرفع اللعنة: \"المسيح افتدانا من لعنة الناموس، إذ صار لعنة لأجلنا... لتصير بركة إبراهيم للأمم في المسيح يسوع\" (غل 3: 13–14). كل مؤمن من كل أمة هو ابن لإبراهيم بالإيمان (غل 3: 7، 29).","وأبرام يترك وطنه وبيت أبيه طاعة لله، لكن المسيح ترك أكثر بكثير: مجد السماء وحضن الآب (في 2: 6–7). وحيث فشل أبرام في مصر (خاف وكذب ليحمي نفسه وعرض زوجته للخطر)، المسيح العريس الحقيقي بذل نفسه ليحمي عروسه، الكنيسة (أف 5: 25)."],"hard":[{"q":"هل كذب أبرام حين قال إن ساراي أخته؟","tag":"agreed","a":["نصف حقيقة: ساراي كانت أخته غير الشقيقة فعلاً (ابنة أبيه لا ابنة أمه، 20: 12). لكن قصده كان الخداع: إخفاء أنها زوجته. ونصف الحقيقة المقصود به الخداع كذب. والنص لا يبرره: فرعون الوثني يوبخه («ما هذا الذي صنعت بي؟»)، وأبرام صامت بلا جواب. الكتاب صادق في عرض خطايا أبطاله. والأهم: الله يبقى أميناً لوعده رغم عدم أمانة أبرام."]},{"q":"لماذا عاقب الله فرعون وهو لم يعرف أنها متزوجة؟","tag":"debated","a":["الضربات لم تكن بالضرورة عقاباً أخلاقياً لفرعون بقدر ما كانت تدخلاً إلهياً لحماية ساراي، أم النسل الموعود. الله يحمي خطته الفدائية مهما كلف الأمر. ومع ذلك، أخذ فرعون للنساء لقصره بالقوة لم يكن بريئاً. والضربات جعلت فرعون يكتشف الحقيقة. وهي تمهيد لضربات مصر في الخروج: الله يحمي شعبه من فرعون ويُخرجهم بغنى."]},{"q":"هل وعد «أبارك مباركيك ولاعنك ألعنه» ينطبق على دولة إسرائيل الحديثة؟","tag":"debated","a":["هذا موضوع اختلاف بين التقليدين. التدبيريون عادة يرون أن الوعد يمتد لإسرائيل العرقية والدولة الحديثة، فيدعو بعضهم لدعم سياسي لها. والتقليد المصلح (العهدي) يرى أن الوعد يتحقق في المسيح «نسل إبراهيم» الحقيقي (غل 3: 16)، وفي كل من هو «في المسيح» من اليهود والأمم (غل 3: 29). والموقف من المسيح هو الذي يحدد البركة واللعنة. وكلا الطرفين يتفق على محبة الشعب اليهودي والصلاة لخلاصه (رو 10: 1)، ورفض معاداة السامية. وسيأتي النقاش الكامل حول وعد الأرض في الأصحاح 15."]}],"voices":[{"n":"جون كالفن","y":"1509–1564","w":"تفسير سفر التكوين (1554)","b":"يؤكد أن دعوة أبرام نعمة مجانية: الله اختار رجلاً من عائلة وثنية، لا لفضل فيه. ويقول عن سقوطه في مصر إن الله يُظهر ضعف قديسيه لكي لا نعتمد على البشر، بل نتعلم أن الخلاص كله من نعمة الله."},{"n":"جيمس مونتجمري بويس","y":"1938–2000","w":"التكوين: تفسير عرضي (1982–1987)","b":"يلاحظ أن أبرام في الإيمان بنى مذابح، وفي الخوف لم يبنِ مذبحاً في مصر. حين يغيب المذبح، تبدأ الحلول البشرية والكذب. ويرى أن القصة تُظهر أن الوعد يعتمد على أمانة الله لا على أمانة أبرام."},{"n":"بروس والتكي","y":"1930–","w":"التكوين: تفسير (2001)","b":"يرى في 12: 1–3 المحور الذي يدور عليه التكوين كله، بل الكتاب كله: الله يعلن خطته لاستعادة البركة لكل الأمم من خلال نسل إبراهيم. والقصص التالية تختبر: هل سيثق إبراهيم في الوعد؟ وهل سيحفظ الله وعده رغم العوائق؟"}],"questions":["ما \"أرضك وعشيرتك وبيت أبيك\" التي قد يطلب الله منك تركها؟","هل تقدر أن تطيع الله حتى لو لم تعرف «إلى أين»؟","كيف تشعر حين تعرف أن البركة التي وعد بها إبراهيم صارت لك في المسيح (غل 3: 29)؟","ماذا يعلمك أن أبرام لم يبنِ مذبحاً في مصر؟ هل تهمل الصلاة حين تكون خائفاً؟","هل تستخدم «أنصاف الحقائق» لتحمي نفسك؟","هل أنت «بركة» للآخرين من حولك كما دُعي أبرام؟"],"apply":"اكتب على ورقة: \"في المسيح، أنا ابن لإبراهيم ووارث للوعد\" (غل 3: 29). ثم فكر في موقف هذا الأسبوع تميل فيه لحماية نفسك بنصف حقيقة أو بالخوف. قرر أن تقول الحق كاملاً وتثق في حماية الله. وابحث عن طريقة عملية لتكون «بركة» لشخص واحد من غير عائلتك.","keyVerseText":"وَأُبَارِكُ مُبَارِكِيكَ، وَلَاعِنَكَ أَلْعَنُهُ. وَتَتَبَارَكُ فِيكَ جَمِيعُ قَبَائِلِ ٱلْأَرْضِ».","keyVerseLabel":"التكوين ١٢: ٣"},"text":[{"number":1,"text":"وَقَالَ ٱلرَّبُّ لِأَبْرَامَ: «ٱذْهَبْ مِنْ أَرْضِكَ وَمِنْ عَشِيرَتِكَ وَمِنْ بَيْتِ أَبِيكَ إِلَى ٱلْأَرْضِ ٱلَّتِي أُرِيكَ."},{"number":2,"text":"فَأَجْعَلَكَ أُمَّةً عَظِيمَةً وَأُبَارِكَكَ وَأُعَظِّمَ ٱسْمَكَ، وَتَكُونَ بَرَكَةً."},{"number":3,"text":"وَأُبَارِكُ مُبَارِكِيكَ، وَلَاعِنَكَ أَلْعَنُهُ. وَتَتَبَارَكُ فِيكَ جَمِيعُ قَبَائِلِ ٱلْأَرْضِ»."},{"number":4,"text":"فَذَهَبَ أَبْرَامُ كَمَا قَالَ لَهُ ٱلرَّبُّ وَذَهَبَ مَعَهُ لُوطٌ. وَكَانَ أَبْرَامُ ٱبْنَ خَمْسٍ وَسَبْعِينَ سَنَةً لَمَّا خَرَجَ مِنْ حَارَانَ."},{"number":5,"text":"فَأَخَذَ أَبْرَامُ سَارَايَ ٱمْرَأَتَهُ، وَلُوطًا ٱبْنَ أَخِيهِ، وَكُلَّ مُقْتَنَيَاتِهِمَا ٱلَّتِي ٱقْتَنَيَا وَٱلنُّفُوسَ ٱلَّتِي ٱمْتَلَكَا فِي حَارَانَ. وَخَرَجُوا لِيَذْهَبُوا إِلَى أَرْضِ كَنْعَانَ. فَأَتَوْا إِلَى أَرْضِ كَنْعَانَ."},{"number":6,"text":"وَٱجْتَازَ أَبْرَامُ فِي ٱلْأَرْضِ إِلَى مَكَانِ شَكِيمَ إِلَى بَلُّوطَةِ مُورَةَ. وَكَانَ ٱلْكَنْعَانِيُّونَ حِينَئِذٍ فِي ٱلْأَرْضِ."},{"number":7,"text":"وَظَهَرَ ٱلرَّبُّ لِأَبْرَامَ وَقَالَ: «لِنَسْلِكَ أُعْطِي هَذِهِ ٱلْأَرْضَ». فَبَنَى هُنَاكَ مَذْبَحًا لِلرَّبِّ ٱلَّذِي ظَهَرَ لَهُ."},{"number":8,"text":"ثُمَّ نَقَلَ مِنْ هُنَاكَ إِلَى ٱلْجَبَلِ شَرْقِيَّ بَيْتِ إِيلٍ وَنَصَبَ خَيْمَتَهُ. وَلَهُ بَيْتُ إِيلَ مِنَ ٱلْمَغْرِبِ وَعَايُ مِنَ ٱلْمَشْرِقِ. فَبَنَى هُنَاكَ مَذْبَحًا لِلرَّبِّ وَدَعَا بِٱسْمِ ٱلرَّبِّ."},{"number":9,"text":"ثُمَّ ٱرْتَحَلَ أَبْرَامُ ٱرْتِحَالًا مُتَوَالِيًا نَحْوَ ٱلْجَنُوبِ."},{"number":10,"text":"وَحَدَثَ جُوعٌ فِي ٱلْأَرْضِ، فَٱنْحَدَرَ أَبْرَامُ إِلَى مِصْرَ لِيَتَغَرَّبَ هُنَاكَ، لِأَنَّ ٱلْجُوعَ فِي ٱلْأَرْضِ كَانَ شَدِيدًا."},{"number":11,"text":"وَحَدَثَ لَمَّا قَرُبَ أَنْ يَدْخُلَ مِصْرَ أَنَّهُ قَالَ لِسَارَايَ ٱمْرَأَتِهِ: «إِنِّي قَدْ عَلِمْتُ أَنَّكِ ٱمْرَأَةٌ حَسَنَةُ ٱلْمَنْظَرِ."},{"number":12,"text":"فَيَكُونُ إِذَا رَآكِ ٱلْمِصْرِيُّونَ أَنَّهُمْ يَقُولُونَ: هَذِهِ ٱمْرَأَتُهُ. فَيَقْتُلُونَنِي وَيَسْتَبْقُونَكِ."},{"number":13,"text":"قُولِي إِنَّكِ أُخْتِي، لِيَكُونَ لِي خَيْرٌ بِسَبَبِكِ وَتَحْيَا نَفْسِي مِنْ أَجْلِكِ»."},{"number":14,"text":"فَحَدَثَ لَمَّا دَخَلَ أَبْرَامُ إِلَى مِصْرَ أَنَّ ٱلْمِصْرِيِّينَ رَأَوْا ٱلْمَرْأَةَ أَنَّهَا حَسَنَةٌ جِدًّا."},{"number":15,"text":"وَرَآهَا رُؤَسَاءُ فِرْعَوْنَ وَمَدَحُوهَا لَدَى فِرْعَوْنَ، فَأُخِذَتِ ٱلْمَرْأَةُ إِلَى بَيْتِ فِرْعَوْنَ،"},{"number":16,"text":"فَصَنَعَ إِلَى أَبْرَامَ خَيْرًا بِسَبَبِهَا، وَصَارَ لَهُ غَنَمٌ وَبَقَرٌ وَحَمِيرٌ وَعَبِيدٌ وَإِمَاءٌ وَأُتُنٌ وَجِمَالٌ."},{"number":17,"text":"فَضَرَبَ ٱلرَّبُّ فِرْعَوْنَ وَبَيْتَهُ ضَرَبَاتٍ عَظِيمَةً بِسَبَبِ سَارَايَ ٱمْرَأَةِ أَبْرَامَ."},{"number":18,"text":"فَدَعَا فِرْعَوْنُ أَبْرَامَ وَقَالَ: «مَا هَذَا ٱلَّذِي صَنَعْتَ بِي؟ لِمَاذَا لَمْ تُخْبِرْنِي أَنَّهَا ٱمْرَأَتُكَ؟"},{"number":19,"text":"لِمَاذَا قُلْتَ: هِيَ أُخْتِي، حَتَّى أَخَذْتُهَا لِي لِتَكُونَ زَوْجَتِي؟ وَٱلْآنَ هُوَذَا ٱمْرَأَتُكَ! خُذْهَا وَٱذْهَبْ!»."},{"number":20,"text":"فَأَوْصَى عَلَيْهِ فِرْعَوْنُ رِجَالًا فَشَيَّعُوهُ وَٱمْرَأَتَهُ وَكُلَّ مَا كَانَ لَهُ."}],"titles":["في البدء خلق الله","الراحة، والجنة، والرجل والمرأة","السقوط والوعد الأول","قايين وهابيل","من آدم إلى نوح: «ومات»، إلا أخنوخ","فساد الأرض ونوح الذي وجد نعمة","الطوفان","الله يذكر نوحاً","العهد مع نوح وقوس قزح","جدول الأمم","برج بابل ومن سام إلى أبرام","دعوة أبرام والوعد","أبرام ولوط يفترقان","حرب الملوك وملكي صادق","العهد بين الأشلاء: فآمن بالرب فحسبه له براً","هاجر وإسماعيل: الإله الذي يراني","عهد الختان: إبراهيم وسارة","الزوار الثلاثة والشفاعة لسدوم","هلاك سدوم ونجاة لوط","إبراهيم وأبيمالك: تكرار الخطأ","ولادة إسحاق وطرد هاجر","تقديم إسحاق: الرب يرى","موت سارة ومغارة المكفيلة","زوجة لإسحاق: رفقة","موت إبراهيم وولادة التوأمين وبيع البكورية","إسحاق والآبار: الرب أرحب لنا","يعقوب يأخذ البركة بالخداع","سلم يعقوب في بيت إيل","يعقوب عند لابان: راحيل وليئة","حرب الأختين وثروة يعقوب","يعقوب يهرب من لابان: عهد جلعاد","يعقوب يصارع الله في فنيئيل","المصالحة: رأيت وجهك كما يُرى وجه الله","دينة وشكيم: الانتقام في شكيم","الرجوع إلى بيت إيل: موت راحيل وإسحاق","مواليد عيسو: أدوم","يوسف وأحلامه: بيعه من إخوته","يهوذا وثامار: هي أبر مني","يوسف في بيت فوطيفار والسجن: وكان الرب مع يوسف","حلما الساقي والخباز: أليست التعابير لله؟","حلما فرعون: من السجن إلى العرش","الإخوة في مصر: حقاً إننا مذنبون","الرحلة الثانية: بنيامين والوليمة","الطاس في عدل بنيامين: شفاعة يهوذا","أنا يوسف: الله أرسلني قدامكم","يعقوب ينزل إلى مصر: لا تخف","يعقوب أمام فرعون وسياسة يوسف في المجاعة","يعقوب يبارك منسى وأفرايم","بركات يعقوب لأبنائه: حتى يأتي شيلون","أنتم قصدتم لي شراً، أما الله فقصد به خيراً"],"v":{"Gen.12.3":{"t":"وَأُبَارِكُ مُبَارِكِيكَ، وَلَاعِنَكَ أَلْعَنُهُ. وَتَتَبَارَكُ فِيكَ جَمِيعُ قَبَائِلِ ٱلْأَرْضِ».","l":"التكوين ١٢: ٣"},"Gal.3.8":{"t":"وَٱلْكِتَابُ إِذْ سَبَقَ فَرَأَى أَنَّ ٱللهَ بِٱلْإِيمَانِ يُبَرِّرُ ٱلْأُمَمَ، سَبَقَ فَبَشَّرَ إِبْرَاهِيمَ أَنْ «فِيكَ تَتَبَارَكُ جَمِيعُ ٱلْأُمَمِ».","l":"غلاطية ٣: ٨"},"Gal.3.16":{"t":"وَأَمَّا ٱلْمَوَاعِيدُ فَقِيلَتْ فِي إِبْرَاهِيمَ وَفِي نَسْلِهِ. لَا يَقُولُ: «وَفِي ٱلْأَنْسَالِ» كَأَنَّهُ عَنْ كَثِيرِينَ، بَلْ كَأَنَّهُ عَنْ وَاحِدٍ: «وَفِي نَسْلِكَ» ٱلَّذِي هُوَ ٱلْمَسِيحُ.","l":"غلاط     <h4>في شخصيته</h4><div class="duo"><div><small>أبرز صفة</small>${md(P.strong)}</div><div><small>صراعه</small>${md(P.weak)}</div></div></div>${foot}`;
  return `${head}<div class="face">
    <h4>محطات حياته</h4><div class="tl">${P.life.map(([a, b]) => `<div><span>${ar(a)}</span>${esc(b)}</div>`).join('')}</div>
    <h4>في العهد الجديد</h4><div class="nts">${P.nt.map((r) => `<span>${esc(V(r).l)}</span>`).join('')}</div>
    <div class="cx"><small>كيف يشير إلى المسيح</small>${md(P.christ)}</div></div>${foot}`;
}
function openPerson(id) { pid = id; face = 0; renderViewer(); $('#viewer').classList.add('on'); }
function renderViewer() {
  const P = PEOPLE[pid];
  $('#viewer').innerHTML = `<div class="vtop"><button data-close-viewer>${IC.close}</button><span>شخصيات التكوين ١٢</span><span style="width:44px"></span></div>
  <div class="stage" id="stage"><div class="pcard" id="pcard"><div class="pin">${faceHTML(P, face, pid)}</div></div></div>
  <div class="dots">${FACES.map((l, i) => `<i class="${i === face ? 'on' : ''}"></i>`).join('')}</div>
  <div class="hint">${FACES[face]} · اسحب يميناً أو يساراً</div>
  <div class="who">${Object.keys(PEOPLE).map((k) => `<button data-who="${k}" aria-pressed="${k === pid}">${PEOPLE[k].n}</button>`).join('')}</div>
  <button class="full" data-toast="صفحة الشخصية الكاملة تأتي لاحقاً">الملف الكامل للشخصية</button>`;
  bindSwipe();
}
let busy = false;
function flip(dir) {
  if (busy) return; const nf = (face + (dir > 0 ? 1 : 2)) % 3; busy = true;
  const el = $('#pcard');
  el.style.transform = `rotateY(${dir > 0 ? -90 : 90}deg)`;
  setTimeout(() => {
    face = nf; $('.pin', el).innerHTML = faceHTML(PEOPLE[pid], face, pid);
    $$('.dots i').forEach((d, i) => d.classList.toggle('on', i === face)); $('.hint').textContent = FACES[face] + ' · اسحب يميناً أو يساراً';
    el.style.transition = 'none'; el.style.transform = `rotateY(${dir > 0 ? 90 : -90}deg)`;
    requestAnimationFrame(() => requestAnimationFrame(() => { el.style.transition = ''; el.style.transform = 'none'; setTimeout(() => busy = false, 330); }));
  }, 300);
}
function bindSwipe() {
  const st = $('#stage'); let x0 = 0, y0 = 0, drag = false;
  st.addEventListener('pointerdown', (e) => { if (e.target.closest('[data-addimg]')) return; x0 = e.clientX; y0 = e.clientY; drag = true; });
  st.addEventListener('pointermove', (e) => { if (!drag || busy) return; const dx = e.clientX - x0; if (Math.abs(dx) > 6) $('#pcard').style.transform = `rotateY(${-dx / 6}deg)`; });
  const end = (e) => { if (!drag) return; drag = false; const dx = e.clientX - x0; if (Math.abs(dx) > 50) flip(dx < 0 ? 1 : -1); else { $('#pcard').style.transform = 'none'; if (Math.abs(dx) < 6 && Math.abs(e.clientY - y0) < 6 && !e.target.closest('button')) flip(1); } };
  st.addEventListener('pointerup', end); st.addEventListener('pointercancel', () => { drag = false; $('#pcard').style.transform = 'none'; });
}
$('#file').addEventListener('change', (e) => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => {
    const im = new Image(); im.onload = () => {
      const cv = document.createElement('canvas'); const s = Math.min(1, 900 / Math.max(im.width, im.height));
      cv.width = im.width * s; cv.height = im.height * s; cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
      IMG[pid] = cv.toDataURL('image/jpeg', .85); try { localStorage.setItem('p5-img', JSON.stringify(IMG)); } catch {}
      renderViewer(); renderPeople();
    }; im.src = r.result;
  }; r.readAsDataURL(f); e.target.value = '';
});

// ---------- people / maps views ----------
function renderPeople() {
  $('#v-people').innerHTML = `<div class="vh"><div class="ey">سفر التكوين</div><h1>الشخصيات</h1><p>بطاقة تعريف لكل شخصية: من هو، وقصته، وكيف يشير إلى المسيح.</p></div>
  <div class="pgrid">${Object.keys(PEOPLE).map((id) => `<button class="mini" data-person="${id}"><div class="in"><div class="im">${IMG[id] ? `<img src="${IMG[id]}" alt="">` : `<span>${PEOPLE[id].mono}</span>`}</div><div class="tx"><b>${PEOPLE[id].full}</b><small>${PEOPLE[id].role}</small></div></div></button>`).join('')}
  ${LATER.map(([n, s]) => `<button class="mini off" data-toast="في النموذج: شخصيات التكوين ١٢ فقط"><div class="in"><div class="im"><span>${n[0]}</span></div><div class="tx"><b>${n}</b><small>${s}</small></div></div></button>`).join('')}</div>`;
}
function renderMaps() {
  $('#v-maps').innerHTML = `<div class="vh"><div class="ey">سفر التكوين</div><h1>الخرائط</h1><p>رحلات الكتاب على الخريطة، مرتبطة بأصحاحاتها.</p></div>
  <div class="mlist"><button class="mrow" data-openmap><div class="mv">${mapSVG({ theme: 'navy', vb: '80 40 490 250', fit: 'slice', labels: false })}</div><div class="mt"><b>رحلة أبرام</b><small>التكوين ١١–١٣</small></div></button>
  ${[['الطوفان', 'التكوين ٦–٩'], ['رحلات يعقوب', 'التكوين ٢٨–٣٥'], ['يوسف في مصر', 'التكوين ٣٧–٥٠']].map(([a, b]) => `<button class="mrow off" data-toast="في النموذج: رحلة أبرام فقط"><div class="mt"><b>${a}</b><small>${b}</small></div></button>`).join('')}</div>`;
}
let mapActive = 'haran';
function openMap() {
  closeSheet(); const p = PLACES.find((x) => x.id === mapActive); const i = PLACES.indexOf(p);
  $('#mapfull').innerHTML = `<div class="mf">${mapSVG({ theme: 'sand', active: mapActive, vb: '80 40 490 250', fit: 'meet' })}</div>
  <div class="mtop"><button data-close-map>${IC.close}</button><b>رحلة أبرام</b><button data-mstep>${IC.chev}</button></div>
  <div class="minfo"><b>${ar(i + 1)} · ${p.n}</b><p>${md(p.d)}</p></div>`;
  $('#mapfull').classList.add('on');
}

// ---------- events ----------
document.addEventListener('click', (e) => {
  const q = (s) => e.target.closest(s); let b;
  if ((b = q('[data-v]'))) { $$('#nav button').forEach((x) => x.setAttribute('aria-current', x === b)); $$('.view').forEach((v) => v.classList.toggle('on', v.id === 'v-' + b.dataset.v)); ({ book: renderBook, people: renderPeople, maps: renderMaps })[b.dataset.v](); return; }
  if (q('[data-addimg]')) { $('#file').click(); return; }
  if ((b = q('[data-who]'))) { pid = b.dataset.who; face = 0; renderViewer(); return; }
  if ((b = q('[data-person]'))) { openPerson(b.dataset.person); return; }
  if ((b = q('[data-toast]'))) { toast(b.dataset.toast); return; }
  if ((b = q('[data-ch]'))) { openStory(+b.dataset.ch); return; }
  if ((b = q('[data-more]'))) { openSheet(b.dataset.more); return; }
  if (q('[data-reader]')) { openReader(); return; }
  if (q('[data-close-reader]')) { $('#reader').classList.remove('on'); return; }
  if (q('[data-close-viewer]')) { $('#viewer').classList.remove('on'); if ($('#story').classList.contains('on')) { cards = storyCards(); const k = si; openStory(12); si = k; show(); } return; }
  if (q('[data-openmap]')) { openMap(); return; }
  if (q('[data-close-map]')) { $('#mapfull').classList.remove('on'); return; }
  if (q('[data-mstep]')) { const i = PLACES.findIndex((x) => x.id === mapActive); mapActive = PLACES[(i + 1) % PLACES.length].id; openMap(); return; }
  if ((b = q('#mapfull [data-pin]'))) { mapActive = b.dataset.pin; openMap(); return; }
  if ((b = q('[data-close-story]'))) { $('#story').classList.remove('on'); if (b.dataset.closeStory === 'next') toast('هنا يبدأ التكوين ١٣'); return; }
  if (q('#scrim')) { closeSheet(); return; }
  if ((b = q('.tz'))) { step(+b.dataset.dir); return; }
});
let sx = 0, sy = 0;
$('#story').addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
$('#story').addEventListener('touchend', (e) => {
  if ($('#sheet').classList.contains('on') || $('#reader').classList.contains('on') || $('#viewer').classList.contains('on')) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1);
  else if (dy < -70 && cards[si].more) openSheet(cards[si].more);
}, { passive: true });
renderBook();
</script>
</body>
</html>
