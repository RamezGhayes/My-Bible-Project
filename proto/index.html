<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نموذج التصميم الجديد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;500;600&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF8F3; --card:#FFFFFF; --ink:#1F1D1A; --soft:#5F5A52; --faint:#9A9388; --line:#ECE5D9;
  --accent:#C2502D; --accent-soft:#F6E3DA; --gold:#B08A4E; --gold-soft:#F3EBDD; --ok:#3E7A5A; --ok-soft:#E3F0E8; --warn:#9A6A12; --warn-soft:#F7EDD6;
  --ui:'Readex Pro',system-ui,sans-serif;
  --read:'IBM Plex Sans Arabic',system-ui,sans-serif;
  --scripture:'Noto Naskh Arabic',serif;
  --fs:18px;
  --bar:58px;
}
[data-theme=paper]{--bg:#F4ECDD;--card:#FBF6EC;--line:#E4D8C3;--soft:#5E5446}
[data-theme=dark]{--bg:#141517;--card:#1C1E21;--ink:#ECE8E1;--soft:#B3ADA3;--faint:#7D776F;--line:#2B2E33;--accent:#E9805F;--accent-soft:#3A2620;--gold:#D2AE73;--gold-soft:#2E281D;--ok:#7FC39C;--ok-soft:#1E2E25;--warn:#E3B55A;--warn-soft:#332A17}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--read);font-size:var(--fs);line-height:1.85;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
.wrap{max-width:680px;margin:0 auto;padding:0 20px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:center;gap:8px;height:var(--bar);max-width:680px;margin:0 auto;padding:0 12px}
.ibtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.ibtn:active{background:var(--line)}
.ibtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ttl{flex:1;text-align:center;font-family:var(--ui);line-height:1.2;min-width:0}
.ttl b{display:block;font-weight:600;font-size:17px}
.ttl small{display:block;color:var(--faint);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;max-width:680px;margin:0 auto;padding:0 12px;gap:4px}
.tab{flex:1;font-family:var(--ui);font-size:15px;font-weight:500;color:var(--faint);padding:10px 0 12px;position:relative}
.tab[aria-selected=true]{color:var(--ink)}
.tab[aria-selected=true]:after{content:"";position:absolute;inset-inline:22%;bottom:0;height:3px;border-radius:3px;background:var(--accent)}

/* bottom bar */
.bottom{position:fixed;bottom:0;inset-inline:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bottom .row{display:flex;max-width:680px;margin:0 auto;height:64px;align-items:center;padding:0 10px;gap:8px}
.nav{flex:1;display:flex;align-items:center;gap:6px;font-family:var(--ui);font-size:14px;color:var(--soft);height:48px;border-radius:14px;padding:0 10px}
.nav:active{background:var(--line)}
.nav.next{justify-content:flex-end}
.nav[disabled]{opacity:.3}
.nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid{flex:none;height:48px;padding:0 18px;border-radius:24px;background:var(--ink);color:var(--bg);font-family:var(--ui);font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:8px}
.mid svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
main{padding-bottom:110px}

/* home */
.hello{padding:28px 0 6px}
.brand{font-family:var(--ui);font-weight:700;font-size:28px;letter-spacing:-.3px;margin:0}
.lede{color:var(--soft);margin:6px 0 0;font-size:16px;line-height:1.7}
.search{margin:18px 0 6px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 14px;height:52px}
.search svg{width:20px;height:20px;stroke:var(--faint);fill:none;stroke-width:2;flex:none}
.search input{flex:1;border:0;outline:0;background:none;font:inherit;font-size:16px;color:var(--ink)}
.continue{display:flex;align-items:center;gap:14px;margin:18px 0;padding:16px;border-radius:20px;background:var(--accent);color:#fff}
.continue .art{width:58px;height:58px;border-radius:16px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.continue .art svg{width:34px;height:34px}
.continue small{display:block;opacity:.85;font-family:var(--ui);font-size:13px}
.continue b{display:block;font-family:var(--ui);font-size:19px;font-weight:600;line-height:1.35}
.continue em{display:block;font-style:normal;opacity:.9;font-size:14px;line-height:1.5}
.seg{display:flex;background:var(--line);border-radius:14px;padding:4px;margin:22px 0 10px}
.seg button{flex:1;height:40px;border-radius:11px;font-family:var(--ui);font-size:15px;color:var(--soft)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.group{font-family:var(--ui);font-size:13px;color:var(--faint);margin:22px 4px 8px;font-weight:500}
.list{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line);width:100%;text-align:start}
.item:first-child{border-top:0}
.item:active{background:var(--line)}
.item .num{width:36px;height:36px;border-radius:11px;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-family:var(--ui);font-weight:600;font-size:15px;flex:none}
.item .tx{flex:1;min-width:0;line-height:1.45}
.item .tx b{display:block;font-family:var(--ui);font-weight:500;font-size:16.5px}
.item .tx small{display:block;color:var(--faint);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .chev{width:18px;height:18px;stroke:var(--faint);fill:none;stroke-width:2;flex:none}
.pill{font-family:var(--ui);font-size:11.5px;padding:2px 9px;border-radius:20px;background:var(--ok-soft);color:var(--ok);flex:none}
.item.cur .num{background:var(--accent);color:#fff}

/* book page */
.hero{margin:18px 0 6px;border-radius:24px;overflow:hidden;background:var(--gold-soft);position:relative}
.hero svg{display:block;width:100%;height:auto}
.btitle{font-family:var(--ui);font-weight:700;font-size:32px;margin:18px 0 0;line-height:1.25}
.eyebrow{font-family:var(--ui);font-size:13px;color:var(--accent);font-weight:500}
.cta{display:flex;gap:10px;margin:18px 0 4px}
.btn{flex:1;height:52px;border-radius:16px;font-family:var(--ui);font-weight:500;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--card);border:1px solid var(--line)}

/* reading */
.chhead{padding:26px 0 4px}
.chhead .eyebrow{display:block}
.chhead h1{font-family:var(--ui);font-weight:700;font-size:30px;line-height:1.3;margin:4px 0 0}
.peri{font-family:var(--ui);font-weight:600;font-size:17px;color:var(--accent);margin:30px 0 6px}
.scripture{font-family:var(--scripture);font-size:calc(var(--fs) + 3px);line-height:2.15}
.scripture p{margin:0}
.v{display:inline}
.vn{font-family:var(--ui);font-size:.55em;color:var(--gold);font-weight:600;vertical-align:super;margin-inline:2px 3px}
.v.key{background:linear-gradient(transparent 55%,var(--accent-soft) 55%);}
.v.tapped{background:var(--gold-soft);border-radius:4px}
.nextcard{display:block;margin:40px 0 0;padding:20px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.nextcard small{color:var(--faint);font-family:var(--ui);font-size:13px}
.nextcard b{display:block;font-family:var(--ui);font-weight:600;font-size:20px;margin-top:2px}
.nextcard span{color:var(--accent);font-family:var(--ui);font-size:14px}

/* study */
.lead{margin:22px 0 0;padding:20px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.lead h3,.christ h3{font-family:var(--ui);font-weight:600;font-size:15px;margin:0 0 6px;color:var(--soft)}
.lead p{margin:0}
.clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.more{font-family:var(--ui);font-size:14px;color:var(--accent);margin-top:8px}
.christ{margin:14px 0 0;padding:20px;border-radius:20px;background:var(--accent);color:#fff}
.christ h3{color:rgba(255,255,255,.85)}
.christ p{margin:0 0 10px}
.christ p:last-child{margin:0}
.acc{margin:14px 0 0;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.acc details{border-top:1px solid var(--line)}
.acc details:first-child{border-top:0}
.acc summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer;font-family:var(--ui);font-weight:500;font-size:16.5px}
.acc summary::-webkit-details-marker{display:none}
.acc summary .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--gold-soft);flex:none}
.acc summary .ico svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.acc summary .lbl{flex:1}
.acc summary .cnt{font-size:13px;color:var(--faint);font-weight:400}
.acc summary .arr{width:18px;height:18px;stroke:var(--faint);fill:none;stroke-width:2;transition:transform .2s}
.acc details[open] summary .arr{transform:rotate(180deg)}
.acc .body{padding:0 18px 18px}
.entry{padding:12px 0;border-top:1px dashed var(--line)}
.entry:first-child{border-top:0;padding-top:0}
.entry b{font-family:var(--ui);font-weight:600;font-size:16px;display:block;line-height:1.5}
.entry .orig{font-family:var(--scripture);color:var(--gold);font-size:15px}
.entry p{margin:4px 0 0;color:var(--soft)}
.entry .who{font-size:13.5px;color:var(--faint);font-family:var(--ui)}
.ref{font-family:var(--ui);font-size:13.5px;color:var(--accent);font-weight:500}
.tag{display:inline-block;font-family:var(--ui);font-size:12px;padding:1px 10px;border-radius:20px;margin-bottom:6px}
.tag.agreed{background:var(--ok-soft);color:var(--ok)}
.tag.debated{background:var(--warn-soft);color:var(--warn)}
.outline li{margin:0 0 8px}
.outline{padding:0;margin:0;list-style:none}
.outline .r{font-family:var(--ui);font-size:13px;color:var(--gold);font-weight:600;display:block}

/* reflect */
.kv{margin:26px 0 0;padding:26px 22px;border-radius:24px;background:var(--gold-soft);text-align:center}
.kv q{font-family:var(--scripture);font-size:calc(var(--fs) + 5px);line-height:2;quotes:none;display:block}
.kv small{display:block;font-family:var(--ui);color:var(--gold);margin-top:8px;font-size:14px}
.qs{counter-reset:q;list-style:none;padding:0;margin:14px 0 0}
.qs li{counter-increment:q;display:flex;gap:12px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:10px}
.qs li:before{content:counter(q, arabic-indic);font-family:var(--ui);font-weight:600;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none;font-size:14px}
.apply{margin:14px 0 0;padding:20px;border-radius:20px;background:var(--ink);color:var(--bg)}
.apply h3{font-family:var(--ui);font-size:15px;font-weight:600;margin:0 0 6px;opacity:.75}
.apply p{margin:0}
.h2{font-family:var(--ui);font-weight:600;font-size:20px;margin:30px 0 0}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:41;background:var(--card);border-radius:24px 24px 0 0;max-height:82vh;overflow:auto;transform:translateY(105%);transition:transform .25s ease;padding:10px 20px calc(24px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h4{font-family:var(--ui);font-weight:600;font-size:18px;margin:0 0 4px}
.sheet .sub{color:var(--faint);font-size:14px;margin:0 0 14px;font-family:var(--ui)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.grid button{aspect-ratio:1;border-radius:12px;background:var(--bg);font-family:var(--ui);font-size:15px;font-weight:500}
.grid button.cur{background:var(--accent);color:#fff}
.grid button.has{border:1.5px solid var(--gold)}
.opt{margin:18px 0 0}
.opt label{display:block;font-family:var(--ui);font-size:14px;color:var(--soft);margin-bottom:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:90px;padding:10px 8px;border-radius:14px;background:var(--bg);border:1.5px solid transparent;text-align:center;line-height:1.4}
.chip[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.chip b{display:block;font-size:20px;font-weight:400}
.chip small{display:block;font-family:var(--ui);font-size:12px;color:var(--faint)}
.sizes{display:flex;align-items:center;gap:10px}
.sizes button{width:52px;height:46px;border-radius:14px;background:var(--bg);font-family:var(--ui)}
.sizes .bar{flex:1;height:6px;border-radius:3px;background:var(--line);position:relative}
.sizes .bar i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:3px;background:var(--accent)}
.toast{position:fixed;bottom:84px;inset-inline:20px;max-width:440px;margin:0 auto;z-index:50;background:var(--ink);color:var(--bg);font-family:var(--ui);font-size:14.5px;padding:12px 16px;border-radius:14px;text-align:center;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.verse-pop{position:fixed;bottom:84px;inset-inline:16px;max-width:460px;margin:0 auto;z-index:30;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:12px;display:none;gap:8px}
.verse-pop.on{display:flex}
.verse-pop button{flex:1;height:44px;border-radius:12px;background:var(--bg);font-family:var(--ui);font-size:14px}
.empty{text-align:center;padding:60px 10px;color:var(--soft)}
.empty b{display:block;font-family:var(--ui);font-size:20px;color:var(--ink);margin-bottom:6px}
.note{margin:16px 0 0;padding:12px 16px;border-radius:14px;background:var(--warn-soft);color:var(--warn);font-family:var(--ui);font-size:13.5px;line-height:1.6}
</style>
</head>
<body>
<div id="app"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="verse-pop" id="vpop"><button data-act="copy">نسخ الآية</button><button data-act="study">ادرسها</button><button data-act="close">إغلاق</button></div>
<div class="toast" id="toast"></div>
<script>

ليوم الأول: النور"},{"at":6,"t":"اليوم الثاني: الجلد"},{"at":9,"t":"اليوم الثالث: اليابسة والنبات"},{"at":14,"t":"اليوم الرابع: الأنوار"},{"at":20,"t":"اليوم الخامس: الطيور والأسماك"},{"at":24,"t":"اليوم السادس: الحيوانات"},{"at":26,"t":"الإنسان على صورة الله"},{"at":31,"t":"حسن جداً"}],"outline":[{"r":"1-2","t":"في البدء خلق الله السماوات والأرض. وكانت الأرض خربة وخالية، وعلى وجه الغمر ظلمة، وروح الله يرف على وجه المياه"},{"r":"3-5","t":"وقال الله: ليكن نور، فكان نور. ورأى الله النور أنه حسن. وفصل الله بين النور والظلمة... وكان مساء وكان صباح يوماً واحداً"},{"r":"6-8","t":"وقال الله: ليكن جلد في وسط المياه... ودعا الله الجلد سماء. وكان مساء وكان صباح يوماً ثانياً"},{"r":"9-13","t":"وقال الله: لتجتمع المياه تحت السماء إلى مكان واحد ولتظهر اليابسة... لتنبت الأرض عشباً وبقلاً يبزر بزراً، وشجراً ذا ثمر... وكان مساء وكان صباح يوماً ثالثاً"},{"r":"14-19","t":"وقال الله: لتكن أنوار في جلد السماء لتفصل بين النهار والليل، وتكون لآيات وأوقات وأيام وسنين... فعمل الله النورين العظيمين... والنجوم... وكان مساء وكان صباح يوماً رابعاً"},{"r":"20-23","t":"وقال الله: لتفض المياه زحافات ذات نفس حية، وليطر طير فوق الأرض... وباركها الله قائلاً: أثمري واكثري... وكان مساء وكان صباح يوماً خامساً"},{"r":"24-25","t":"وقال الله: لتخرج الأرض ذوات أنفس حية كجنسها: بهائم ودبابات ووحوش أرض كأجناسها... ورأى الله ذلك أنه حسن"},{"r":"26-28","t":"وقال الله: نعمل الإنسان على صورتنا كشبهنا، فيتسلطون على سمك البحر وعلى طير السماء وعلى البهائم وعلى كل الأرض... فخلق الله الإنسان على صورته، على صورة الله خلقه، ذكراً وأنثى خلقهم. وباركهم الله وقال لهم: أثمروا واكثروا واملأوا الأرض وأخضعوها"},{"r":"29-31","t":"وقال الله: إني قد أعطيتكم كل بقل يبزر بزراً... لكم يكون طعاماً... ورأى الله كل ما عمله فإذا هو حسن جداً. وكان مساء وكان صباح يوماً سادساً"}],"keyVerse":"Gen.1.27","people":[{"n":"الله (إلوهيم)","d":"الاسم العبري «إلوهيم» بصيغة الجمع، لكن الفعل معه مفرد («خلق»). الإله الواحد القدير. ويُذكر 32 مرة في الأصحاح: هو بطل القصة."},{"n":"روح الله","d":"يرف (يحوم) فوق المياه كطائر فوق صغاره (تث 32: 11). الروح القدس حاضر وفاعل في الخلق."},{"n":"الإنسان (آدم)","d":"الكلمة العبرية «آدم» تعني «إنسان» أو «بشر»، مرتبطة بـ«أداما» (تراب الأرض). هنا الإنسان عموماً، ذكراً وأنثى."}],"places":[{"n":"السماوات والأرض","d":"تعبير عبري يعني «كل شيء»، الكون كله بكل ما فيه."},{"n":"الغمر","d":"المياه العميقة، المحيط البدائي. في الأساطير البابلية، «تيامات» إلهة البحر والفوضى. في التكوين، الغمر مجرد ماء تحت سلطان الله، لا إله."}],"summary":["في البدء خلق الله السماوات والأرض. وكانت الأرض خربة وخالية، وعلى وجه الغمر ظلمة، وروح الله يرف على وجه المياه. وقال الله: ليكن نور، فكان نور. ورأى الله النور أنه حسن. وفصل الله بين النور والظلمة. ودعا الله النور نهاراً، والظلمة دعاها ليلاً. وكان مساء وكان صباح يوماً واحداً.","في اليوم الثاني صنع الله الجلد (السماء) فاصلاً بين المياه التي فوق والمياه التي تحت. وفي الثالث جمع المياه فظهرت اليابسة، ودعاها أرضاً، وأنبتت الأرض عشباً وشجراً كأجناسه. وفي الرابع صنع النورين العظيمين: الشمس لحكم النهار، والقمر لحكم الليل، والنجوم، لتكون لآيات وأوقات وأيام وسنين. وفي الخامس فاضت المياه أسماكاً وزحافات، وطارت الطيور، وباركها الله: أثمري واكثري.","وفي السادس أخرجت الأرض البهائم والدبابات ووحوش الأرض كأجناسها. ثم قال الله: نعمل الإنسان على صورتنا كشبهنا، فيتسلطون على سمك البحر وعلى طير السماء وعلى البهائم وعلى كل الأرض وعلى جميع الدبابات التي تدب على الأرض. فخلق الله الإنسان على صورته، على صورة الله خلقه، ذكراً وأنثى خلقهم. وباركهم الله وقال لهم: أثمروا واكثروا واملأوا الأرض وأخضعوها، وتسلطوا على سمك البحر وعلى طير السماء وعلى كل حيوان يدب على الأرض.","وقال الله: إني قد أعطيتكم كل بقل يبزر بزراً على وجه كل الأرض، وكل شجر فيه ثمر شجر يبزر بزراً، لكم يكون طعاماً. ولكل حيوان الأرض... كل عشب أخضر طعاماً. وكان كذلك. ورأى الله كل ما عمله فإذا هو حسن جداً. وكان مساء وكان صباح يوماً سادساً."],"background":[{"t":"التكوين والأساطير البابلية","d":"في «إينوما إيليش» البابلية، الإله مردوخ يقتل الإلهة تيامات (البحر) ويشقها نصفين ليصنع السماء والأرض، والبشر يُخلقون من دم إله متمرد ليكونوا عبيداً للآلهة. التكوين 1 يرد بهدوء: إله واحد، يخلق بكلمته لا بالحرب، والبحر (تهوم) مجرد ماء، والشمس والقمر (آلهة في كل الشعوب) مجرد «أنوار» لا تُذكر حتى أسماؤهما، والإنسان على صورة الله ومُبارك لا عبد."},{"t":"البناء الأدبي","d":"الأيام الستة مبنية بتوازٍ جميل: اليوم 1 (النور) يقابل 4 (الأنوار)، و2 (السماء والمياه) يقابل 5 (الطيور والأسماك)، و3 (اليابسة والنبات) يقابل 6 (الحيوانات والإنسان). الأيام الأولى «تشكيل» (لعلاج «خربة»)، والأخيرة «ملء» (لعلاج «خالية»)."},{"t":"الصورة في العالم القديم","d":"الملوك في الشرق القديم كانوا يضعون تماثيلهم (صورهم) في المدن البعيدة كعلامة على سلطانهم. والملك نفسه كان يُسمى «صورة الإله». التكوين يقول: كل إنسان، لا الملك فقط، هو صورة الله وممثله على الأرض."}],"words":[{"w":"خلق","orig":"בָּרָא (بارا)","d":"فعل لا يُستخدم في العبرية إلا مع الله كفاعل. خلق شيء جديد، من العدم أو بقدرة إلهية فريدة. يظهر في 1: 1 (الكون)، و1: 21 (الحياة الحيوانية)، و1: 27 (الإنسان، ثلاث مرات)."},{"w":"خربة وخالية","orig":"תֹהוּ וָבֹהוּ (توهو وفوهو)","d":"بلا شكل وفارغة. الحالة قبل أن يرتب الله ويملأ."},{"w":"يرف","orig":"מְרַחֶפֶת (مرحفت)","d":"يحوم، يرفرف، كالنسر فوق عشه (تث 32: 11)."},{"w":"يوم","orig":"יוֹם (يوم)","d":"قد يعني 24 ساعة، أو النهار، أو فترة زمنية. انظر «أسئلة صعبة»."},{"w":"صورة / شبه","orig":"צֶלֶם / דְּמוּת (صلم / دموت)","d":"«صلم»: تمثال، صورة منحوتة. «دموت»: مشابهة. الكلمتان معاً تعنيان أن الإنسان يمثل الله ويعكسه."},{"w":"تسلطوا","orig":"רָדָה (رادا)","d":"يحكم، يملك. سلطة ملكية، لكن كوكيل لله الملك الحقيقي، لا كمالك مستبد."},{"w":"حسن جداً","orig":"טוֹב מְאֹד (طوف مئود)","d":"جيد بشكل كامل. الخليقة المادية ليست شراً (عكس الفلسفات التي تحتقر المادة)."}],"otQuotes":[],"links":[{"ref":"John.1.1-3","d":"في البدء كان الكلمة... كل شيء به كان، وبغيره لم يكن شيء مما كان.","label":"يوحنا ١: ١–٣","text":"فِي ٱلْبَدْءِ كَانَ ٱلْكَلِمَةُ، وَٱلْكَلِمَةُ كَانَ عِنْدَ ٱللهِ، وَكَانَ ٱلْكَلِمَةُ ٱللهَ. هَذَا كَانَ فِي ٱلْبَدْءِ عِنْدَ ٱللهِ. كُلُّ شَيْءٍ بِهِ كَانَ، وَبِغَيْرِهِ لَمْ يَكُنْ شَيْءٌ مِمَّا كَانَ."},{"ref":"Col.1.15-17","d":"الذي هو صورة الله غير المنظور، بكر كل خليقة. فإنه فيه خُلق الكل.","label":"كولوسي ١: ١٥–١٧","text":"ٱلَّذِي هُوَ صُورَةُ ٱللهِ غَيْرِ ٱلْمَنْظُورِ، بِكْرُ كُلِّ خَلِيقَةٍ. فَإِنَّهُ فِيهِ خُلِقَ ٱلْكُلُّ: مَا في ٱلسَّمَاوَاتِ وَمَا عَلَى ٱلْأَرْضِ، مَا يُرَى وَمَا لَا يُرَى، سَوَاءٌ كَانَ عُرُوشًا أَمْ سِيَادَاتٍ أَمْ رِيَاسَاتٍ أَمْ سَلَاطِينَ. ٱلْكُلُّ بِهِ وَلَهُ قَدْ خُلِقَ. ٱلَّذِي هُوَ قَبْلَ كُلِّ شَيْءٍ، وَفِيهِ يَقُومُ ٱلْكُلُّ،"},{"ref":"Heb.11.3","d":"بالإيمان نفهم أن العالمين أُتقنت بكلمة الله، حتى لم يتكون ما يُرى مما هو ظاهر.","label":"العبرانيين ١١: ٣","text":"بِٱلْإِيمَانِ نَفْهَمُ أَنَّ ٱلْعَالَمِينَ أُتْقِنَتْ بِكَلِمَةِ ٱللهِ، حَتَّى لَمْ يَتَكَوَّنْ مَا يُرَى مِمَّا هُوَ ظَاهِرٌ."},{"ref":"Ps.33.6-9","d":"بكلمة الرب صُنعت السماوات، وبنسمة فيه كل جنودها... لأنه قال فكان.","label":"المزامير ٣٣: ٦–٩","text":"بِكَلِمَةِ ٱلرَّبِّ صُنِعَتِ ٱلسَّمَاوَاتُ، وَبِنَسَمَةِ فِيهِ كُلُّ جُنُودِهَا. يَجْمَعُ كَنَدٍّ أَمْوَاهَ ٱلْيَمِّ. يَجْعَلُ ٱللُّجَجَ فِي أَهْرَاءٍ. لِتَخْشَ ٱلرَّبَّ كُلُّ ٱلْأَرْضِ، وَمِنْهُ لِيَخَفْ كُلُّ سُكَّانِ ٱلْمَسْكُونَةِ. لِأَنَّهُ قَالَ فَكَانَ. هُوَ أَمَرَ فَصَارَ."},{"ref":"Ps.8.3-8","d":"فمن هو الإنسان حتى تذكره؟... وتنقصه قليلاً عن الملائكة، وبمجد وبهاء تكلله.","label":"المزامير ٨: ٣–٨","text":"إِذَا أَرَى سَمَاوَاتِكَ عَمَلَ أَصَابِعِكَ، ٱلْقَمَرَ وَٱلنُّجُومَ ٱلَّتِي كَوَّنْتَهَا، فَمَنْ هُوَ ٱلْإِنْسَانُ حَتَّى تَذْكُرَهُ؟ وَٱبْنُ آدَمَ حَتَّى تَفْتَقِدَهُ؟ وَتَنْقُصَهُ قَلِيلًا عَنِ ٱلْمَلَائِكَةِ، وَبِمَجْدٍ وَبَهَاءٍ تُكَلِّلُهُ. تُسَلِّطُهُ عَلَى أَعْمَالِ يَدَيْكَ. جَعَلْتَ كُلَّ شَيْءٍ تَحْتَ قَدَمَيْهِ: ٱلْغَنَمَ وَٱلْبَقَرَ جَمِيعًا، وَبَهَائِمَ ٱلْبَرِّ أَيْضًا، وَطُيُورَ ٱلسَّمَاءِ، وَسَمَكَ ٱلْبَحْرِ ٱلسَّالِكَ فِي سُبُلِ ٱلْمِيَاهِ."},{"ref":"2Cor.4.6","d":"لأن الله الذي قال أن يشرق نور من ظلمة، هو الذي أشرق في قلوبنا.","label":"كورنثوس الثانية ٤: ٦","text":"لِأَنَّ ٱللهَ ٱلَّذِي قَالَ: «أَنْ يُشْرِقَ نُورٌ مِنْ ظُلْمَةٍ»، هُوَ ٱلَّذِي أَشْرَقَ فِي قُلُوبِنَا، لِإِنَارَةِ مَعْرِفَةِ مَجْدِ ٱللهِ فِي وَجْهِ يَسُوعَ ٱلْمَسِيحِ."},{"ref":"Rom.1.20","d":"لأن أموره غير المنظورة تُرى منذ خلق العالم مدركة بالمصنوعات.","label":"رومية ١: ٢٠","text":"لِأَنَّ أُمُورَهُ غَيْرَ ٱلْمَنْظُورَةِ تُرىَ مُنْذُ خَلْقِ ٱلْعَالَمِ مُدْرَكَةً بِٱلْمَصْنُوعَاتِ، قُدْرَتَهُ ٱلسَّرْمَدِيَّةَ وَلَاهُوتَهُ، حَتَّى إِنَّهُمْ بِلَا عُذْرٍ."}],"christ":["العهد الجديد يكشف أن المسيح هو «الكلمة» الذي به خلق الله كل شيء: \"في البدء كان الكلمة... كل شيء به كان\" (يو 1: 1–3). وكل «وقال الله» في التكوين 1 هي عمل الكلمة الأزلي. و\"فيه خُلق الكل... الكل به وله قد خُلق\" (كو 1: 16). الخليقة ليست فقط من المسيح بل له: هو هدفها.","والمسيح هو «صورة الله» الكاملة (كو 1: 15؛ عب 1: 3). آدم خُلق على صورة الله وشوهها بالخطية، والمسيح «آدم الأخير» (1 كو 15: 45) هو الصورة الحقيقية، والمؤمنون يتجددون «حسب صورة خالقه» (كو 3: 10) ليكونوا «مشابهين صورة ابنه» (رو 8: 29). و«ليكن نور» يتحقق ثانية في الخليقة الجديدة: «الله الذي قال أن يشرق نور من ظلمة، هو الذي أشرق في قلوبنا لإنارة معرفة مجد الله في وجه يسوع المسيح» (2 كو 4: 6)."],"hard":[{"q":"هل أيام الخلق 24 ساعة حرفية، أم فترات طويلة؟","tag":"debated","a":["المصلحون والإنجيليون المحافظون يختلفون في هذه المسألة، مع الاتفاق على أن الله خلق كل شيء، وأن آدم وحواء شخصان تاريخيان. الآراء الرئيسية: (1) **أيام حرفية (24 ساعة)**: القراءة الطبيعية للنص («مساء وصباح»، والأرقام)، وخر 20: 11 يربط أسبوع العمل بأسبوع الخلق. رأي كالفن ولوثر وأغلب اللاهوتيين قبل القرن التاسع عشر، وكثير من المصلحين اليوم. (2) **اليوم الفترة**: «يوم» يعني عصراً طويلاً، يتوافق مع عمر الأرض العلمي. (3) **الإطار الأدبي**: الأيام الستة إطار أدبي لاهوتي (التوازي بين الأيام 1–3 و4–6) لا تسلسل زمني (ميريديث كلاين). (4) **أيام القياس الإلهي** أو «أيام الله» (وليم شيد، جون كولينز): أيام عمل الله القياسية لأسبوع الإنسان.","إقرار وستمنستر يقول \"في مدة ستة أيام\"، والكنائس المشيخية المحافظة (مثل PCA) قررت قبول هذه الآراء الأربعة كلها ضمن الحدود المقبولة. والمهم: الله خالق كل شيء من العدم، والخليقة حسنة، والإنسان مخلوق خاص على صورة الله."]},{"q":"من يخاطب الله في «نعمل الإنسان على صورتنا» (1: 26)؟","tag":"debated","a":["آراء: (1) **الثالوث** (رأي أغلب آباء الكنيسة والمصلحين): الله يتشاور مع نفسه، الآب والابن والروح، وهذا بذرة إعلان الثالوث في العهد القديم (قارن 1: 2 الروح، ويو 1: 3 الكلمة). (2) **جمع العظمة**: الملوك يتكلمون بصيغة الجمع («نحن»). لكن هذا الاستخدام غير مؤكد في العبرية القديمة. (3) **المجلس السماوي**: الله يخاطب الملائكة. لكن الإنسان خُلق على صورة الله لا الملائكة، والآية 27 تقول «على صورة الله». والقراءة الثالوثية تتوافق مع الإعلان الكامل في العهد الجديد، دون أن نقول إن موسى فهمها بالكامل."]},{"q":"ماذا تعني «صورة الله» في الإنسان؟","tag":"agreed","a":["التقليد المصلح يرى أن الصورة تشمل: (1) **المعرفة والبر والقداسة** (كو 3: 10؛ أف 4: 24): الصورة الأخلاقية التي تشوهت بالسقوط وتتجدد في المسيح. (2) **القدرات**: العقل، والإرادة، والضمير، والروحانية، والقدرة على العلاقة مع الله. (3) **الوظيفة**: التسلط على الخليقة كممثل لله (1: 26–28). (4) **العلاقة**: ذكراً وأنثى، في شركة، كما أن الله في شركة. والصورة لم تُمحَ بالسقوط (تك 9: 6؛ يع 3: 9)، ولهذا لكل إنسان كرامة مطلقة."]}],"voices":[{"n":"جون كالفن","y":"1509–1564","w":"تفسير سفر التكوين (1554)","b":"يرى أن الله خلق العالم أولاً ثم الإنسان، كما يجهز الأب البيت بكل ما يحتاجه قبل أن يُدخل ابنه إليه. الخليقة كلها هدية للإنسان. ويرى أن الله خلق في ستة أيام لا في لحظة ليعلمنا التأمل في أعماله بتمهل. ويعلق أن موسى كتب كـ«معلم للأميين» لا كفلكي، فيصف الأشياء كما تظهر للعين."},{"n":"هيرمان بافينك","y":"1854–1921","w":"العقائد المصلحة (1895–1901)، المجلد 2","b":"يرى أن الخلق عمل الثالوث كله: من الآب، بالابن، في الروح. ويؤكد أن «صورة الله» ليست شيئاً في الإنسان بل الإنسان كله، جسداً ونفساً. \"الإنسان لا يحمل صورة الله، بل هو صورة الله\". وهذا يعطي قيمة للجسد والعمل والثقافة."},{"n":"ميريديث كلاين","y":"1922–2007","w":"مقدمة الملكوت (2000)","b":"صاحب «الرأي الإطاري» للأيام. يرى أن الأيام الستة إطار أدبي يقدم الخليقة كهيكل ملكي يبنيه الله، ويتوج بجلوسه على عرشه في اليوم السابع. والإنسان هو «الصورة» التي يضعها الملك في هيكله، ككاهن وملك تابع."}],"questions":["كيف يغير إيمانك بأن \"في البدء الله\" نظرتك لمعنى الحياة؟","ما الذي تعلّمه عن قوة كلمة الله من \"قال الله... فكان\"؟","كيف يؤثر أن \"كل إنسان على صورة الله\" على تعاملك مع من تختلف معهم أو تحتقرهم؟","ماذا يعني \"التسلط على الأرض\" كوكيل لله؟ كيف تمارسه في عملك واهتمامك بالخليقة؟","هل ترى العالم المادي «حسناً جداً»؟ كيف يؤثر هذا على نظرتك للجسد والطعام والطبيعة؟","أين ترى «خراباً وفراغاً» في حياتك يحتاج أن يتكلم الله فيه؟"],"apply":"اخرج هذا الأسبوع إلى الطبيعة (حديقة، أو بحر، أو سماء الليل)، واقرأ تكوين 1 هناك. توقف عند كل يوم، وسبّح الله على ما خلقه فيه. ثم انظر إلى شخص صعب في حياتك، وقل في قلبك: \"هذا مخلوق على صورة الله\"، وعامله بهذه الكرامة.","keyVerseText":"فَخَلَقَ ٱللهُ ٱلْإِنْسَانَ عَلَى صُورَتِهِ. عَلَى صُورَةِ ٱللهِ خَلَقَهُ. ذَكَرًا وَأُنْثَى خَلَقَهُمْ.","keyVerseLabel":"التكوين ١: ٢٧"},"text":[{"number":1,"text":"فِي ٱلْبَدْءِ خَلَقَ ٱللهُ ٱلسَّمَاوَاتِ وَٱلْأَرْضَ."},{"number":2,"text":"وَكَانَتِ ٱلْأَرْضُ خَرِبَةً وَخَالِيَةً، وَعَلَى وَجْهِ ٱلْغَمْرِ ظُلْمَةٌ، وَرُوحُ ٱللهِ يَرِفُّ عَلَى وَجْهِ ٱلْمِيَاهِ."},{"number":3,"text":"وَقَالَ ٱللهُ: «لِيَكُنْ نُورٌ»، فَكَانَ نُورٌ."},{"number":4,"text":"وَرَأَى ٱللهُ ٱلنُّورَ أَنَّهُ حَسَنٌ. وَفَصَلَ ٱللهُ بَيْنَ ٱلنُّورِ وَٱلظُّلْمَةِ."},{"number":5,"text":"وَدَعَا ٱللهُ ٱلنُّورَ نَهَارًا، وَٱلظُّلْمَةُ دَعَاهَا لَيْلًا. وَكَانَ مَسَاءٌ وَكَانَ صَبَاحٌ يَوْمًا وَاحِدًا."},{"number":6,"text":"وَقَالَ ٱللهُ: «لِيَكُنْ جَلَدٌ فِي وَسَطِ ٱلْمِيَاهِ. وَلْيَكُنْ فَاصِلًا بَيْنَ مِيَاهٍ وَمِيَاهٍ»."},{"number":7,"text":"فَعَمِلَ ٱللهُ ٱلْجَلَدَ، وَفَصَلَ بَيْنَ ٱلْمِيَاهِ ٱلَّتِي تَحْتَ ٱلْجَلَدِ وَٱلْمِيَاهِ ٱلَّتِي فَوْقَ ٱلْجَلَدِ. وَكَانَ كَذَلِكَ."},{"number":8,"text":"وَدَعَا ٱللهُ ٱلْجَلَدَ سَمَاءً. وَكَانَ مَسَاءٌ وَكَانَ صَبَاحٌ يَوْمًا ثَانِيًا."},{"number":9,"text":"وَقَالَ ٱللهُ: «لِتَجْتَمِعِ ٱلْمِيَاهُ تَحْتَ ٱلسَّمَاءِ إِلَى مَكَانٍ وَاحِدٍ، وَلْتَظْهَرِ ٱلْيَابِسَةُ». وَكَانَ كَذَلِكَ."},{"number":10,"text":"وَدَعَا ٱللهُ ٱلْيَابِسَةَ أَرْضًا، وَمُجْتَمَعَ ٱلْمِيَاهِ دَعَاهُ بِحَارًا. وَرَأَى ٱللهُ ذَلِكَ أَنَّهُ حَسَنٌ."},{"number":11,"text":"وَقَالَ ٱللهُ: «لِتُنْبِتِ ٱلْأَرْضُ عُشْبًا وَبَقْلًا يُبْزِرُ بِزْرًا، وَشَجَرًا ذَا ثَمَرٍ يَعْمَلُ ثَمَرًا كَجِنْسِهِ، بِزْرُهُ فِيهِ عَلَى ٱلْأَرْضِ». وَكَانَ كَذَلِكَ."},{"number":12,"text":"فَأَخْرَجَتِ ٱلْأَرْضُ عُشْبًا وَبَقْلًا يُبْزِرُ بِزْرًا كَجِنْسِهِ، وَشَجَرًا يَعْمَلُ ثَمَرًا بِزْرُهُ فِيهِ كَجِنْسِهِ. وَرَأَى ٱللهُ ذَلِكَ أَنَّهُ حَسَنٌ."},{"number":13,"text":"وَكَانَ مَسَاءٌ وَكَانَ صَبَاحٌ يَوْمًا ثَالِثًا."},{"number":14,"text":"وَقَالَ ٱللهُ: «لِتَكُنْ أَنْوَارٌ فِي جَلَدِ ٱلسَّمَاءِ لِتَفْصِلَ بَيْنَ ٱلنَّهَارِ وَٱللَّيْلِ، وَتَكُونَ لِآيَاتٍ وَأَوْقَاتٍ وَأَيَّامٍ وَسِنِينٍ."},{"number":15,"text":"وَتَكُونَ أَنْوَارًا فِي جَلَدِ ٱلسَّمَاءِ لِتُنِيرَ عَلَى ٱلْأَرْضِ». وَكَانَ كَذَلِكَ."},{"number":16,"text":"فَعَمِلَ ٱللهُ ٱلنُّورَيْنِ ٱلْعَظِيمَيْنِ: ٱلنُّورَ ٱلْأَكْبَرَ لِحُكْمِ ٱلنَّهَارِ، وَٱلنُّورَ ٱلْأَصْغَرَ لِحُكْمِ ٱللَّيْلِ، وَٱلنُّجُومَ."},{"number":17,"text":"وَجَعَلَهَا ٱللهُ فِي جَلَدِ ٱلسَّمَاءِ لِتُنِيرَ عَلَى ٱلْأَرْضِ،"},{"number":18,"text":"وَلِتَحْكُمَ عَلَى ٱلنَّهَارِ وَٱللَّيْلِ، وَلِتَفْصِلَ بَيْنَ ٱلنُّورِ وَٱلظُّلْمَةِ. وَرَأَى ٱللهُ ذَلِكَ أَنَّهُ حَسَنٌ."},{"number":19,"text":"وَكَانَ مَسَاءٌ وَكَانَ صَبَاحٌ يَوْمًا رَابِعًا."},{"number":20,"text":"وَقَالَ ٱللهُ: «لِتَفِضِ ٱلْمِيَاهُ زَحَّافَاتٍ ذَاتَ نَفْسٍ حَيَّةٍ، وَلْيَطِرْ طَيْرٌ فَوْقَ ٱلْأَرْضِ عَلَى وَجْهِ جَلَدِ ٱلسَّمَاءِ»."},{"number":21,"text":"فَخَلَقَ ٱللهُ ٱلتَّنَانِينَ ٱلْعِظَامَ، وَكُلَّ ذَوَاتِ ٱلْأَنْفُسِ ٱلْحيَّةِ ٱلدَّبَّابَةِ ٱلْتِى فَاضَتْ بِهَا ٱلْمِيَاهُ كَأَجْنَاسِهَا، وَكُلَّ طَائِرٍ ذِي جَنَاحٍ كَجِنْسِهِ. وَرَأَى ٱللهُ ذَلِكَ أَنَّهُ حَسَنٌ."},{"number":22,"text":"وَبَارَكَهَا ٱللهُ قَائِلًا: «أَثْمِرِي وَٱكْثُرِي وَٱمْلَإِي ٱلْمِيَاهَ فِي ٱلْبِحَارِ. وَلْيَكْثُرِ ٱلطَّيْرُ عَلَى ٱلْأَرْضِ»."},{"number":23,"text":"وَكَانَ مَسَاءٌ وَكَانَ صَبَاحٌ يَوْمًا خَامِسًا."},{"number":24,"text":"وَقَالَ ٱللهُ: «لِتُخْرِجِ ٱلْأَرْضُ ذَوَاتِ أَنْفُسٍ حَيَّةٍ كَجِنْسِهَا: بَهَائِمَ، وَدَبَّابَاتٍ، وَوُحُوشَ أَرْضٍ كَأَجْنَاسِهَا». وَكَانَ كَذَلِكَ."},{"number":25,"text":"فَعَمِلَ ٱللهُ وُحُوشَ ٱلْأَرْضِ كَأَجْنَاسِهَا، وَٱلْبَهَائِمَ كَأَجْنَاسِهَا، وَجَمِيعَ دَبَّابَاتِ ٱلْأَرْضِ كَ   let m;
  if (h === 'genesis') return { v: 'book' };
  if ((m = /^genesis-(\d+)$/.exec(h))) return { v: 'chapter', n: Math.min(50, Math.max(1, +m[1])) };
  return { v: 'home' };
}
function go(h) { if (location.hash.slice(1) === h) render(); else location.hash = h; }
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });

let tab = store.get('tab', 'text');
const scrollMem = {};

function render() {
  closeSheet(); $('#vpop').classList.remove('on');
  const r = route();
  if (r.v === 'home') return renderHome();
  if (r.v === 'book') return renderBook();
  return renderChapter(r.n);
}

// ---------- home ----------
let testament = store.get('testament', 'ot');
function renderHome() {
  const last = store.get('last', 1);
  const list = (t) => DATA.books.filter((b) => b.t === t);
  const items = (bs) => bs.map((b) => `<button class="item" data-book="${b.slug}">
      <span class="tx"><b>${esc(b.name)}</b><small>${ar(b.n)} ${b.n > 10 ? 'أصحاحاً' : 'أصحاحات'}</small></span>
      ${b.done ? '<span class="pill">دراسة كاملة</span>' : ''}${I.chev}</button>`).join('');
  $('#app').innerHTML = `
  <header class="top"><div class="row">
    <span class="ibtn"></span>
    <div class="ttl"><b>لمجد الله</b></div>
    <button class="ibtn" data-open="settings" aria-label="إعدادات القراءة">${I.aa}</button>
  </div></header>
  <main class="wrap">
    <section class="hello">
      <h1 class="brand">أهلاً بك</h1>
      <p class="lede">اقرأ الكلمة، وافهمها، وعشها. أصحاح واحد كل مرة.</p>
    </section>
    <a class="continue" href="#genesis-${last}">
      <span class="art"><svg viewBox="0 0 40 40" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="20" cy="20" r="8"/><path d="M20 4v4M20 32v4M4 20h4M32 20h4M8.7 8.7l2.8 2.8M28.5 28.5l2.8 2.8M8.7 31.3l2.8-2.8M28.5 11.5l2.8-2.8"/></svg></span>
      <span><small>تابع القراءة</small><b>التكوين ${ar(last)}</b><em>${esc(DATA.titles[last - 1])}</em></span>
    </a>
    <label class="search">${I.search}<input id="q" type="search" placeholder="ابحث عن سفر..." autocomplete="off"></label>
    <div class="seg" role="group">
      <button data-t="ot" aria-pressed="${testament === 'ot'}">العهد القديم</button>
      <button data-t="nt" aria-pressed="${testament === 'nt'}">العهد الجديد</button>
    </div>
    <div class="list" id="books">${items(list(testament))}</div>
  </main>`;
  $('#q').addEventListener('input', (e) => {
    const q = e.target.value.trim();
    $('#books').innerHTML = q ? items(DATA.books.filter((b) => b.name.includes(q))) || '<div class="empty"><b>لا نتائج</b></div>' : items(list(testament));
  });
  document.querySelectorAll('.seg button').forEach((b) => b.onclick = () => { testament = b.dataset.t; store.set('testament', testament); renderHome(); });
}

// ---------- book ----------
let bookTab = 'chapters';
function renderBook() {
  const last = store.get('last', 1);
  const rows = SECTIONS.map(([a, z, name]) => `<div class="group">${name} · ${ar(a)}–${ar(z)}</div><div class="list">` +
    Array.from({ length: z - a + 1 }, (_, i) => a + i).map((n) => `<a class="item${n === last ? ' cur' : ''}" href="#genesis-${n}">
      <span class="num">${ar(n)}</span><span class="tx"><b>${esc(DATA.titles[n - 1])}</b></span>${I.chev}</a>`).join('') + '</div>').join('');
  $('#app').innerHTML = `
  <header class="top"><div class="row">
    <a class="ibtn" href="#home" aria-label="الرئيسية">${I.back}</a>
    <div class="ttl"><b>سفر التكوين</b><small>٥٠ أصحاحاً</small></div>
    <button class="ibtn" data-open="settings">${I.aa}</button>
  </div></header>
  <main class="wrap">
    <div class="hero">${heroArt()}</div>
    <span class="eyebrow" style="display:block;margin-top:18px">التوراة · السفر ١ من ٦٦</span>
    <h1 class="btitle" style="margin-top:2px">التكوين</h1>
    <p class="lede" style="font-size:var(--fs);line-height:1.85;color:var(--ink)">${md(DATA.intro.summary.split('. ').slice(0, 2).join('. '))}.</p>
    <div class="cta">
      <a class="btn primary" href="#genesis-${last}">${last > 1 ? 'تابع: الأصحاح ' + ar(last) : 'ابدأ القراءة'}</a>
    </div>
    <div class="seg">
      <button data-bt="chapters" aria-pressed="${bookTab === 'chapters'}">الأصحاحات</button>
      <button data-bt="about" aria-pressed="${bookTab === 'about'}">عن السفر</button>
    </div>
    ${bookTab === 'chapters' ? rows : aboutBook()}
  </main>`;
  document.querySelectorAll('[data-bt]').forEach((b) => b.onclick = () => { bookTab = b.dataset.bt; renderBook(); });
}
function aboutBook() {
  const parts = ['اقرأ أولاً', 'المقدمة والخلفية', 'الرسالة ومفاتيحها', 'البنية', 'اللاهوت', 'أصوات مُصلَحة', 'الخلاصة والتأمل'];
  return `<p style="margin:16px 4px 0">${md(DATA.intro.summary)}</p>
  <div class="group">المقدمة في سبعة أجزاء قصيرة</div>
  <div class="list">${parts.map((p, i) => `<button class="item" data-soon><span class="num">${ar(i + 1)}</span><span class="tx"><b>${p}</b><small>${ar(3 + (i % 3))} دقائق قراءة</small></span>${I.chev}</button>`).join('')}</div>`;
}
function heroArt() {
  return `<svg viewBox="0 0 360 170" aria-hidden="true">
    <rect width="360" height="170" fill="var(--gold-soft)"/>
    <circle cx="270" cy="70" r="38" fill="var(--accent)" opacity=".9"/>
    <path d="M0 130 C60 100 110 120 170 108 S290 92 360 112 V170 H0Z" fill="var(--gold)" opacity=".55"/>
    <path d="M0 145 C70 128 140 150 210 136 S320 128 360 140 V170 H0Z" fill="var(--ink)" opacity=".85"/>
    <g stroke="var(--ink)" stroke-width="2" fill="none" opacity=".7"><path d="M60 60q8-8 16 0q8-8 16 0"/><path d="M110 40q6-6 12 0q6-6 12 0"/></g>
  </svg>`;
}

// ---------- chapter ----------
function renderChapter(n) {
  store.set('last', n);
  const has = n === 1;
  const C = DATA.ch;
  const title = DATA.titles[n - 1];
  $('#app').innerHTML = `
  <header class="top">
    <div class="row">
      <a class="ibtn" href="#genesis" aria-label="سفر التكوين">${I.back}</a>
      <div class="ttl"><b>التكوين ${ar(n)}</b><small>${esc(title)}</small></div>
      <button class="ibtn" data-open="settings" aria-label="إعدادات القراءة">${I.aa}</button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="text" aria-selected="${tab === 'text'}">النص</button>
      <button class="tab" role="tab" data-tab="study" aria-selected="${tab === 'study'}">الدراسة</button>
      <button class="tab" role="tab" data-tab="reflect" aria-selected="${tab === 'reflect'}">للتأمل</button>
    </div>
  </header>
  <main class="wrap" id="pane">${has ? pane(tab, C, n) : soon(n)}</main>
  <nav class="bottom"><div class="row">
    <a class="nav" href="#genesis-${n - 1}" ${n === 1 ? 'disabled style="pointer-events:none"' : ''}>${I.prev}<span>${n > 1 ? 'التكوين ' + ar(n - 1) : 'السابق'}</span></a>
    <button class="mid" data-open="chapters">${I.grid}الأصحاحات</button>
    <a class="nav next" href="#genesis-${n + 1}" ${n === 50 ? 'disabled style="pointer-events:none"' : ''}><span>${n < 50 ? 'التكوين ' + ar(n + 1) : 'التالي'}</span>${I.next}</a>
  </div></nav>`;
  document.querySelectorAll('.tab').forEach((t) => t.onclick = () => {
    scrollMem[tab] = window.scrollY;
    tab = t.dataset.tab; store.set('tab', tab);
    document.querySelectorAll('.tab').forEach((x) => x.setAttribute('aria-selected', x === t));
    $('#pane').innerHTML = has ? pane(tab, C, n) : soon(n);
    bindPane();
    window.scrollTo(0, scrollMem[tab] || 0);
  });
  bindPane();
}
function soon(n) {
  return `<div class="empty"><b>التكوين ${ar(n)}</b>${esc(DATA.titles[n - 1])}<p class="note">في هذا النموذج: التكوين ١ فقط مُعبّأ بالمحتوى. جرّب التنقل بالأزرار تحت، أو اسحب يميناً ويساراً.</p></div>`;
}
function pane(t, C, n) {
  if (t === 'text') return textPane(C, n);
  if (t === 'study') return studyPane(C);
  return reflectPane(C);
}
function textPane(C, n) {
  const kv = /\.(\d+)(?:-(\d+))?$/.exec(C.keyVerse); const k1 = +kv[1], k2 = +(kv[2] || kv[1]);
  const per = Object.fromEntries(C.pericopes.map((p) => [p.at, p.t]));
  let html = '', open = false;
  for (const v of DATA.text) {
    if (per[v.number]) { if (open) html += '</p>'; html += `<h3 class="peri">${esc(per[v.number])}</h3><p>`; open = true; }
    else if (!open) { html += '<p>'; open = true; }
    html += `<span class="v${v.number >= k1 && v.number <= k2 ? ' key' : ''}" data-v="${v.number}"><span class="vn">${ar(v.number)}</span>${esc(v.text)} </span>`;
  }
  if (open) html += '</p>';
  return `<div class="chhead"><span class="eyebrow">${ar(esc(C.section))}</span><h1>${esc(C.title)}</h1></div>
  <div class="scripture">${html}</div>
  <a class="nextcard" href="#genesis-${n + 1}"><small>الأصحاح التالي</small><b>${esc(DATA.titles[n])}</b><span>التكوين ${ar(n + 1)} ←</span></a>`;
}
function acc(icon, label, count, body, open) {
  return `<details${open ? ' open' : ''}><summary><span class="ico">${I[icon]}</span><span class="lbl">${label}</span><span class="cnt">${count ? ar(count) : ''}</span>${I.arr}</summary><div class="body">${body}</div></details>`;
}
function studyPane(C) {
  const people = [...C.people.map((p) => ({ ...p, k: 'شخص' })), ...C.places.map((p) => ({ ...p, k: 'مكان' }))];
  const tagName = { agreed: 'متفق عليه', debated: 'قضية تفسيرية', majority: 'الرأي الراجح' };
  return `
  <div class="lead"><h3>نظرة عامة</h3><p class="clamp" id="where">${md(C.where)}</p><button class="more" data-more="where">اقرأ المزيد</button></div>
  <div class="christ"><h3>المسيح في هذا الأصحاح</h3>${C.christ.map((p) => `<p>${md(p)}</p>`).join('')}</div>
  <div class="acc">
    ${acc('list', 'تقسيم الأصحاح', C.outline.length, `<ul class="outline">${C.outline.map((o) => `<li><span class="r">الآيات ${ar(o.r.replace('-', '–'))}</span>${md(o.t)}</li>`).join('')}</ul>`)}
    ${acc('people', 'أشخاص وأماكن', people.length, people.map((p) => `<div class="entry"><b>${esc(p.n)}</b><p>${md(p.d)}</p></div>`).join(''))}
    ${acc('lamp', 'خلفيات تساعدك تفهم', C.background.length, C.background.map((b) => `<div class="entry"><b>${esc(b.t)}</b><p>${md(b.d)}</p></div>`).join(''))}
    ${acc('word', 'كلمات مفتاحية', C.words.length, C.words.map((w) => `<div class="entry"><b>${esc(w.w)} <span class="orig">${esc(w.orig)}</span></b><p>${md(w.d)}</p></div>`).join(''))}
    ${acc('link', 'شواهد مرتبطة', C.links.length, C.links.map((l) => `<div class="entry"><span class="ref">${esc(l.label)}</span><p>${md(l.d)}</p></div>`).join(''))}
    ${acc('q', 'أسئلة صعبة', C.hard.length, C.hard.map((h) => `<div class="entry"><span class="tag ${h.tag}">${tagName[h.tag] || ''}</span><b>${md(h.q)}</b>${h.a.map((a) => `<p>${md(a)}</p>`).join('')}</div>`).join(''))}
    ${acc('voice', 'أصوات مُصلَحة', C.voices.length, C.voices.map((v) => `<div class="entry"><b>${esc(v.n)}</b><span class="who">${ar(esc(v.y))} · ${ar(esc(v.w))}</span><p>${md(v.b)}</p></div>`).join(''))}
  </div>`;
}
function reflectPane(C) {
  return `
  <div class="kv"><q>${esc(C.keyVerseText)}</q><small>${esc(C.keyVerseLabel)}</small></div>
  <h2 class="h2">أسئلة للتفكير</h2>
  <ol class="qs">${C.questions.map((q) => `<li>${md(q)}</li>`).join('')}</ol>
  <div class="apply"><h3>خطوة هذا الأسبوع</h3><p>${md(C.apply)}</p></div>`;
}
function bindPane() {
  const m = $('[data-more]');
  if (m) m.onclick = () => { $('#' + m.dataset.more).classList.remove('clamp'); m.remove(); };
  document.querySelectorAll('.v').forEach((v) => v.onclick = () => {
    document.querySelectorAll('.v.tapped').forEach((x) => x.classList.remove('tapped'));
    v.classList.add('tapped'); $('#vpop').classList.add('on'); $('#vpop').dataset.v = v.dataset.v;
  });
}
$('#vpop').onclick = (e) => {
  const a = e.target.dataset.act; if (!a) return;
  const v = +$('#vpop').dataset.v;
  if (a === 'copy') { const t = DATA.text[v - 1].text + ' (التكوين ١: ' + ar(v) + ')'; navigator.clipboard?.writeText(t).then(() => toast('نُسخت الآية'), () => toast('تعذّر النسخ هنا')); }
  if (a === 'study') { toast('لاحقاً: ملاحظات الدراسة الخاصة بهذه الآية'); }
  $('#vpop').classList.remove('on'); document.querySelectorAll('.v.tapped').forEach((x) => x.classList.remove('tapped'));
};

// ---------- sheets ----------
function openSheet(kind) {
  const sh = $('#sheet');
  if (kind === 'chapters') {
    const cur = route().n || store.get('last', 1);
    sh.innerHTML = `<div class="grab"></div><h4>سفر التكوين</h4><p class="sub">اختر أصحاحاً</p>
    <div class="grid">${Array.from({ length: 50 }, (_, i) => `<button data-ch="${i + 1}" class="${i + 1 === cur ? 'cur' : ''}${i === 0 ? ' has' : ''}">${ar(i + 1)}</button>`).join('')}</div>
    <div class="cta" style="margin-top:18px"><a class="btn ghost" href="#genesis">${I.book.replace('<svg', '<svg width="18" height="18" style="stroke:currentColor;fill:none;stroke-width:2"')}عن السفر</a><a class="btn ghost" href="#home">كل الأسفار</a></div>`;
  } else {
    sh.innerHTML = `<div class="grab"></div><h4>إعدادات القراءة</h4><p class="sub">تُحفظ على جهازك</p>
    <div class="opt"><label>حجم الخط</label><div class="sizes"><button data-size="-1">أ-</button><span class="bar"><i style="width:${(S.size + 1) / SIZES.length * 100}%"></i></span><button data-size="1">أ+</button></div></div>
    <div class="opt"><label>خط الدراسة والشرح</label><div class="chips">${['plex', 'readex', 'naskh'].map((k) => `<button class="chip" data-read="${k}" aria-pressed="${S.read === k}"><b style="font-family:${FONTS[k][0]}">الكلمة</b><small>${FONTS[k][1]}</small></button>`).join('')}</div></div>
    <div class="opt"><label>خط نص الكتاب</label><div class="chips">${['naskh', 'amiri', 'plex'].map((k) => `<button class="chip" data-scr="${k}" aria-pressed="${S.scr === k}"><b style="font-family:${FONTS[k][0]}">فِي ٱلْبَدْءِ</b><small>${FONTS[k][1]}</small></button>`).join('')}</div></div>
    <div class="opt"><label>المظهر</label><div class="chips">${[['light', 'فاتح'], ['paper', 'ورقي'], ['dark', 'داكن']].map(([k, l]) => `<button class="chip" data-theme="${k}" aria-pressed="${S.theme === k}"><small style="font-size:14px;color:var(--ink)">${l}</small></button>`).join('')}</div></div>`;
  }
  sh.classList.add('on'); $('#scrim').classList.add('on');
}
function closeSheet() { $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); }
$('#scrim').onclick = closeSheet;
$('#sheet').addEventListener('click', (e) => {
  const b = e.target.closest('button,a'); if (!b) return;
  if (b.dataset.ch) { closeSheet(); go('genesis-' + b.dataset.ch); return; }
  if (b.tagName === 'A') { closeSheet(); return; }
  if (b.dataset.size) S.size = Math.max(0, Math.min(SIZES.length - 1, S.size + +b.dataset.size));
  if (b.dataset.read) S.read = b.dataset.read;
  if (b.dataset.scr) S.scr = b.dataset.scr;
  if (b.dataset.theme) S.theme = b.dataset.theme;
  applySettings(); openSheet('settings');
});
document.addEventListener('click', (e) => {
  const o = e.target.closest('[data-open]'); if (o) { openSheet(o.dataset.open); return; }
  const bk = e.target.closest('[data-book]');
  if (bk) { if (bk.dataset.book === 'genesis') go('genesis'); else toast('في النموذج: سفر التكوين فقط'); return; }
  if (e.target.closest('[data-soon]')) toast('في النموذج: محتوى المقدمة سيظهر هنا');
  if (!e.target.closest('.v,#vpop')) { $('#vpop').classList.remove('on'); document.querySelectorAll('.v.tapped').forEach((x) => x.classList.remove('tapped')); }
});
let tt;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1800); }

// ---------- swipe between chapters ----------
let sx = 0, sy = 0, st = 0;
document.addEventListener('touchstart', (e) => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; st = Date.now(); }, { passive: true });
document.addEventListener('touchend', (e) => {
  const r = route(); if (r.v !== 'chapter' || $('#sheet').classList.contains('on')) return;
  const t = e.changedTouches[0]; const dx = t.clientX - sx, dy = t.clientY - sy;
  if (Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy) * 2 && Date.now() - st < 600) {
    const n = dx < 0 ? r.n + 1 : r.n - 1; // RTL: swipe left = next
    if (n >= 1 && n <= 50) go('genesis-' + n);
  }
}, { passive: true });

if (!location.hash) history.replaceState(null, '', '#home');
render();
</script>
</body>
</html>
